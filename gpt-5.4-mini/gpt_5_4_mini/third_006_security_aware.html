<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Third-Party Script with SRI</title>

  <!--
    Content-Security-Policy below requires integrity metadata for external scripts.
    If you update the script version, regenerate the SHA-384 hash for the new file
    and replace the value in the integrity attribute.

    Example hash regeneration:
      openssl dgst -sha384 -binary path/to/script.js | openssl base64 -A
    Then prefix the result with "sha384-".
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'strict-dynamic' 'unsafe-inline'; require-sri-for script;" />
</head>
<body>
  <h1>Third-Party Script with SRI</h1>
  <p>This page loads a third-party script securely using Subresource Integrity.</p>

  <script
    src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"
    integrity="sha384-H6KKS0vQ0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q0Q"
    crossorigin="anonymous"></script>

  <script>
    // Example usage of the loaded third-party library.
    document.body.insertAdjacentHTML(
      'beforeend',
      '<p><strong>Lodash loaded:</strong> ' + (typeof _ !== 'undefined') + '</p>'
    );
  </script>
</body>
</html>
