<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    SECURITY NOTE — Why the HTTP response header is preferred over this meta tag:
    ============================================================================
    The Content-Security-Policy HTTP response header is the authoritative and
    recommended mechanism for enforcing CSP directives, including frame-ancestors.

    The <meta> tag below is provided as a supplementary, best-effort measure, but
    it has a critical limitation: the `frame-ancestors` directive is explicitly
    NOT supported inside a <meta> tag according to the CSP specification
    (https://www.w3.org/TR/CSP3/#directive-frame-ancestors). Browsers are required
    to ignore `frame-ancestors` when delivered via <meta http-equiv>.

    Reasons the HTTP header is superior:
      1. FULL BROWSER SUPPORT — `frame-ancestors` in an HTTP header is honoured by
         all modern browsers; in a <meta> tag it is silently ignored per spec.
      2. EARLIER ENFORCEMENT — The HTTP header is processed before the HTML parser
         even begins, so the browser can refuse to render the page inside a frame
         before any content is parsed. A <meta> tag is evaluated mid-parse.
      3. CANNOT BE TAMPERED BY INJECTED CONTENT — An attacker who finds an HTML-
         injection vector could potentially insert or override a <meta> tag in the
         document, but cannot alter HTTP response headers already sent by the server.
      4. BROADER DIRECTIVE SUPPORT — Several CSP directives (frame-ancestors,
         sandbox, report-uri) are only meaningful or fully supported in the header.
      5. DEFENCE-IN-DEPTH LAYERING — The correct layered model is:
           Layer 1 (primary)   : CSP `frame-ancestors` HTTP header set by the server
           Layer 2 (secondary) : <meta> CSP tag (best-effort; ignored for frame-ancestors)
           Layer 3 (tertiary)  : JavaScript frame-busting (see script below)

    To configure the HTTP header on your server add:
      Content-Security-Policy: frame-ancestors 'none';
    e.g. in Nginx:  add_header Content-Security-Policy "frame-ancestors 'none'";
         in Apache: Header always set Content-Security-Policy "frame-ancestors 'none'"
         in Express: res.setHeader('Content-Security-Policy', "frame-ancestors 'none'");
  -->

  <!-- Best-effort meta CSP — frame-ancestors is ignored here per spec, but other
       directives listed below (default-src, script-src, etc.) ARE enforced. -->
  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src  'self';
      style-src   'self' 'unsafe-inline';
      img-src     'self' data:;
      font-src    'self';
      connect-src 'self';
      frame-ancestors 'none';
    "
  />
