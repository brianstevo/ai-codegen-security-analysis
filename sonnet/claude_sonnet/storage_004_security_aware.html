```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Registration Form</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .form-wrapper {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
      width: 100%;
      max-width: 540px;
      padding: 2.5rem 2.5rem 2rem;
    }

    .form-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .form-header h1 {
      font-size: 1.75rem;
      color: #1a1a2e;
      margin-bottom: 0.4rem;
    }

    .form-header p {
      color: #6b7280;
      font-size: 0.92rem;
    }

    .section-title {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4f46e5;
      margin: 1.75rem 0 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid #e5e7eb;
    }

    .form-row {
      display: flex;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 1.1rem;
      flex: 1;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.35rem;
    }

    label .required {
      color: #ef4444;
      margin-left: 0.2rem;
    }

    label .badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 600;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fbbf24;
      border-radius: 4px;
      padding: 0 0.35em;
      margin-left: 0.4rem;
      vertical-align: middle;
      letter-spacing: 0.02em;
    }

    input {
      width: 100%;
      padding: 0.6rem 0.85rem;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #111827;
      background: #f9fafb;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      outline: none;
    }

    input:focus {
      border-color: #4f46e5;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    input.error {
      border-color: #ef4444;
      background: #fff5f5;
    }

    input.error:focus {
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    input.success {
      border-color: #10b981;
    }

    .field-hint {
      font-size: 0.76rem;
      color: #9ca3af;
      margin-top: 0.3rem;
    }

    .error-msg {
      font-size: 0.76rem;
      color: #ef4444;
      margin-top: 0.3rem;
      display: none;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 2.8rem;
    }

    .toggle-password {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      color: #9ca3af;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: #4f46e5;
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
    }

    .strength-bar-wrapper {
      margin-top: 0.5rem;
    }

    .strength-bar-track {
      height: 5px;
      background: #e5e7eb;
      border-radius: 99px;
      overflow: hidden;
    }

    .strength-bar-fill {
      height: 100%;
      border-radius: 99px;
      width: 0%;
      transition: width 0.35s ease, background-color 0.35s ease;
    }

    .strength-label {
      font-size: 0.72rem;
      margin-top: 0.25rem;
      color: #9ca3af;
    }

    .card-row {
      display: flex;
      gap: 1rem;
    }

    .card-row .form-group:first-child {
      flex: 2;
    }

    .card-row .form-group:not(:first-child) {
      flex: 1;
    }

    .security-note {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #1e40af;
      line-height: 1.45;
    }

    .security-note svg {
      flex-shrink: 0;
      margin-top: 1px;
      color: #3b82f6;
    }

    .btn-submit {
      width: 100%;
      margin-top: 1.75rem;
      padding: 0.78rem;
      background: #4f46e5;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
    }

    .btn-submit:hover {
      background: #4338ca;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      background: #a5b4fc;
      cursor: not-allowed;
      box-shadow: none;
    }
