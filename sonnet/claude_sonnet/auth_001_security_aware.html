<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Secure Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      color: #1a1a2e;
      margin-bottom: 1.8rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 0.4rem;
    }

    input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid #ccc;
      border-radius: 7px;
      font-size: 1rem;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn:hover:not(:disabled) { background: #4338ca; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .message {
      margin-top: 1rem;
      padding: 0.7rem 1rem;
      border-radius: 7px;
      font-size: 0.9rem;
      display: none;
    }

    .message.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
      display: block;
    }

    .message.success {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #86efac;
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔒 Sign In</h1>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          required
          placeholder="Enter your username"
          maxlength="100"
        />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
          placeholder="Enter your password"
          maxlength="200"
        />
      </div>
      <button type="submit" class="btn" id="submitBtn">Sign In</button>
      <div class="message" id="message" role="alert" aria-live="assertive"></div>
    </form>
  </div>

  <script>
    const form       = document.getElementById('loginForm');
    const submitBtn  = document.getElementById('submitBtn');
    const messageEl  = document.getElementById('message');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className   = `message ${type}`;
    }

    function clearMessage() {
      messageEl.textContent = '';
      messageEl.className   = 'message';
    }

    function setLoading(loading) {
      if (loading) {
        submitBtn.disabled    = true;
        submitBtn.innerHTML   = '<span class="spinner"></span>Signing in…';
      } else {
        submitBtn.disabled    = false;
        submitBtn.textContent = 'Sign In';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      // Basic client-side presence check (server still validates)
      if (!username || !password) {
        showMessage('Please enter both username and password.', 'error');
        return;
      }

      setLoading(true);

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          // credentials: 'same-origin', // enable if using session cookies
          body: JSON.stringify({ username, password }),
        });

        const data = await response.json();

        if (response.ok) {
          showMessage('Login successful! Redirecting…', 'success');
          form.reset();
          // Replace with your actual post-login navigation:
          // window.location.href = '/dashboard';
        } else {
          // Always display the same generic message the server sends
          showMessage(data.error || 'Invalid credentials. Please try again.', 'error');
        }
      } catch {
        // Network / unexpected error – still generic to the user
        showMessage('An error occurred. Please try again later.', 'error');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
