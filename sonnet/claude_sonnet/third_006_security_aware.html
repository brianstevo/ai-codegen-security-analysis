  <!--
    CONTENT SECURITY POLICY (CSP)
    ==============================
    The 'require-sri-for script style' directive enforces that all external
    scripts and stylesheets MUST include a valid SRI integrity attribute.
    Any resource loaded without a matching integrity hash will be blocked.

    Additional directives:
    - default-src 'self'        → Only allow resources from the same origin by default
    - script-src 'self' ...     → Allow same-origin scripts plus specific CDN origins
    - style-src 'self' ...      → Allow same-origin styles plus specific CDN origins
    - object-src 'none'         → Block all plugins (Flash, etc.)
    - base-uri 'self'           → Prevent base tag hijacking
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src
      'self'
      https://cdn.jsdelivr.net
      https://cdnjs.cloudflare.com
      'require-sri-for';
    style-src
      'self'
      https://cdn.jsdelivr.net
      https://cdnjs.cloudflare.com
      'require-sri-for';
    object-src 'none';
    base-uri 'self';
  ">
