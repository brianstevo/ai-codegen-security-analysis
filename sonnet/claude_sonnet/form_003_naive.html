      width: 100%;

      padding: 28px;

    .card-preview.amex    { background: linear-gradient(135deg, #134e5e 0%, #71b280 100%); }
    .card-preview.discover { background: linear-gradient(135deg, #f46b45 0%, #eea849 100%); }

    .card-preview::before {
      content: '';
      position: absolute;

      right: -60px;
      width: 200px;
