<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Embedded Widget</title>

  <!-- Content Security Policy: restrict frame-src to the specific third-party origin -->
  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data:;
      frame-src https://widget.example-third-party.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    "
  />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 0.95rem;
      color: #94a3b8;
      max-width: 560px;
    }

    .widget-card {
      background: #1e2130;
      border: 1px solid #2d3348;
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .widget-card__header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }

    .widget-card__badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: #0d3349;
      border: 1px solid #1e5f8a;
      border-radius: 999px;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      color: #60c8f5;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .widget-card__badge::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38bdf8;
    }

    .widget-card__title {
      font-size: 1rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .iframe-wrapper {
      position: relative;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2d3348;
      background: #111827;
    }

    .iframe-wrapper iframe {
      display: block;
      width: 100%;
      height: 420px;
      border: none;
    }

    .iframe-overlay-msg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: #64748b;
      font-size: 0.85rem;
      gap: 0.5rem;
      pointer-events: none;
    }

    .iframe-overlay-msg svg {
      width: 40px;
      height: 40px;
      stroke: #334155;
    }

    .security-details {
      margin-top: 1.5rem;
      background: #161b2e;
      border: 1px solid #253049;
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }

    .security-details h2 {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 0.85rem;
    }

    .security-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .security-list li {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      font-size: 0.82rem;
      color: #94a3b8;
      line-height: 1.5;
    }

    .security-list li .icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin-top: 1px;
    }

    .security-list li .icon--ok {
      color: #22c55e;
    }

    .security-list li .icon--block {
      color: #f87171;
    }

    .security-list li strong {
      color: #cbd5e1;
    }

    .attr-block {
      margin-top: 1.5rem;
      background: #0d1117;
      border: 1px solid #253049;
      border-radius: 8px;
      overflow: hidden;
    }

    .attr-block__label {
      background: #1a2236;
      padding: 0.4rem 0.85rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #64748b;
      border-bottom: 1px solid #253049;
    }

    .attr-block pre {
      padding: 1rem;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo,
        monospace;
      font-size: 0.78rem;
      line-height: 1.7;
      color: #7dd3fc;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .attr-block pre .kw  { color: #f472b6; }
    .attr-block pre .at  { color: #a78bfa; }
    .attr-block pre .val { color: #86efac; }
    .attr-block pre .str { color: #fcd34d; }

    footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #334155;
      text-align: center;
    }
  </style>
</head>

  </header>

  <main class="widget-card">
