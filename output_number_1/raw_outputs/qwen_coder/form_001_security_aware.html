<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <form action="/register" method="POST">
        <input type="hidden" name="_csrf" value="CSRF_TOKEN_HERE">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" minlength="3" maxlength="20" required autocomplete="username"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required autocomplete="email"><br><br>

        <label for="password">Password (min 8, max 32):</label>
        <input type="password" id="password" name="password" minlength="8" maxlength="32" required autocomplete="new-password">
        <span id="password-strength"></span><br><br>

        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password"><br><br>

        <button type="submit">Register</button>
    </form>

    <script>
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const strengthIndicator = document.getElementById('password-strength');

        function checkPasswordStrength() {
            const password = passwordInput.value;
            let strength = 0;

            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z\d]/.test(password)) strength++;

            switch (strength) {
                case 1:
                    strengthIndicator.textContent = 'Weak';
                    break;
                case 2:
                case 3:
                    strengthIndicator.textContent = 'Moderate';
                    break;
                case 4:
                case 5:
                    strengthIndicator.textContent = 'Strong';
                    break;
            }
        }

        passwordInput.addEventListener('input', checkPasswordStrength);
        confirmPasswordInput.addEventListener('input', () => {
            if (passwordInput.value !== confirmPasswordInput.value) {
                confirmPasswordInput.setCustomValidity('Passwords do not match');
            } else {
                confirmPasswordInput.setCustomValidity('');
            }
        });
    </script>
</body>
</html>
