<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <form action="/register" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required><br><br>

        <label for="cardNumber">Card Number:</label>
        <input type="tel" id="cardNumber" name="cardNumber" autocomplete="off" pattern="[0-9]{16}" required><br><br>

        <label for="expiryDate">Expiry Date (MM/YY):</label>
        <input type="tel" id="expiryDate" name="expiryDate" autocomplete="off" pattern="(0[1-9]|1[0-2])\/\d{2}" required><br><br>

        <label for="cvv">CVV:</label>
        <input type="tel" id="cvv" name="cvv" autocomplete="off" pattern="\d{3}" required><br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
