<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile</title>
  <style>
    :root {
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --error: #dc2626;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    p.subtitle {
      margin: 0 0 20px;
      color: var(--muted);
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: 600;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      background: #fff;
      color: var(--text);
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 20px;
    }

    button {
      appearance: none;
      border: none;
      background: var(--primary);
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    button:hover { background: var(--primary-hover); }
    button:active { transform: translateY(1px); }
    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      display: none;
      font-size: 0.95rem;
    }

    .message.success {
      display: block;
      background: rgba(22, 163, 74, 0.1);
      color: var(--success);
      border: 1px solid rgba(22, 163, 74, 0.25);
    }

    .message.error {
      display: block;
      background: rgba(220, 38, 38, 0.08);
      color: var(--error);
      border: 1px solid rgba(220, 38, 38, 0.22);
    }

    .hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Edit Profile</h1>
    <p class="subtitle">Update your name and bio below.</p>

    <form id="profileForm">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required maxlength="100" />

      <label for="bio">Bio</label>
      <textarea id="bio" name="bio" maxlength="1000"></textarea>

      <div class="actions">
        <button type="submit" id="saveBtn">Save Changes</button>
      </div>

      <div id="message" class="message" aria-live="polite"></div>
      <div class="hint">Your changes will be saved to your profile.</div>
    </form>
  </main>

  <script>
    const profileForm = document.getElementById('profileForm');
    const nameInput = document.getElementById('name');
    const bioInput = document.getElementById('bio');
    const messageEl = document.getElementById('message');
    const saveBtn = document.getElementById('saveBtn');

    const userId = window.currentUserId || '123'; // Replace with real authenticated user ID
    const apiBaseUrl = window.apiBaseUrl || '';

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
    }

    async function loadProfile() {
      try {
        const res = await fetch(`${apiBaseUrl}/api/profile/${encodeURIComponent(userId)}`, {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });

        if (!res.ok) {
          throw new Error('Failed to load profile');
        }

        const data = await res.json();
        nameInput.value = data.name || '';
        bioInput.value = data.bio || '';
      } catch (err) {
        showMessage(err.message || 'Unable to load profile.', 'error');
      }
    }

    profileForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.style.display = 'none';
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      try {
        const payload = {
          name: nameInput.value.trim(),
          bio: bioInput.value.trim()
        };

        const res = await fetch(`${apiBaseUrl}/api/profile/${encodeURIComponent(userId)}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.error || 'Failed to update profile.');
        }

        showMessage('Profile updated successfully.', 'success');
      } catch (err) {
        showMessage(err.message || 'An unexpected error occurred.', 'error');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Changes';
      }
    });

    loadProfile();
  </script>
</body>
</html>
