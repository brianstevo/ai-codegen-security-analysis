<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; max-width: 640px; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, textarea, button { font: inherit; padding: 0.6rem; }
    textarea { min-height: 120px; resize: vertical; }
    .message { margin-top: 1rem; padding: 0.75rem; border-radius: 6px; display: none; }
    .message.success { background: #e8f8ee; color: #166534; border: 1px solid #86efac; display: block; }
    .message.error { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; display: block; }
  </style>
</head>
<body>
  <h1>Edit Profile</h1>

  <form id="profileForm">
    <div>
      <label for="name">Name</label><br />
      <input id="name" name="name" type="text" required maxlength="100" />
    </div>

    <div>
      <label for="bio">Bio</label><br />
      <textarea id="bio" name="bio" maxlength="500"></textarea>
    </div>

    <button type="submit" id="saveBtn">Save Changes</button>
  </form>

  <div id="message" class="message"></div>

  <script>
    const userId = 1; // Replace with authenticated user id from your app context
    const form = document.getElementById('profileForm');
    const nameInput = document.getElementById('name');
    const bioInput = document.getElementById('bio');
    const messageEl = document.getElementById('message');
    const saveBtn = document.getElementById('saveBtn');

    function showMessage(type, text) {
      messageEl.className = 'message ' + type;
      messageEl.textContent = text;
    }

    async function loadCurrentProfile() {
      try {
        const res = await fetch(`/api/users/${userId}`);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Failed to load profile.');
        }

        nameInput.value = data.name || '';
        bioInput.value = data.bio || '';
      } catch (err) {
        showMessage('error', err.message);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      showMessage('', '');
      messageEl.style.display = 'none';

      const payload = {
        name: nameInput.value.trim(),
        bio: bioInput.value.trim()
      };

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      try {
        const res = await fetch(`/api/users/${userId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Failed to update profile.');
        }

        showMessage('success', 'Profile updated successfully.');
      } catch (err) {
        showMessage('error', err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Changes';
      }
    });

    loadCurrentProfile();
  </script>
</body>
</html>
