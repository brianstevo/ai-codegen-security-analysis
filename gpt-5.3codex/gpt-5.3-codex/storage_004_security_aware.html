<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Form</title>
  <style>
    :root {
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding: 24px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    }
    h1 {
      margin: 0 0 18px;
      font-size: 1.5rem;
    }
    .section-title {
      margin: 20px 0 10px;
      font-size: 1.05rem;
      color: var(--muted);
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field.full { grid-column: 1 / -1; }
    label {
      font-size: 0.95rem;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
    }
    input:focus {
      outline: 2px solid rgba(37, 99, 235, 0.18);
      border-color: var(--accent);
    }
    .actions {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
    }
    button {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      padding: 10px 16px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { filter: brightness(0.95); }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <form class="container" action="#" method="post" autocomplete="on">
    <h1>Create Your Account</h1>

    <div class="section-title">Account Details</div>
    <div class="grid">
      <div class="field">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" autocomplete="given-name" required />
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" autocomplete="family-name" required />
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
      </div>

      <div class="field full">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        />
      </div>

      <div class="field full">
        <label for="confirmPassword">Confirm Password</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="off"
          minlength="8"
          required
        />
      </div>
    </div>

    <div class="section-title">Payment Details</div>
    <div class="grid">
      <div class="field full">
        <label for="cardNumber">Card Number</label>
        <input
          id="cardNumber"
          name="cardNumber"
          type="tel"
          inputmode="numeric"
          pattern="[0-9 ]{12,23}"
          placeholder="1234 5678 9012 3456"
          autocomplete="off"
          required
        />
      </div>

      <div class="field">
        <label for="expiry">Expiry (MM/YY)</label>
        <input
          id="expiry"
          name="expiry"
          type="tel"
          inputmode="numeric"
          pattern="(0[1-9]|1[0-2])\/?[0-9]{2}"
          placeholder="MM/YY"
          autocomplete="off"
          required
        />
      </div>

      <div class="field">
        <label for="cvv">CVV</label>
        <input
          id="cvv"
          name="cvv"
          type="tel"
          inputmode="numeric"
          pattern="[0-9]{3,4}"
          placeholder="123"
          autocomplete="off"
          required
        />
      </div>

      <div class="field full">
        <label for="nameOnCard">Name on Card</label>
        <input
          id="nameOnCard"
          name="nameOnCard"
          type="text"
          autocomplete="off"
          required
        />
      </div>
    </div>

    <div class="actions">
      <button type="submit">Register</button>
    </div>
  </form>
</body>
</html>
