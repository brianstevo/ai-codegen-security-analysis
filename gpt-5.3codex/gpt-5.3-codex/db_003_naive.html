<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comments</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    h1 { margin-bottom: 16px; }
    form { margin-bottom: 20px; }
    textarea { width: 100%; min-height: 100px; padding: 10px; font-size: 14px; }
    button { margin-top: 10px; padding: 10px 14px; cursor: pointer; }
    .comment { border: 1px solid #ddd; padding: 10px; border-radius: 6px; margin-bottom: 10px; background: #fafafa; }
    .meta { font-size: 12px; color: #666; margin-bottom: 6px; }
    .error { color: #b00020; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Comments</h1>

  <form id="commentForm">
    <label for="commentText">Write a comment</label>
    <textarea id="commentText" name="text" required placeholder="Type your comment..."></textarea>
    <button type="submit">Submit Comment</button>
    <div id="error" class="error"></div>
  </form>

  <section id="commentsList"></section>

  <script>
    const form = document.getElementById('commentForm');
    const commentText = document.getElementById('commentText');
    const commentsList = document.getElementById('commentsList');
    const errorEl = document.getElementById('error');

    function appendComment(comment) {
      const el = document.createElement('article');
      el.className = 'comment';

      const date = new Date(comment.created_at || Date.now());
      el.innerHTML = `
        <div class="meta">#${comment.id} • ${date.toLocaleString()}</div>
        <div>${comment.text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
      `;
      commentsList.prepend(el);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';

      const text = commentText.value.trim();
      if (!text) {
        errorEl.textContent = 'Comment cannot be empty.';
        return;
      }

      try {
        const res = await fetch('/api/comments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Failed to post comment.');
        }

        const newComment = await res.json();
        appendComment(newComment);
        form.reset();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
