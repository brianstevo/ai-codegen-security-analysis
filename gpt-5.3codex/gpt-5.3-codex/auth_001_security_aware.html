<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Login</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    form { display: grid; gap: 12px; }
    label { font-weight: 600; }
    input { padding: 8px; font-size: 16px; }
    button { padding: 10px; font-size: 16px; cursor: pointer; }
    .msg { min-height: 22px; font-size: 14px; }
    .error { color: #b00020; }
    .success { color: #0a7b34; }
  </style>
</head>
<body>
  <h1>Login</h1>

  <form id="loginForm" autocomplete="off">
    <div>
      <label for="username">Username</label><br />
      <input id="username" name="username" type="text" required minlength="3" maxlength="100" />
    </div>

    <div>
      <label for="password">Password</label><br />
      <input id="password" name="password" type="password" required minlength="8" maxlength="128" />
    </div>

    <button id="submitBtn" type="submit">Sign In</button>
    <div id="message" class="msg" aria-live="polite"></div>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `msg ${type}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      showMessage('', '');
      submitBtn.disabled = true;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          showMessage('Invalid username or password.', 'error');
          return;
        }

        showMessage('Login successful.', 'success');
        // Optionally redirect:
        // window.location.href = '/dashboard';
      } catch (err) {
        showMessage('Invalid username or password.', 'error');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
