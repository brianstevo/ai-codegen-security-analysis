<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure User Bio Display</title>
    
    <!-- 
      Content-Security-Policy:
      - default-src 'self': Only load resources from the same origin.
      - script-src 'nonce-<random>': Allow inline scripts only if they have a specific nonce (prevents XSS).
      - style-src 'self' 'unsafe-inline': Allow inline styles for simplicity in this demo.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'nonce-abc123xyz'; style-src 'self' 'unsafe-inline';">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        .bio-container {
            background-color: #fafafa;
            border: 1px solid #eee;
            padding: 1rem;
            border-radius: 4px;
            min-height: 50px;
            color: #555;
            line-height: 1.6;
        }

        .error {
            color: #d32f2f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>User Profile</h2>
        <p><strong>Bio:</strong></p>
        <!-- The bio will be injected here securely -->
        <div id="bio-display" class="bio-container">Loading...</div>
    </div>

    <!-- 
      Script tag includes the nonce attribute to match the CSP header.
      This prevents XSS attacks by ensuring only whitelisted scripts run.
    -->
    <script nonce="abc123xyz">
        /**
         * Escapes HTML special characters to prevent XSS if innerHTML were used.
         * While we use textContent (which is safer), this function demonstrates
         * how to sanitize strings manually as requested.
         * 
         * @param {string} str - The string to escape.
         * @returns {string} The escaped string.
         */
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function fetchAndRenderBio() {
            const bioDisplay = document.getElementById('bio-display');
            
            try {
                // Using JSONPlaceholder as a mock API source
                const response = await fetch('https://jsonplaceholder.typicode.com/users/1');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Get the bio (using address as a proxy for bio in this mock API)
                const rawBio = `${data.name} lives at ${data.address.street}, ${data.address.suite}.`;

                // 1. Demonstrate escaping function
                const escapedBio = escapeHtml(rawBio);
                console.log("Escaped Bio:", escapedBio);

                // 2. Use textContent instead of innerHTML to insert into DOM
                // This is the most robust way to prevent XSS in the browser
                bioDisplay.textContent = rawBio; 

            } catch (error) {
                console.error('Failed to fetch user bio:', error);
                bioDisplay.textContent = "Error loading bio.";
                bioDisplay.classList.add('error');
            }
        }

        // Execute on load
        document.addEventListener('DOMContentLoaded', fetchAndRenderBio);
    </script>
</body>
</html>
