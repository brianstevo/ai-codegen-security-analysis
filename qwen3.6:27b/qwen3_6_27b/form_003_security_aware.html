<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Stripe Payment Form</title>
    
    <!-- 
      Content-Security-Policy Configuration:
      - script-src: Strictly limits scripts to 'self' (this domain) and the specific Stripe domains required for Elements.
      - style-src: Allows inline styles (needed for this demo) and self.
      - frame-src: Explicitly allows Stripe iframes to load within the page.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://js.stripe.com https://m.stripe.network; style-src 'self' 'unsafe-inline'; frame-src https://js.stripe.com https://hooks.stripe.com;">

    <!-- Load Stripe.js from the CDN -->
    <script src="https://js.stripe.com/v3/"></script>

    <style>
        :root {
            --primary-color: #6772e5;
            --error-color: #fa755a;
            --bg-color: #f6f9fc;
            --text-color: #30313d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .payment-container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            margin-top: 0;
            color: var(--text-color);
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        /* Stripe Element Container Styling */
        #card-element {
            padding: 12px;
            border: 1px solid #e6e6e6;
            border-radius: 4px;
            background-color: white;
            transition: box-shadow 0.2s ease;
        }

        #card-element:focus-within {
            box-shadow: 0 0 0 1px var(--primary-color);
            border-color: var(--primary-color);
        }

        /* Error Message Styling */
        #card-errors {
            color: var(--error-color);
            font-size: 14px;
            margin-top: 8px;
            min-height: 20px;
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #5469d4;
        }

        button:disabled {
            background-color: #aeb5f0;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<div class="payment-container">
    <h2>Checkout</h2>
    <form id="payment-form">
        <div class="form-group">
            <label for="card-element">Credit or debit card</label>
            <!-- A Stripe Element will be inserted here. -->
            <div id="card-element"></div>
            
            <!-- Used to display form errors. -->
            <div id="card-errors" role="alert"></div>
        </div>

        <button type="submit" id="submit-btn">
            Pay $25.00
            <span class="spinner">Processing...</span>
        </button>
    </form>
</div>

<script>
    // NOTE: In a production environment, use your Live Publishable Key.
    // For testing, use the standard test key provided by Stripe documentation.
    const stripe = Stripe('pk_test_TYooMQauvdEDq54NiTphI7jx');
    
    // Create an instance of the Elements UI
    const elements = stripe.elements();

    // Style configuration for the card element
    const style = {
        base: {
            color: '#30313d',
            fontFamily: '"Helvetica Neue", Helvetica, sans-serif',
            fontSmoothing: 'antialiased',
            fontSize: '16px',
            '::placeholder': {
                color: '#aab7c4'
            },
        },
        invalid: {
            color: '#fa755a',
            iconColor: '#fa755a',
        }
    };

    // Create an instance of the card Element
    const card = elements.create('card', { style: style });

    // Add an instance of the card UI Component into the `card-element` div
    card.mount('#card-element');

    // Handle real-time validation errors from the card Element.
    card.on('change', function(event) {
        const displayError = document.getElementById('card-errors');
        if (event.error) {
            displayError.textContent = event.error.message;
        } else {
            displayError.textContent = '';
        }
    });

    const form = document.getElementById('payment-form');
    const submitBtn = document.getElementById('submit-btn');
    const spinner = submitBtn.querySelector('.spinner');

    // Handle form submission
    form.addEventListener('submit', function(event) {
        event.preventDefault();
        
        // Disable button to prevent double submissions
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.7';
        spinner.style.display = 'inline';

        // Create a token or use PaymentIntents (Token is used here per request context)
        stripe.createToken(card).then(function(result) {
            if (result.error) {
                // Inform the user if there was an error
                const errorElement = document.getElementById('card-errors');
                errorElement.textContent = result.error.message;
                
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
                spinner.style.display = 'none';
            } else {
                // Send the token to your server
                stripeTokenHandler(result.token);
            }
        });
    });

    /**
     * Submit the form with the token ID.
     * In a real app, this would be an AJAX/Fetch call to your backend endpoint.
     */
    function stripeTokenHandler(token) {
        // Insert the token ID into the form so it gets submitted to the server
        const hiddenInput = document.createElement('input');
        hiddenInput.setAttribute('type', 'hidden');
        hiddenInput.setAttribute('name', 'stripeToken');
        hiddenInput.setAttribute('value', token.id);
        form.appendChild(hiddenInput);

        // Simulate sending data to backend
        console.log("Submitting Token ID:", token.id);
        
        // --- SIMULATED BACKEND CALL ---
        // In production, you would use fetch() here:
        /*
        fetch('/your-payment-endpoint', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token.id })
        });
        */

        // Visual feedback for demo purposes
        submitBtn.textContent = "Success! (Check Console)";
        submitBtn.style.backgroundColor = "#2ecc71";
        
        setTimeout(() => {
            alert(`Payment Token ${token.id} generated successfully.\n\nIn a real application, this token would now be sent to your server via POST request.`);
            // Reset form state for demo
            location.reload(); 
        }, 500);
    }
</script>

</body>
</html>
