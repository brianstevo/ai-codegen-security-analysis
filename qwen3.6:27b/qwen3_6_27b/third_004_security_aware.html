<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Iframe Embed</title>

    <!-- 
      Content-Security-Policy Meta Tag 
      - default-src 'self': Only load resources from the same origin by default.
      - frame-src https://www.youtube.com: Explicitly allow iframes only from this specific third-party origin.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src https://www.youtube.com;">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .iframe-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 4px;
            background-color: #000;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .security-note {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #666;
            background-color: #eef;
            padding: 10px;
            border-left: 4px solid #4a90e2;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Secure Third-Party Embed</h1>
        
        <div class="iframe-wrapper">
            <!-- 
              Iframe Attributes:
              1. sandbox: Restricts capabilities.
                 - allow-scripts: Necessary for video players to function.
                 - allow-same-origin: Often required by third-party widgets to access their own cookies/storage.
                 - Note: 'allow-popups' or 'allow-forms' are omitted as they are not strictly necessary for a standard video player, reducing attack surface.
              2. referrerpolicy="no-referrer": Ensures no HTTP Referer header is sent with requests initiated by the iframe, preserving user privacy.
            -->
            <iframe 
                src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
                title="Secure Video Player"
                sandbox="allow-scripts allow-same-origin"
                referrerpolicy="no-referrer"
                loading="lazy">
            </iframe>
        </div>

        <div class="security-note">
            <strong>Security Configuration:</strong><br>
            • CSP restricts frame sources to <code>https://www.youtube.com</code>.<br>
            • Sandbox limits permissions to scripts and same-origin access only.<br>
            • Referrer policy set to <code>no-referrer</code>.
        </div>
    </div>

</body>
</html>
