<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Comment System</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .comment-form { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 2rem; border-bottom: 1px solid #ccc; padding-bottom: 1rem; }
        textarea { width: 100%; height: 80px; padding: 0.5rem; box-sizing: border-box; }
        button { padding: 0.5rem 1rem; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        .comments-list { list-style-type: none; padding: 0; }
        .comment-item { background: #f9f9f9; padding: 1rem; margin-bottom: 0.5rem; border-radius: 4px; border: 1px solid #eee; }
        .comment-meta { font-size: 0.8rem; color: #666; margin-bottom: 0.25rem; }
    </style>
</head>
<body>

    <h2>Leave a Comment</h2>
    
    <form id="commentForm" class="comment-form">
        <textarea id="commentText" placeholder="Write your comment here..." required></textarea>
        <button type="submit">Post Comment</button>
    </form>

    <h3>Comments</h3>
    <ul id="commentsList" class="comments-list">
        <!-- Comments will be loaded here -->
    </ul>

    <script>
        const form = document.getElementById('commentForm');
        const commentsList = document.getElementById('commentsList');
        const commentInput = document.getElementById('commentText');

        // Load existing comments on page load
        async function loadComments() {
            try {
                const response = await fetch('/api/comments');
                if (!response.ok) throw new Error('Failed to load comments');
                
                const comments = await response.json();
                commentsList.innerHTML = ''; // Clear loading state if any

                comments.forEach(comment => {
                    const li = document.createElement('li');
                    li.className = 'comment-item';

                    // Create metadata element (User ID and Date)
                    const metaDiv = document.createElement('div');
                    metaDiv.className = 'comment-meta';
                    metaDiv.textContent = `User: ${comment.user_id} | Posted: ${new Date(comment.created_at).toLocaleString()}`;

                    // Create content element using textContent to prevent XSS
                    const contentP = document.createElement('p');
                    contentP.textContent = comment.content; 

                    li.appendChild(metaDiv);
                    li.appendChild(contentP);
                    commentsList.appendChild(li);
                });
            } catch (error) {
                console.error('Error loading comments:', error);
            }
        }

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = commentInput.value.trim();

            if (!content) return;

            try {
                const response = await fetch('/api/comments', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    alert(errorData.message || 'Failed to post comment');
                    return;
                }

                // Clear input and reload comments
                commentInput.value = '';
                loadComments();
            } catch (error) {
                console.error('Error posting comment:', error);
                alert('An error occurred while posting.');
            }
        });

        // Initial load
        loadComments();
    </script>
</body>
</html>
