<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Log Viewer</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 2rem;
      background: #f6f7f9;
      color: #1f2937;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: end;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    select, button {
      font: inherit;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      border: 1px solid #9ca3af;
    }

    button {
      cursor: pointer;
      border-color: #2563eb;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    #status {
      min-height: 1.5rem;
      margin: 0.75rem 0;
      font-weight: 600;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      min-height: 420px;
      max-height: 70vh;
      overflow: auto;
      padding: 1rem;
      background: #111827;
      color: #e5e7eb;
      border-radius: 10px;
      border: 1px solid #374151;
      tab-size: 2;
    }
  </style>
</head>
<body>
  <main>
    <h1>Admin Log Viewer</h1>

    <div class="controls">
      <div>
        <label for="logFile">Log file</label>
        <select id="logFile" autocomplete="off">
          <option value="">Loading allowed logs...</option>
        </select>
      </div>

      <button id="refreshButton" type="button" disabled>View log</button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
    <pre id="logOutput"></pre>
  </main>

  <script>
    const logFileSelect = document.getElementById('logFile');
    const refreshButton = document.getElementById('refreshButton');
    const statusEl = document.getElementById('status');
    const logOutput = document.getElementById('logOutput');

    function setStatus(message) {
      statusEl.textContent = message;
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        credentials: 'same-origin',
        headers: {
          Accept: 'application/json',
          ...(options.headers || {})
        }
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || `Request failed with HTTP ${response.status}`);
      }

      return data;
    }

    async function loadAllowedLogs() {
      refreshButton.disabled = true;
      logFileSelect.disabled = true;
      logFileSelect.textContent = '';
      logOutput.textContent = '';
      setStatus('Loading allowed log files...');

      try {
        const data = await fetchJson('/api/admin/logs');

        logFileSelect.textContent = '';

        if (!Array.isArray(data.files) || data.files.length === 0) {
          const option = document.createElement('option');
          option.value = '';
          option.textContent = 'No logs available';
          logFileSelect.appendChild(option);
          setStatus('No allowed log files are available.');
          return;
        }

        for (const file of data.files) {
          const option = document.createElement('option');
          option.value = file;
          option.textContent = file;
          logFileSelect.appendChild(option);
        }

        logFileSelect.disabled = false;
        refreshButton.disabled = false;
        setStatus('Select a log file and click View log.');
      } catch (error) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'Unable to load logs';
        logFileSelect.appendChild(option);
        setStatus(error.message);
      }
    }

    async function viewSelectedLog() {
      const filename = logFileSelect.value;

      if (!filename) {
        setStatus('Please select a log file.');
        return;
      }

      refreshButton.disabled = true;
      setStatus(`Loading ${filename}...`);
      logOutput.textContent = '';

      try {
        const data = await fetchJson(`/api/admin/logs/${encodeURIComponent(filename)}`);
        logOutput.textContent = data.content || '';
        setStatus(`Loaded ${data.filename}.`);
      } catch (error) {
        setStatus(error.message);
        logOutput.textContent = '';
      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener('click', viewSelectedLog);
    logFileSelect.addEventListener('change', () => {
      logOutput.textContent = '';
      setStatus('Selection changed. Click View log to load contents.');
    });

    loadAllowedLogs();
  </script>
</body>
</html>
