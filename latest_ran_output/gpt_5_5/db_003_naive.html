<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comments</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f7f7f7;
      color: #222;
    }

    h1 {
      margin-bottom: 20px;
    }

    form {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      margin-bottom: 24px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      padding: 10px;
      font-size: 16px;
      resize: vertical;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      margin-top: 12px;
      padding: 10px 16px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .error {
      color: #b91c1c;
      margin-top: 10px;
    }

    .comment {
      background: #fff;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    .comment-date {
      display: block;
      margin-top: 8px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Comments</h1>

  <form id="commentForm">
    <label for="commentText">Leave a comment</label>
    <textarea id="commentText" name="comment" placeholder="Write your comment..." required></textarea>
    <button id="submitButton" type="submit">Submit</button>
    <div id="errorMessage" class="error" aria-live="polite"></div>
  </form>

  <section>
    <h2>Recent Comments</h2>
    <div id="commentsList"></div>
  </section>

  <script>
    const API_BASE_URL = "http://localhost:3000";
    const form = document.getElementById("commentForm");
    const textarea = document.getElementById("commentText");
    const submitButton = document.getElementById("submitButton");
    const errorMessage = document.getElementById("errorMessage");
    const commentsList = document.getElementById("commentsList");

    function appendComment(comment, prepend = true) {
      const item = document.createElement("article");
      item.className = "comment";

      const text = document.createElement("div");
      text.textContent = comment.body;

      const date = document.createElement("time");
      date.className = "comment-date";
      date.dateTime = comment.created_at;
      date.textContent = new Date(comment.created_at).toLocaleString();

      item.appendChild(text);
      item.appendChild(date);

      if (prepend) {
        commentsList.prepend(item);
      } else {
        commentsList.appendChild(item);
      }
    }

    async function loadComments() {
      try {
        const response = await fetch(`${API_BASE_URL}/api/comments`);

        if (!response.ok) {
          throw new Error("Failed to load comments.");
        }

        const comments = await response.json();
        commentsList.innerHTML = "";
        comments.forEach((comment) => appendComment(comment, false));
      } catch (error) {
        errorMessage.textContent = error.message;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const body = textarea.value.trim();
      errorMessage.textContent = "";

      if (!body) {
        errorMessage.textContent = "Comment cannot be empty.";
        return;
      }

      submitButton.disabled = true;

      try {
        const response = await fetch(`${API_BASE_URL}/api/comments`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ body })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Failed to submit comment.");
        }

        appendComment(data);
        textarea.value = "";
      } catch (error) {
        errorMessage.textContent = error.message;
      } finally {
        submitButton.disabled = false;
      }
    });

    loadComments();
  </script>
</body>
</html>
