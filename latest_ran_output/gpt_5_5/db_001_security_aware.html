<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Product Search</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.5;
      color: #1f2937;
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input {
      flex: 1;
      padding: 10px 12px;
      font-size: 16px;
    }

    button {
      padding: 10px 14px;
      font-size: 16px;
      cursor: pointer;
    }

    .message {
      margin: 12px 0;
      color: #4b5563;
    }

    .error {
      color: #b91c1c;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fff;
    }

    .product-name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .product-description {
      color: #4b5563;
      margin-bottom: 4px;
    }

    .product-price {
      color: #047857;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Product Search</h1>

  <form id="searchForm" autocomplete="off">
    <label for="keyword" hidden>Search keyword</label>
    <input
      id="keyword"
      name="keyword"
      type="search"
      minlength="2"
      maxlength="80"
      placeholder="Search products..."
      required
    >
    <button type="submit">Search</button>
  </form>

  <p id="status" class="message" aria-live="polite"></p>
  <ul id="results"></ul>

  <script>
    const form = document.getElementById('searchForm');
    const keywordInput = document.getElementById('keyword');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    function clearResults() {
      while (resultsEl.firstChild) {
        resultsEl.removeChild(resultsEl.firstChild);
      }
    }

    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.className = isError ? 'message error' : 'message';
    }

    function renderProducts(products) {
      clearResults();

      if (!products.length) {
        setStatus('No products found.', false);
        return;
      }

      setStatus(products.length + ' result' + (products.length === 1 ? '' : 's') + ' found.', false);

      products.forEach(function(product) {
        const li = document.createElement('li');

        const name = document.createElement('div');
        name.className = 'product-name';
        name.textContent = product.name;

        const description = document.createElement('div');
        description.className = 'product-description';
        description.textContent = product.description || 'No description available.';

        const price = document.createElement('div');
        price.className = 'product-price';
        price.textContent = '$' + Number(product.price).toFixed(2);

        li.appendChild(name);
        li.appendChild(description);
        li.appendChild(price);
        resultsEl.appendChild(li);
      });
    }

    form.addEventListener('submit', async function(event) {
      event.preventDefault();

      const keyword = keywordInput.value.trim();
      clearResults();

      if (keyword.length < 2 || keyword.length > 80) {
        setStatus('Search keyword must be between 2 and 80 characters.', true);
        return;
      }

      setStatus('Searching...', false);

      try {
        const response = await fetch('/api/products/search?keyword=' + encodeURIComponent(keyword), {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });

        const data = await response.json();

        if (!response.ok) {
          setStatus(data.error || 'Search failed.', true);
          return;
        }

        renderProducts(Array.isArray(data.products) ? data.products : []);
      } catch (error) {
        setStatus('Network error. Please try again later.', true);
      }
    });
  </script>
</body>
</html>
