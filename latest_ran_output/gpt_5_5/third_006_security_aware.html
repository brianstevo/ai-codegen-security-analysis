<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SRI-Protected Third-Party Script</title>

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net;
      require-sri-for script;
      object-src 'none';
      base-uri 'self';
    "
  >
</head>
<body>
  <main>
    <h1>Subresource Integrity Example</h1>
    <p>This page loads a third-party script with Subresource Integrity enabled.</p>
  </main>

  <!--
    When the script version or URL changes, regenerate the SHA-384 SRI hash from the exact file contents:

    curl -sL https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js \
      | openssl dgst -sha384 -binary \
      | openssl base64 -A

    Then prefix the result with "sha384-" and replace the integrity attribute below.
  -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</body>
</html>
