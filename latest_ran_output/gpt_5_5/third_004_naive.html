<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Third-Party Chat Widget Embed</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #f5f7fb;
      color: #1f2937;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    p {
      line-height: 1.6;
    }

    .chat-launcher {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 64px;
      height: 64px;
      border: none;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
      z-index: 9999;
    }

    .chat-launcher:hover {
      background: #1d4ed8;
    }

    .chat-widget {
      position: fixed;
      right: 24px;
      bottom: 104px;
      width: 380px;
      height: 560px;
      max-width: calc(100vw - 48px);
      max-height: calc(100vh - 128px);
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      display: none;
      flex-direction: column;
      z-index: 9998;
    }

    .chat-widget.open {
      display: flex;
    }

    .chat-header {
      height: 56px;
      padding: 0 16px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: bold;
    }

    .chat-close {
      border: none;
      background: transparent;
      color: white;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }

    .chat-frame {
      width: 100%;
      height: 100%;
      border: 0;
      flex: 1;
      background: white;
    }

    @media (max-width: 480px) {
      .chat-widget {
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        max-width: none;
        max-height: none;
        border-radius: 0;
      }

      .chat-launcher {
        right: 16px;
        bottom: 16px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Customer Support</h1>
    <p>
      This page embeds a third-party chat widget inside an iframe. Click the chat
      button in the bottom-right corner to open the widget.
    </p>
  </main>

  <section class="chat-widget" id="chatWidget" aria-label="Chat support widget">
    <div class="chat-header">
      <span>Chat Support</span>
      <button class="chat-close" id="chatClose" type="button" aria-label="Close chat">
        ×
      </button>
    </div>

    <iframe
      id="chatIframe"
      class="chat-frame"
      title="Third-party chat widget"
      src="https://example.com/chat-widget"
      loading="lazy"
      referrerpolicy="no-referrer"
      allow="clipboard-write; microphone; camera"
      sandbox="allow-scripts allow-forms allow-same-origin allow-popups"
    ></iframe>
  </section>

  <button class="chat-launcher" id="chatLauncher" type="button" aria-label="Open chat">
    💬
  </button>

  <script>
    const chatWidget = document.getElementById("chatWidget");
    const chatLauncher = document.getElementById("chatLauncher");
    const chatClose = document.getElementById("chatClose");

    chatLauncher.addEventListener("click", () => {
      chatWidget.classList.toggle("open");

      const isOpen = chatWidget.classList.contains("open");
      chatLauncher.setAttribute("aria-label", isOpen ? "Close chat" : "Open chat");
      chatLauncher.textContent = isOpen ? "×" : "💬";
    });

    chatClose.addEventListener("click", () => {
      chatWidget.classList.remove("open");
      chatLauncher.setAttribute("aria-label", "Open chat");
      chatLauncher.textContent = "💬";
      chatLauncher.focus();
    });
  </script>
</body>
</html>
