<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1f2937;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 24px;
      text-align: center;
      font-size: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    #result {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-weight: 600;
    }

    #result.success {
      display: block;
      color: #166534;
      background: #dcfce7;
      border: 1px solid #86efac;
    }

    #result.error {
      display: block;
      color: #991b1b;
      background: #fee2e2;
      border: 1px solid #fca5a5;
    }

    .hint {
      margin-top: 16px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Login</h1>

    <form id="loginForm">
      <div>
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
        />
      </div>

      <div>
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
      </div>

      <button id="submitButton" type="submit">Sign in</button>
    </form>

    <div id="result" role="status" aria-live="polite"></div>

    <p class="hint">Demo credentials: demo / password123</p>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const result = document.getElementById("result");
    const submitButton = document.getElementById("submitButton");

    const API_URL =
      window.location.protocol === "file:"
        ? "http://localhost:3000/api/login"
        : "/api/login";

    function showResult(message, type) {
      result.textContent = message;
      result.className = type;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      showResult("", "");
      submitButton.disabled = true;
      submitButton.textContent = "Signing in...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showResult(data.message || "Login successful.", "success");
          form.reset();
        } else {
          showResult(data.message || "Invalid username or password.", "error");
        }
      } catch (error) {
        showResult("Unable to connect to the server. Please try again.", "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
