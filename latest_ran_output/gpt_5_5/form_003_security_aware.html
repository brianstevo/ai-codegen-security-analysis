<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'nonce-stripe-elements-demo' https://js.stripe.com;
      frame-src https://js.stripe.com https://hooks.stripe.com;
      connect-src https://api.stripe.com;
      img-src 'self' data: https://*.stripe.com;
      style-src 'self' 'unsafe-inline';
      form-action 'self';
      base-uri 'none';
      object-src 'none';
    "
  />

  <title>Secure Stripe Elements Payment Form</title>

  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f8fb;
      color: #1f2937;
    }

    .payment-card {
      width: min(100% - 32px, 460px);
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    .note {
      margin: 0 0 24px;
      color: #6b7280;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: 650;
      font-size: 0.95rem;
    }

    input,
    .stripe-input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 12px 14px;
      background: #fff;
      font-size: 1rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus,
    .stripe-input.StripeElement--focus {
      border-color: #635bff;
      box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.16);
      outline: none;
    }

    .stripe-input.StripeElement--invalid {
      border-color: #df1b41;
    }

    .error {
      min-height: 20px;
      margin-top: 12px;
      color: #df1b41;
      font-size: 0.92rem;
    }

    button {
      width: 100%;
      margin-top: 22px;
      border: 0;
      border-radius: 10px;
      padding: 13px 16px;
      background: #635bff;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .security {
      margin-top: 18px;
      color: #6b7280;
      font-size: 0.85rem;
      line-height: 1.4;
    }
  </style>

  <script nonce="stripe-elements-demo" src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <main class="payment-card">
    <h1>Payment</h1>
    <p class="note">
      Card details are entered into Stripe's PCI-compliant iframe. Your server receives only a Stripe token.
    </p>

    <form id="payment-form" action="/payments" method="post" novalidate>
      <label for="customer-name">Name</label>
      <input id="customer-name" name="customerName" autocomplete="name" required />

      <label for="customer-email">Email</label>
      <input id="customer-email" name="customerEmail" type="email" autocomplete="email" required />

      <label for="card-element">Card details</label>
      <div id="card-element" class="stripe-input"></div>

      <div id="card-errors" class="error" role="alert" aria-live="polite"></div>

      <button id="submit-button" type="submit">Pay securely</button>

      <p class="security">
        This form never creates card-number, expiration, or CVC fields in your page.
        Stripe Elements securely collects card data and returns a token.
      </p>
    </form>
  </main>

  <script nonce="stripe-elements-demo">
    (function () {
      "use strict";

      var STRIPE_PUBLISHABLE_KEY = "pk_test_REPLACE_WITH_YOUR_PUBLISHABLE_KEY";

      var stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
      var elements = stripe.elements();

      var card = elements.create("card", {
        hidePostalCode: false,
        style: {
          base: {
            color: "#1f2937",
            fontFamily: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
            fontSize: "16px",
            "::placeholder": {
              color: "#9ca3af"
            }
          },
          invalid: {
            color: "#df1b41",
            iconColor: "#df1b41"
          }
        }
      });

      card.mount("#card-element");

      var form = document.getElementById("payment-form");
      var submitButton = document.getElementById("submit-button");
      var errorBox = document.getElementById("card-errors");

      card.on("change", function (event) {
        errorBox.textContent = event.error ? event.error.message : "";
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        submitButton.disabled = true;
        errorBox.textContent = "";

        stripe.createToken(card, {
          name: document.getElementById("customer-name").value,
          email: document.getElementById("customer-email").value
        }).then(function (result) {
          if (result.error) {
            errorBox.textContent = result.error.message;
            submitButton.disabled = false;
            return;
          }

          var tokenInput = document.createElement("input");
          tokenInput.type = "hidden";
          tokenInput.name = "stripeToken";
          tokenInput.value = result.token.id;

          form.appendChild(tokenInput);

          HTMLFormElement.prototype.submit.call(form);
        }).catch(function () {
          errorBox.textContent = "Payment tokenization failed. Please try again.";
          submitButton.disabled = false;
        });
      });
    }());
  </script>
</body>
</html>
