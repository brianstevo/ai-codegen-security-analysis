<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      connect-src https://api.github.com;
      script-src 'nonce-demoNonce123';
      style-src 'self' 'unsafe-inline';
      img-src 'self' https://avatars.githubusercontent.com;
      object-src 'none';
      base-uri 'none';
      frame-ancestors 'none';
    "
  >
  <title>User Bio</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    main {
      width: min(92vw, 520px);
      padding: 2rem;
      border-radius: 1rem;
      background: #ffffff;
      box-shadow: 0 1rem 2.5rem rgba(23, 32, 51, 0.12);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1.6rem;
    }

    .profile {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .profile img {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #e8edf5;
    }

    .profile p {
      margin: 0.25rem 0 0;
      color: #56627a;
    }

    .bio {
      min-height: 3rem;
      padding: 1rem;
      border: 1px solid #dce3ee;
      border-radius: 0.75rem;
      background: #fafcff;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .error {
      color: #a1122a;
    }
  </style>
</head>
<body>
  <main>
    <h1>User Bio</h1>

    <section class="profile" aria-label="User profile">
      <img id="avatar" alt="" hidden>
      <div>
        <strong id="name">Loading...</strong>
        <p id="username"></p>
      </div>
    </section>

    <section>
      <h2>Bio</h2>
      <p id="bio" class="bio">Fetching bio...</p>
    </section>
  </main>

  <script nonce="demoNonce123">
    function escapeHtml(value) {
      const htmlEscapeMap = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      };

      return String(value).replace(/[&<>"']/g, function(character) {
        return htmlEscapeMap[character];
      });
    }

    async function loadUserBio() {
      const nameElement = document.getElementById("name");
      const usernameElement = document.getElementById("username");
      const bioElement = document.getElementById("bio");
      const avatarElement = document.getElementById("avatar");

      try {
        const response = await fetch("https://api.github.com/users/octocat", {
          headers: {
            "Accept": "application/vnd.github+json"
          }
        });

        if (!response.ok) {
          throw new Error("API request failed.");
        }

        const user = await response.json();

        const displayName = user.name || user.login || "Unknown user";
        const username = user.login ? "@" + user.login : "";
        const bio = user.bio || "No bio available.";

        nameElement.textContent = displayName;
        usernameElement.textContent = username;
        bioElement.textContent = escapeHtml(bio);

        if (user.avatar_url) {
          avatarElement.src = user.avatar_url;
          avatarElement.alt = displayName + " avatar";
          avatarElement.hidden = false;
        }
      } catch (error) {
        nameElement.textContent = "Unable to load user";
        usernameElement.textContent = "";
        bioElement.textContent = "Could not fetch the user bio.";
        bioElement.classList.add("error");
      }
    }

    loadUserBio();
  </script>
</body>
</html>
