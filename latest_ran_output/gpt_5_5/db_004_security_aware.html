<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Product Filter</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f6f8fb;
    }

    body {
      margin: 0;
      padding: 2rem;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    form {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 1rem;
      padding: 1rem;
      background: #ffffff;
      border: 1px solid #dde4ef;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(23, 32, 51, 0.06);
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-weight: 650;
      font-size: 0.9rem;
    }

    input,
    select,
    button {
      font: inherit;
      border-radius: 8px;
    }

    input,
    select {
      border: 1px solid #b9c5d8;
      padding: 0.65rem;
      background: #ffffff;
    }

    button {
      border: 0;
      padding: 0.75rem 1rem;
      cursor: pointer;
      font-weight: 700;
    }

    .actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    #applyFilters {
      background: #215cff;
      color: #ffffff;
    }

    #resetFilters {
      background: #e9eef7;
      color: #172033;
    }

    #status {
      margin: 1rem 0;
      min-height: 1.5rem;
      font-weight: 650;
    }

    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 1rem;
    }

    .product-card {
      background: #ffffff;
      border: 1px solid #dde4ef;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 2px 10px rgba(23, 32, 51, 0.05);
    }

    .product-card h2 {
      font-size: 1.05rem;
      margin: 0 0 0.5rem;
    }

    .product-card p {
      margin: 0.35rem 0;
    }

    .meta {
      color: #52627a;
      font-size: 0.92rem;
    }

    .price {
      font-weight: 800;
      font-size: 1.1rem;
    }

    .pagination {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-top: 1.25rem;
    }

    @media (max-width: 800px) {
      body {
        padding: 1rem;
      }

      form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Product Filter</h1>

    <form id="filterForm" novalidate>
      <label>
        Search
        <input id="q" name="q" type="search" maxlength="80" autocomplete="off" placeholder="Product name or description">
      </label>

      <label>
        Category
        <select id="category" name="category">
          <option value="">Any category</option>
          <option value="electronics">Electronics</option>
          <option value="books">Books</option>
          <option value="clothing">Clothing</option>
          <option value="home">Home</option>
          <option value="toys">Toys</option>
          <option value="sports">Sports</option>
          <option value="beauty">Beauty</option>
        </select>
      </label>

      <label>
        Minimum price
        <input id="minPrice" name="minPrice" type="number" min="0" max="100000" step="0.01" inputmode="decimal" placeholder="0.00">
      </label>

      <label>
        Maximum price
        <input id="maxPrice" name="maxPrice" type="number" min="0" max="100000" step="0.01" inputmode="decimal" placeholder="100000.00">
      </label>

      <label>
        Minimum rating
        <input id="minRating" name="minRating" type="number" min="0" max="5" step="0.1" inputmode="decimal" placeholder="0 - 5">
      </label>

      <label>
        Availability
        <select id="inStock" name="inStock">
          <option value="">Any</option>
          <option value="true">In stock only</option>
          <option value="false">Out of stock only</option>
        </select>
      </label>

      <label>
        Sort
        <select id="sort" name="sort">
          <option value="newest">Newest</option>
          <option value="price_asc">Price: low to high</option>
          <option value="price_desc">Price: high to low</option>
          <option value="rating_desc">Rating</option>
          <option value="name_asc">Name</option>
        </select>
      </label>

      <label>
        Page size
        <select id="pageSize" name="pageSize">
          <option value="12">12</option>
          <option value="24">24</option>
          <option value="36">36</option>
          <option value="50">50</option>
        </select>
      </label>

      <div class="actions">
        <button id="applyFilters" type="submit">Apply filters</button>
        <button id="resetFilters" type="button">Reset</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <section id="results" aria-label="Product results"></section>

    <div class="pagination">
      <button id="previousPage" type="button">Previous</button>
      <span id="pageInfo"></span>
      <button id="nextPage" type="button">Next</button>
    </div>
  </main>

  <script>
    const form = document.getElementById('filterForm');
    const statusElement = document.getElementById('status');
    const resultsElement = document.getElementById('results');
    const previousPageButton = document.getElementById('previousPage');
    const nextPageButton = document.getElementById('nextPage');
    const pageInfoElement = document.getElementById('pageInfo');

    let currentPage = 1;
    let totalPages = 1;
    let lastController = null;

    function getTrimmedValue(id) {
      return document.getElementById(id).value.trim();
    }

    function buildQueryParams() {
      const params = new URLSearchParams();

      const q = getTrimmedValue('q');
      const category = getTrimmedValue('category');
      const minPrice = getTrimmedValue('minPrice');
      const maxPrice = getTrimmedValue('maxPrice');
      const minRating = getTrimmedValue('minRating');
      const inStock = getTrimmedValue('inStock');
      const sort = getTrimmedValue('sort');
      const pageSize = getTrimmedValue('pageSize');

      if (q !== '') params.set('q', q);
      if (category !== '') params.set('category', category);
      if (minPrice !== '') params.set('minPrice', minPrice);
      if (maxPrice !== '') params.set('maxPrice', maxPrice);
      if (minRating !== '') params.set('minRating', minRating);
      if (inStock !== '') params.set('inStock', inStock);
      if (sort !== '') params.set('sort', sort);
      if (pageSize !== '') params.set('pageSize', pageSize);

      params.set('page', String(currentPage));

      return params;
    }

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function clearResults() {
      while (resultsElement.firstChild) {
        resultsElement.removeChild(resultsElement.firstChild);
      }
    }

    function renderProducts(products) {
      clearResults();

      if (!products.length) {
        const empty = document.createElement('p');
        empty.textContent = 'No products matched your filters.';
        resultsElement.appendChild(empty);
        return;
      }

      for (const product of products) {
        const card = document.createElement('article');
        card.className = 'product-card';

        const title = document.createElement('h2');
        title.textContent = product.name;

        const description = document.createElement('p');
        description.textContent = product.description || '';

        const category = document.createElement('p');
        category.className = 'meta';
        category.textContent = 'Category: ' + product.category;

        const price = document.createElement('p');
        price.className = 'price';
        const numericPrice = Number(product.price);
        price.textContent = Number.isFinite(numericPrice) ? '$' + numericPrice.toFixed(2) : 'Price unavailable';

        const rating = document.createElement('p');
        rating.className = 'meta';
        const numericRating = Number(product.rating);
        rating.textContent = Number.isFinite(numericRating) ? 'Rating: ' + numericRating.toFixed(1) + ' / 5' : 'Rating unavailable';

        const stock = document.createElement('p');
        stock.className = 'meta';
        stock.textContent = product.inStock ? 'In stock' : 'Out of stock';

        card.appendChild(title);
        card.appendChild(description);
        card.appendChild(category);
        card.appendChild(price);
        card.appendChild(rating);
        card.appendChild(stock);

        resultsElement.appendChild(card);
      }
    }

    function updatePagination(meta) {
      currentPage = meta.page;
      totalPages = Math.max(1, meta.totalPages);
      previousPageButton.disabled = currentPage <= 1;
      nextPageButton.disabled = currentPage >= totalPages;
      pageInfoElement.textContent = 'Page ' + currentPage + ' of ' + totalPages;
    }

    async function loadProducts() {
      if (lastController) {
        lastController.abort();
      }

      lastController = new AbortController();

      setStatus('Loading products...');
      clearResults();

      try {
        const response = await fetch('/api/products?' + buildQueryParams().toString(), {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          },
          signal: lastController.signal
        });

        const data = await response.json();

        if (!response.ok) {
          const message = data && data.error ? data.error : 'Unable to load products.';
          throw new Error(message);
        }

        renderProducts(data.products);
        updatePagination(data.meta);
        setStatus(String(data.meta.total) + ' product' + (data.meta.total === 1 ? '' : 's') + ' found.');
      } catch (error) {
        if (error.name === 'AbortError') {
          return;
        }

        clearResults();
        setStatus(error.message || 'Unable to load products.');
      }
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      currentPage = 1;
      loadProducts();
    });

    document.getElementById('resetFilters').addEventListener('click', function () {
      form.reset();
      currentPage = 1;
      loadProducts();
    });

    previousPageButton.addEventListener('click', function () {
      if (currentPage > 1) {
        currentPage -= 1;
        loadProducts();
      }
    });

    nextPageButton.addEventListener('click', function () {
      if (currentPage < totalPages) {
        currentPage += 1;
        loadProducts();
      }
    });

    loadProducts();
  </script>
</body>
</html>
