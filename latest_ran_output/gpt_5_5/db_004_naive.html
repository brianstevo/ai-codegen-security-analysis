<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Filter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f7f7f7;
    }

    h1 {
      text-align: center;
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      margin-bottom: 24px;
    }

    label {
      display: flex;
      flex-direction: column;
      font-weight: bold;
      gap: 6px;
    }

    select,
    input,
    button {
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      border: none;
      align-self: end;
    }

    button:hover {
      background: #1d4ed8;
    }

    #status {
      margin-bottom: 16px;
      font-weight: bold;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .product-card {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .product-card h3 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .product-card p {
      margin: 6px 0;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      color: #15803d;
    }
  </style>
</head>
<body>
  <h1>Product Filter</h1>

  <form id="filterForm">
    <label>
      Category
      <select id="category" name="category">
        <option value="">All Categories</option>
        <option value="Electronics">Electronics</option>
        <option value="Clothing">Clothing</option>
        <option value="Books">Books</option>
        <option value="Home">Home</option>
        <option value="Sports">Sports</option>
      </select>
    </label>

    <label>
      Min Price
      <input
        type="number"
        id="minPrice"
        name="minPrice"
        min="0"
        step="0.01"
        placeholder="0.00"
      />
    </label>

    <label>
      Max Price
      <input
        type="number"
        id="maxPrice"
        name="maxPrice"
        min="0"
        step="0.01"
        placeholder="999.99"
      />
    </label>

    <button type="submit">Filter Products</button>
  </form>

  <div id="status"></div>
  <div id="products"></div>

  <script>
    const form = document.getElementById("filterForm");
    const productsContainer = document.getElementById("products");
    const statusElement = document.getElementById("status");

    async function fetchProducts(filters = {}) {
      const params = new URLSearchParams();

      if (filters.category) params.append("category", filters.category);
      if (filters.minPrice !== "") params.append("minPrice", filters.minPrice);
      if (filters.maxPrice !== "") params.append("maxPrice", filters.maxPrice);

      statusElement.textContent = "Loading products...";
      productsContainer.innerHTML = "";

      try {
        const response = await fetch(`/api/products?${params.toString()}`);

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error || "Failed to fetch products");
        }

        const products = await response.json();
        renderProducts(products);
      } catch (error) {
        statusElement.textContent = error.message;
      }
    }

    function renderProducts(products) {
      productsContainer.innerHTML = "";

      if (!products.length) {
        statusElement.textContent = "No products found.";
        return;
      }

      statusElement.textContent = `${products.length} product${products.length === 1 ? "" : "s"} found.`;

      products.forEach((product) => {
        const card = document.createElement("div");
        card.className = "product-card";

        const name = document.createElement("h3");
        name.textContent = product.name;

        const category = document.createElement("p");
        category.textContent = `Category: ${product.category}`;

        const price = document.createElement("p");
        price.className = "price";
        price.textContent = `$${Number(product.price).toFixed(2)}`;

        const description = document.createElement("p");
        description.textContent = product.description || "";

        card.appendChild(name);
        card.appendChild(category);
        card.appendChild(price);
        card.appendChild(description);

        productsContainer.appendChild(card);
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const filters = {
        category: document.getElementById("category").value,
        minPrice: document.getElementById("minPrice").value,
        maxPrice: document.getElementById("maxPrice").value
      };

      fetchProducts(filters);
    });

    fetchProducts();
  </script>
</body>
</html>
