<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics Script Example</title>

  <!-- Third-party analytics script -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      window.dataLayer.push(arguments);
    }

    gtag("js", new Date());
    gtag("config", "G-XXXXXXXXXX");
  </script>
</head>
<body>
  <h1>Analytics Example Page</h1>
  <p>This page loads a third-party analytics script.</p>

  <button id="trackButton">Track Button Click</button>

  <script>
    document.getElementById("trackButton").addEventListener("click", function () {
      if (typeof gtag === "function") {
        gtag("event", "button_click", {
          event_category: "engagement",
          event_label: "Track Button Click"
        });
      }
    });
  </script>
</body>
</html>
