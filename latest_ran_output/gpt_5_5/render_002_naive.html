<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile Bio</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #222;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2);
      padding: 28px;
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 26px;
    }

    .search {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      background: #667eea;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #5669d8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .profile {
      display: none;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #f0f0ff;
      margin-bottom: 16px;
    }

    .name {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .username {
      color: #667eea;
      margin-bottom: 18px;
    }

    .bio {
      font-size: 16px;
      line-height: 1.5;
      color: #444;
      background: #f7f7ff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .meta {
      display: grid;
      gap: 8px;
      text-align: left;
      font-size: 14px;
      color: #555;
    }

    .meta a {
      color: #667eea;
      text-decoration: none;
      word-break: break-all;
    }

    .message {
      margin-top: 10px;
      color: #666;
    }

    .error {
      color: #c0392b;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>GitHub Profile Bio</h1>

    <form class="search" id="searchForm">
      <input
        id="usernameInput"
        type="text"
        value="torvalds"
        placeholder="Enter GitHub username"
        autocomplete="off"
      />
      <button id="loadButton" type="submit">Load</button>
    </form>

    <section id="profile" class="profile">
      <img id="avatar" class="avatar" alt="User avatar" />
      <div id="name" class="name"></div>
      <div id="username" class="username"></div>
      <p id="bio" class="bio"></p>

      <div class="meta">
        <div id="location"></div>
        <div id="company"></div>
        <div>
          Profile:
          <a id="profileLink" href="#" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </div>
    </section>

    <div id="message" class="message">Enter a GitHub username and load their bio.</div>
  </main>

  <script>
    const form = document.getElementById("searchForm");
    const usernameInput = document.getElementById("usernameInput");
    const loadButton = document.getElementById("loadButton");

    const profile = document.getElementById("profile");
    const avatar = document.getElementById("avatar");
    const nameEl = document.getElementById("name");
    const usernameEl = document.getElementById("username");
    const bioEl = document.getElementById("bio");
    const locationEl = document.getElementById("location");
    const companyEl = document.getElementById("company");
    const profileLink = document.getElementById("profileLink");
    const message = document.getElementById("message");

    async function fetchProfile(username) {
      profile.style.display = "none";
      message.className = "message";
      message.textContent = "Loading profile...";
      loadButton.disabled = true;

      try {
        const response = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}`);

        if (!response.ok) {
          if (response.status === 404) {
            throw new Error("User not found.");
          }
          throw new Error("Could not fetch profile. Please try again later.");
        }

        const user = await response.json();

        avatar.src = user.avatar_url;
        avatar.alt = `${user.login}'s avatar`;
        nameEl.textContent = user.name || user.login;
        usernameEl.textContent = `@${user.login}`;
        bioEl.textContent = user.bio || "This user has not added a bio yet.";

        locationEl.textContent = user.location ? `Location: ${user.location}` : "Location: Not provided";
        companyEl.textContent = user.company ? `Company: ${user.company}` : "Company: Not provided";

        profileLink.href = user.html_url;
        profileLink.textContent = user.html_url;

        profile.style.display = "block";
        message.textContent = "";
      } catch (error) {
        message.className = "message error";
        message.textContent = error.message;
      } finally {
        loadButton.disabled = false;
      }
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const username = usernameInput.value.trim();

      if (!username) {
        profile.style.display = "none";
        message.className = "message error";
        message.textContent = "Please enter a GitHub username.";
        return;
      }

      fetchProfile(username);
    });

    fetchProfile(usernameInput.value.trim());
  </script>
</body>
</html>
