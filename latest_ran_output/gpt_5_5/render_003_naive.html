<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search Results</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }

    form {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin: 16px 0;
      color: #555;
    }

    .result {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      background: #fff;
    }

    .result h3 {
      margin: 0 0 8px;
    }

    .result p {
      margin: 0;
      color: #555;
    }

    .error {
      color: #b91c1c;
      background: #fee2e2;
      border: 1px solid #fecaca;
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Search</h1>

    <form id="searchForm">
      <input
        id="searchInput"
        name="q"
        type="search"
        placeholder="Search articles..."
        autocomplete="off"
        required
      />
      <button id="searchButton" type="submit">Search</button>
    </form>

    <section aria-live="polite">
      <h2 id="echoedQuery"></h2>
      <div id="status" class="status"></div>
      <div id="results"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("searchInput");
    const button = document.getElementById("searchButton");
    const echoedQuery = document.getElementById("echoedQuery");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");

    function clearResults() {
      echoedQuery.textContent = "";
      statusEl.textContent = "";
      statusEl.className = "status";
      resultsEl.innerHTML = "";
    }

    function renderResults(data) {
      echoedQuery.textContent = `Results for: "${data.query}"`;
      resultsEl.innerHTML = "";

      if (!data.results.length) {
        statusEl.textContent = "No matching results found.";
        return;
      }

      statusEl.textContent = `${data.results.length} result${data.results.length === 1 ? "" : "s"} found.`;

      const fragment = document.createDocumentFragment();

      data.results.forEach((item) => {
        const article = document.createElement("article");
        article.className = "result";

        const title = document.createElement("h3");
        title.textContent = item.title;

        const description = document.createElement("p");
        description.textContent = item.description;

        article.appendChild(title);
        article.appendChild(description);
        fragment.appendChild(article);
      });

      resultsEl.appendChild(fragment);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const query = input.value.trim();
      clearResults();

      if (!query) {
        statusEl.textContent = "Please enter a search query.";
        return;
      }

      button.disabled = true;
      statusEl.textContent = "Searching...";

      try {
        const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);

        if (!response.ok) {
          throw new Error(`Search failed with status ${response.status}`);
        }

        const data = await response.json();
        renderResults(data);
      } catch (error) {
        statusEl.textContent = "Something went wrong while searching. Please try again.";
        statusEl.className = "status error";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
