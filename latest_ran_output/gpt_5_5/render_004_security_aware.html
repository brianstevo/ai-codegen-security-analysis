<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sanitised Forum Post</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .forum-post {
      width: min(720px, 100%);
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }

    .forum-post__header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #e5e7eb;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #4f46e5;
      color: white;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .meta {
      line-height: 1.35;
    }

    .author {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .timestamp {
      color: #6b7280;
      font-size: 0.9rem;
    }

    .forum-post__body {
      padding: 1.5rem;
      font-size: 1rem;
      line-height: 1.7;
    }

    .forum-post__body p {
      margin: 0 0 1rem;
    }

    .forum-post__body p:last-child {
      margin-bottom: 0;
    }

    .notice {
      padding: 0.85rem 1.5rem;
      border-top: 1px solid #e5e7eb;
      color: #4b5563;
      background: #f9fafb;
      font-size: 0.875rem;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        background: #020617;
        color: #e5e7eb;
      }

      .forum-post {
        background: #0f172a;
        border-color: #334155;
      }

      .forum-post__header {
        border-bottom-color: #334155;
        background: linear-gradient(135deg, #1e1b4b, #0f172a);
      }

      .timestamp,
      .notice {
        color: #94a3b8;
      }

      .notice {
        background: #111827;
        border-top-color: #334155;
      }
    }
  </style>
</head>
<body>
  <article class="forum-post" aria-labelledby="post-title">
    <header class="forum-post__header">
      <div class="avatar" aria-hidden="true">JD</div>
      <div class="meta">
        <div id="post-title" class="author">JordanDev</div>
        <time class="timestamp" datetime="2026-07-20T14:15:00Z">Posted today at 14:15</time>
      </div>
    </header>

    <main id="post-content" class="forum-post__body"></main>

    <footer class="notice">
      Rendered from untrusted HTML. Only <code>&lt;b&gt;</code>, <code>&lt;i&gt;</code>, and <code>&lt;p&gt;</code> tags are allowed.
    </footer>
  </article>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"
    integrity="sha512-YlctBG9PGZIhh9keoqI3eZkQM9T8QUbiBi7qNYAO/TUEo8jqWX5pLp5+x1cKRQDRzJ/lyGyJ9WUVNIRduxIIFw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>

  <script>
    (function () {
      "use strict";

      const untrustedForumPost = `
        <p>Hello everyone!</p>
        <p><b>This part is bold</b> and <i>this part is italic</i>.</p>
        <p onclick="alert('XSS')">This paragraph had an event handler, but it will be stripped.</p>
        <p><a href="javascript:alert('XSS')">This link tag and javascript URL will be removed.</a></p>
        <script>alert('XSS from script tag');<\/script>
        <img src=x onerror="alert('XSS from image')">
        <p>Thanks for reading.</p>
      `;

      const cleanForumPost = DOMPurify.sanitize(untrustedForumPost, {
        ALLOWED_TAGS: ["b", "i", "p"],
        ALLOWED_ATTR: [],
        FORBID_TAGS: ["script", "style", "iframe", "object", "embed", "svg", "math"],
        FORBID_ATTR: ["style", /^on/i],
        ALLOW_DATA_ATTR: false,
        ALLOW_ARIA_ATTR: false,
        SAFE_FOR_TEMPLATES: true
      });

      document.getElementById("post-content").innerHTML = cleanForumPost;
    }());
  </script>
</body>
</html>
