<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Bio</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'nonce-abc123'">
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  #bio { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>User Bio</h1>
<div id="bio">Loading...</div>

<script nonce="abc123">
function escapeHTML(str) {
  return str.replace(/[&<>"']/g, function (c) {
    return ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[c];
  });
}

async function loadBio() {
  try {
    const response = await fetch('https://api.example.com/user/1');
    if (!response.ok) throw new Error('Network error: ' + response.status);
    const data = await response.json();
    const bioDiv = document.getElementById('bio');
    const safeText = escapeHTML(data.bio || '');
    bioDiv.textContent = safeText;
  } catch (err) {
    document.getElementById('bio').textContent = 'Error loading bio.';
    console.error(err);
  }
}

loadBio();
</script>
</body>
</html>
