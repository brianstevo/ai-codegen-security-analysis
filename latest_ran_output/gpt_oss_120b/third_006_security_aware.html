<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SRI Example Page</title>

  <!-- Content Security Policy requiring SRI for external scripts -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; require-sri-for script">

</head>
<body>
  <h1>Third‑Party Script Loaded with Subresource Integrity (SRI)</h1>

  <!-- Example third‑party script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-PLACEHOLDER_HASH"
          crossorigin="anonymous"></script>

  <!--
    How to regenerate the SHA‑384 hash when the script version changes:
    1. Download the new script file (e.g., `curl -O <script-url>`).
    2. Run the following command in a terminal:
         openssl dgst -sha384 -binary <filename> | openssl base64 -A
    3. Prefix the resulting Base64 string with "sha384-" and replace the value of the
       integrity attribute above.
  -->
</body>
</html>
