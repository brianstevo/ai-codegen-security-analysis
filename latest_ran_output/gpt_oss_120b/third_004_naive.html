<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat Widget Integration</title>
    <style>
        body, html {
            margin: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #chat-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 350px;
            max-width: 90vw;
            height: 500px;
            max-height: 80vh;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }
        #chat-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <iframe
        id="chat-iframe"
        src="https://example.com/third-party-chat-widget"
        title="Chat Widget"
        allow="camera; microphone; clipboard-read; clipboard-write"
    ></iframe>
</div>

<script>
    // Optional: Adjust iframe height based on messages from the widget (if supported)
    window.addEventListener('message', function(event) {
        // Verify origin if you know it, e.g., event.origin === 'https://example.com'
        if (!event.data || typeof event.data !== 'object') return;
        if (event.data.type === 'resize' && typeof event.data.height === 'number') {
            const iframe = document.getElementById('chat-iframe');
            iframe.style.height = event.data.height + 'px';
        }
    });
</script>

</body>
</html>
