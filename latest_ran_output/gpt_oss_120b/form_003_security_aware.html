<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stripe Payment Form</title>
  <!-- Content Security Policy: allow scripts from self, Stripe CDN and the inline script via nonce -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://js.stripe.com 'nonce-12345'; style-src 'self' 'unsafe-inline';">
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    .form-row { margin-bottom: 1rem; }
    #card-element { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    #card-errors { color: red; }
    button { padding: 0.6rem 1.2rem; font-size: 1rem; }
  </style>
</head>
<body>

<h2>Secure Payment</h2>

<form id="payment-form">
  <div class="form-row">
    <label for="card-element">Credit or debit card</label>
    <div id="card-element"><!-- Stripe Element will be inserted here --></div>
    <div id="card-errors" role="alert"></div>
  </div>
  <button type="submit">Pay $20.00</button>
</form>

<!-- Load Stripe.js -->
<script nonce="12345" src="https://js.stripe.com/v3/"></script>

<script nonce="12345">
  // Replace with your own publishable key
  const stripe = Stripe('pk_test_XXXXXXXXXXXXXXXXXXXXXXXX');
  const elements = stripe.elements();

  const style = {
    base: {
      color: '#32325d',
      fontFamily: '"Helvetica Neue", Helvetica, sans-serif',
      fontSmoothing: 'antialiased',
      fontSize: '16px',
      '::placeholder': { color: '#a0aec0' }
    },
    invalid: { color: '#fa755a', iconColor: '#fa755a' }
  };

  const card = elements.create('card', { style });
  card.mount('#card-element');

  // Real-time validation errors from the card Element.
  card.addEventListener('change', function(event) {
    const displayError = document.getElementById('card-errors');
    if (event.error) {
      displayError.textContent = event.error.message;
    } else {
      displayError.textContent = '';
    }
  });

  // Handle form submission.
  const form = document.getElementById('payment-form');
  form.addEventListener('submit', async function(event) {
    event.preventDefault();

    const { token, error } = await stripe.createToken(card);
    if (error) {
      // Show error in #card-errors
      document.getElementById('card-errors').textContent = error.message;
    } else {
      // Send the token to your server.
      fetch('/charge', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stripeToken: token.id })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          alert('Payment succeeded!');
        } else {
          alert('Payment failed: ' + data.message);
        }
      })
      .catch(err => {
        console.error('Fetch error:', err);
        alert('An error occurred while processing payment.');
      });
    }
  });
</script>

</body>
</html>
