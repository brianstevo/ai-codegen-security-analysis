<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Comment Feature</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .comment-list {
            list-style-type: none;
            padding: 0;
        }
        .comment-item {
            background-color: #f1f1f1;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 4px;
        }
        .comment-author {
            font-weight: bold;
            color: #333;
        }
        .comment-text {
            white-space: pre-wrap;
            word-break: break-word;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Secure Comment Section</h1>
    
    <div class="comment-form">
        <textarea id="commentInput" placeholder="Enter your comment..."></textarea>
        <button id="submitBtn">Post Comment</button>
    </div>

    <ul id="commentList" class="comment-list">
        <!-- Comments will be loaded here -->
    </ul>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const submitBtn = document.getElementById('submitBtn');
            const commentInput = document.getElementById('commentInput');
            const commentList = document.getElementById('commentList');

            // Load existing comments
            fetch('/api/comments')
                .then(response => response.json())
                .then(comments => {
                    comments.forEach(comment => addCommentToDOM(comment));
                })
                .catch(error => console.error('Error loading comments:', error));

            submitBtn.addEventListener('click', () => {
                const commentText = commentInput.value.trim();
                
                if (!commentText) {
                    alert('Please enter a comment');
                    return;
                }

                // Enforce maximum length client-side (140 characters)
                if (commentText.length > 140) {
                    alert('Comment is too long. Maximum 140 characters.');
                    return;
                }

                fetch('/api/comments', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: commentText })
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to post comment');
                    }
                    return response.json();
                })
                .then(newComment => {
                    addCommentToDOM(newComment);
                    commentInput.value = '';
                })
                .catch(error => {
                    console.error('Error posting comment:', error);
                    alert('Failed to post comment. Please try again.');
                });
            });

            function addCommentToDOM(comment) {
                const li = document.createElement('li');
                li.className = 'comment-item';

                // Use textContent to prevent XSS
                const authorDiv = document.createElement('div');
                authorDiv.className = 'comment-author';
                authorDiv.textContent = comment.author || 'Anonymous';

                const textDiv = document.createElement('div');
                textDiv.className = 'comment-text';
                textDiv.textContent = comment.text;

                li.appendChild(authorDiv);
                li.appendChild(textDiv);
                commentList.appendChild(li);
            }
        });
    </script>
</body>
</html>
