<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 
      Content Security Policy (CSP) 
      Restricts script execution to same origin and Stripe's domain.
      'strict-dynamic' allows dynamically injected scripts from trusted sources.
    -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://js.stripe.com 'strict-dynamic';">

    <title>Secure Payment Form</title>
    
    <!-- Stripe CSS Reset (Optional but recommended for iframe consistency) -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f6f9fc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 40px;
        }

        h1 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #4a4a4a;
        }

        /* Styling for the input fields that Stripe will inject into */
        .stripe-element {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .stripe-element:focus {
            border-color: #007dcb; /* Stripe Blue */
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 125, 203, 0.2);
        }

        button#submit-payment {
            width: 100%;
            background-color: #645cff; /* Stripe purple/blue */
            color: white;
            border: none;
            border-radius: 4px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button#submit-payment:hover {
            background-color: #534ac9;
        }

        button#submit-payment:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .error-message {
            color: #e85757;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .success-message {
            color: #28a745;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Secure Checkout</h1>
        <p style="text-align: center; color: #666;">Test with card number 4242 4242 4242 4242</p>
        
        <form id="payment-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="stripe-element" required placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label>Card Details</label>
                <!-- Stripe Elements will mount the iframe here -->
                <div id="card-element" class="stripe-element"></div>
                <div id="card-errors" class="error-message"></div>
            </div>

            <button type="submit" id="submit-payment">Pay Now</button>
        </form>

        <div id="success-message" class="success-message">
            Payment successful! Redirecting...
        </div>
    </div>

    <!-- 
      Load Stripe.js from the official domain. 
      The CSP meta tag above permits this script.
    -->
    <script src="https://js.stripe.com/v3/"></script>

    <script>
        // Check if Stripe is available (CSP allowed it)
        if (!window.Stripe) {
            alert('Stripe failed to load. Please check your Content Security Policy and internet connection.');
            throw new Error('Stripe JS not loaded');
        }

        // Initialize Stripe with your Publishable Key
        // NOTE: Replace 'pk_test_...' with your actual publishable key from stripe.com/dashboard
        const stripe = Stripe('pk_test_TYooMQauvdEDq54NiTphI7jx'); 

        // Create an instance of Elements
        const elements = stripe.elements();

        // Configure common styles for the Elements
        const style = {
            base: {
                color: '#32325d',
                fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif',
                fontSmoothing: 'antialiased',
                fontSize: '16px',
                '::placeholder': {
                    color: '#aab7c4'
                }
            },
            invalid: {
                color: '#fa755a',
                iconColor: '#fa755a'
            }
        };

        // Create an instance of the card Element
        const card = elements.create('card', { style: style });

        // Mount the card Element to the #card-element div
        card.mount('#card-element');

        // Handle real-time validation errors from the card Element
        card.on('change', function(event) {
            const displayError = document.getElementById('card-errors');
            if (event.error) {
                displayError.textContent = event.error.message;
                displayError.style.display = 'block';
            } else {
                displayError.textContent = '';
                displayError.style.display = 'none';
            }
        });

        // Handle form submission
        const paymentForm = document.getElementById('payment-form');
        
        paymentForm.addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the form from submitting to the server directly

            const submitButton = document.getElementById('submit-payment');
            
            // Disable button to prevent double submission
            submitButton.disabled = true;
            submitButton.textContent = 'Processing...';

            // Trigger tokenization with Stripe
            stripe.createToken(card).then(function(result) {
                if (result.error) {
                    // Show error in your UI
                    const errorElement = document.getElementById('card-errors');
                    errorElement.textContent = result.error.message;
                    errorElement.style.display = 'block';
                    
                    submitButton.disabled = false;
                    submitButton.textContent = 'Pay Now';
                } else {
                    // The token has been created successfully. Send it to your backend.
                    const token = result.token;
                    const email = document.getElementById('email').value;

                    // In a real application, you would use fetch() or XMLHttpRequest
                    // to send the token ID to your server for charge creation.
                    
                    console.log('Token received:', token.id);
                    console.log('Customer Email:', email);

                    // Simulate backend submission
                    submitPaymentToBackend(token.id, email);
                }
            });
        });

        function submitPaymentToBackend(tokenId, email) {
            // Example payload structure expected by a typical backend integration
            const paymentData = {
                stripeToken: tokenId,
                stripeEmail: email,
                amount: 2000, // $20.00 in cents (example)
                currency: 'usd'
            };

            fetch('/api/create-payment-intent', { // Replace with your actual backend endpoint
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(paymentData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('success-message').style.display = 'block';
                    paymentForm.style.display = 'none';
                } else {
                    alert('Payment failed: ' + data.message);
                    document.getElementById('submit-payment').disabled = false;
                    document.getElementById('submit-payment').textContent = 'Pay Now';
                }
            })
            .catch((error) => {
                console.error('Error:', error);
                alert('An error occurred. Please try again.');
                document.getElementById('submit-payment').disabled = false;
                document.getElementById('submit-payment').textContent = 'Pay Now';
            });
        }
    </script>
</body>
</html>
