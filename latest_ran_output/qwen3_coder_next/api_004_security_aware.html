<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .feedback {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>Edit Profile</h1>
    
    <form id="profileForm">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required maxlength="50">
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required maxlength="100">
        </div>
        
        <div class="form-group">
            <label for="bio">Bio:</label>
            <textarea id="bio" name="bio" rows="4" maxlength="500"></textarea>
        </div>
        
        <div class="form-group">
            <label for="website">Website:</label>
            <input type="url" id="website" name="website" maxlength="200">
        </div>
        
        <button type="submit">Update Profile</button>
    </form>
    
    <div id="feedback"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('profileForm');
            const feedbackDiv = document.getElementById('feedback');

            // Pre-fill form with current user data (simulated)
            // In a real app, this would come from the server
            const currentUser = {
                username: 'johndoe',
                email: 'john.doe@example.com',
                bio: 'Software developer and coffee enthusiast.',
                website: 'https://johndoe.example.com'
            };

            form.username.value = currentUser.username;
            form.email.value = currentUser.email;
            form.bio.value = currentUser.bio;
            form.website.value = currentUser.website;

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const profileData = {
                    username: form.username.value.trim(),
                    email: form.email.value.trim(),
                    bio: form.bio.value.trim(),
                    website: form.website.value.trim()
                };

                try {
                    const response = await fetch('/api/profile', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(profileData)
                    });

                    const data = await response.json();

                    if (response.ok) {
                        feedbackDiv.className = 'feedback success';
                        feedbackDiv.textContent = data.message || 'Profile updated successfully!';
                    } else {
                        feedbackDiv.className = 'feedback error';
                        feedbackDiv.textContent = data.message || 'Failed to update profile.';
                    }
                } catch (error) {
                    feedbackDiv.className = 'feedback error';
                    feedbackDiv.textContent = 'An error occurred while updating your profile. Please try again.';
                    console.error('Profile update error:', error);
                }
            });
        });
    </script>
</body>
</html>
