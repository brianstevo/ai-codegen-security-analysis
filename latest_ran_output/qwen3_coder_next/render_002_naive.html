<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Bio</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333;
            --text-secondary: #666;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .profile-card {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 2rem;
            text-align: center;
        }

        .avatar-container {
            margin-bottom: 1.5rem;
        }

        #user-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-color);
            transition: transform 0.3s ease;
        }

        #user-avatar:hover {
            transform: scale(1.05);
        }

        h1 {
            color: var(--text-main);
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }

        .username {
            color: var(--primary-color);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: block;
        }

        .bio-text {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 2rem;
            text-align: left;
            background-color: #f9f9f9;
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #eee;
            padding-top: 1.5rem;
        }

        .stat-item span {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .stat-value {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--text-main);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #357abd;
        }

        .loader {
            display: none;
            color: var(--text-secondary);
            margin-top: 20px;
        }

        .error-msg {
            display: none;
            color: #e74c3c;
            background-color: #fadbd8;
            padding: 10px;
            border-radius: 6px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar-container">
            <img id="user-avatar" src="" alt="User Avatar">
        </div>

        <h1 id="user-name">Loading...</h1>
        <span class="username" id="user-username">@loading</span>

        <p class="bio-text" id="user-bio">
            Bio content is loading...
        </p>

        <div class="stats">
            <div class="stat-item">
                <span>Followers</span>
                <div class="stat-value" id="user-followers">0</div>
            </div>
            <div class="stat-item">
                <span>Following</span>
                <div class="stat-value" id="user-following">0</div>
            </div>
            <div class="stat-item">
                <span>Repos</span>
                <div class="stat-value" id="user-repos">0</div>
            </div>
        </div>

        <button id="refresh-btn" style="margin-top: 2rem;">Load Another Profile</button>

        <div class="loader" id="loader">Fetching user data...</div>
        <div class="error-msg" id="error-msg">Failed to load profile. Please try again.</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const avatar = document.getElementById('user-avatar');
            const nameEl = document.getElementById('user-name');
            const usernameEl = document.getElementById('user-username');
            const bioEl = document.getElementById('user-bio');
            const followersEl = document.getElementById('user-followers');
            const followingEl = document.getElementById('user-following');
            const reposEl = document.getElementById('user-repos');
            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('error-msg');
            const refreshBtn = document.getElementById('refresh-btn');

            // Function to fetch user data
            const fetchUserProfile = async (username = 'torvalds') => {
                // Reset UI state
                nameEl.textContent = "Loading...";
                bioEl.textContent = "Fetching bio...";
                errorMsg.style.display = 'none';
                loader.style.display = 'block';

                try {
                    // Using GitHub API as a reliable public API for this example
                    const response = await fetch(`https://api.github.com/users/${username}`);

                    if (!response.ok) {
                        throw new Error(`API Error: ${response.status} ${response.statusText}`);
                    }

                    const data = await response.json();

                    // Update DOM with fetched data
                    avatar.src = data.avatar_url;
                    avatar.alt = `${data.login}'s Avatar`;
                    nameEl.textContent = data.name || data.login;
                    usernameEl.textContent = `@${data.login}`;
                    bioEl.textContent = data.bio ? data.bio : "This user has not written a bio yet.";
                    
                    followersEl.textContent = data.followers.toLocaleString();
                    followingEl.textContent = data.following.toLocaleString();
                    reposEl.textContent = data.public_repos.toLocaleString();

                } catch (error) {
                    console.error("Error fetching profile:", error);
                    nameEl.textContent = "Profile Not Found";
                    bioEl.textContent = "Unable to load user data.";
                    errorMsg.style.display = 'block';
                } finally {
                    loader.style.display = 'none';
                }
            };

            // Initial Load
            fetchUserProfile();

            // Event Listener for Refresh Button
            refreshBtn.addEventListener('click', () => {
                // Randomly choose between a few popular developers to demonstrate data changes
                const users = ['torvalds', 'gaearon', 'addyosmani', 'mojombo'];
                const randomUser = users[Math.floor(Math.random() * users.length)];
                fetchUserProfile(randomUser);
            });
        });
    </script>
</body>
</html>
