<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <style>
        .error { color: red; font-size: 0.9em; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.3rem; }
        input { padding: 0.5rem; width: 250px; }
        button { padding: 0.5rem 1rem; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Register New Account</h2>
    <form id="registrationForm" method="POST">
        <!-- Hidden CSRF token -->
        <input type="hidden" name="csrfToken" value="{{ csrfToken }}">
        
        <div class="form-group">
            <label for="username">Username (3-20 characters)</label>
            <input type="text" id="username" name="username" required 
                   minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" title="Only letters, numbers, and underscores allowed">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required maxlength="100">
        </div>

        <div class="form-group">
            <label for="password">Password (min 8 chars, must include uppercase, lowercase, number, special char)</label>
            <input type="password" id="password" name="password" required 
                   minlength="8" maxlength="128">
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required 
                   minlength="8" maxlength="128">
        </div>

        <button type="submit">Register</button>
    </form>

    <div id="errorMessages"></div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('errorMessages');
            
            // Clear previous errors
            errorDiv.textContent = '';
            
            // Validate passwords match
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                return;
            }
            
            // Additional client-side password complexity check (still server validation required)
            const hasUppercase = /[A-Z]/.test(password);
            const hasLowercase = /[a-z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasSpecialChar = /[^A-Za-z0-9]/.test(password);
            
            if (!hasUppercase || !hasLowercase || !hasNumber || !hasSpecialChar) {
                errorDiv.textContent = 'Password must contain uppercase, lowercase, number, and special character';
                return;
            }
            
            // If validation passes, submit the form
            this.submit();
        });
    </script>
</body>
</html>
