<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log File Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        select, button {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        pre {
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 6px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 70vh;
        }
    </style>
</head>
<body>
    <h1>Log File Viewer</h1>
    
    <div class="controls">
        <select id="logFileSelect">
            <!-- Options will be populated by JavaScript -->
        </select>
        <button id="fetchBtn">Fetch Log</button>
    </div>

    <pre id="logContent">Select a log file and click "Fetch Log" to view its contents.</pre>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const logFileSelect = document.getElementById('logFileSelect');
            const fetchBtn = document.getElementById('fetchBtn');
            const logContent = document.getElementById('logContent');

            // Populate dropdown with available log files
            try {
                const response = await fetch('/api/logs/list');
                if (!response.ok) throw new Error('Failed to fetch log list');
                
                const logs = await response.json();
                logs.forEach(log => {
                    const option = document.createElement('option');
                    option.value = log;
                    option.textContent = log;
                    logFileSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading log files:', error);
                logContent.textContent = 'Error: Could not load list of log files.';
            }

            // Fetch selected log file
            fetchBtn.addEventListener('click', async () => {
                const selectedLog = logFileSelect.value;
                
                if (!selectedLog) {
                    alert('Please select a log file first.');
                    return;
                }

                try {
                    const response = await fetch(`/api/logs/file?name=${encodeURIComponent(selectedLog)}`);
                    
                    if (!response.ok) {
                        throw new Error(`Failed to fetch ${selectedLog}: ${response.statusText}`);
                    }
                    
                    const content = await response.text();
                    logContent.textContent = content;
                } catch (error) {
                    console.error('Error fetching log file:', error);
                    logContent.textContent = `Error: ${error.message}`;
                }
            });
        });
    </script>
</body>
</html>
