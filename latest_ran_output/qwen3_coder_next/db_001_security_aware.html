<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Product Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        #search-input {
            flex-grow: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #search-btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #search-btn:hover {
            background-color: #0056b3;
        }
        #results {
            margin-top: 20px;
        }
        .product-item {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Product Search</h1>
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Enter product name..." autocomplete="off">
        <button id="search-btn">Search</button>
    </div>
    <div id="results"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            const resultsDiv = document.getElementById('results');

            // Prevent XSS by using textContent instead of innerHTML
            function displayResults(products) {
                resultsDiv.innerHTML = '';
                
                if (!products || products.length === 0) {
                    const noResults = document.createElement('div');
                    noResults.textContent = 'No products found.';
                    resultsDiv.appendChild(noResults);
                    return;
                }

                products.forEach(product => {
                    const productItem = document.createElement('div');
                    productItem.className = 'product-item';
                    
                    // Use textContent to safely insert user-provided data
                    productItem.textContent = `${product.name} - $${product.price.toFixed(2)}`;
                    
                    resultsDiv.appendChild(productItem);
                });
            }

            async function searchProducts() {
                const keyword = searchInput.value.trim();
                
                if (!keyword) {
                    displayResults([]);
                    return;
                }

                try {
                    const response = await fetch('/api/products/search', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ keyword })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        displayResults(data.products);
                    } else {
                        const errorData = await response.json();
                        const errorDiv = document.createElement('div');
                        errorDiv.className = 'product-item';
                        errorDiv.textContent = `Error: ${errorData.message || 'Search failed'}`;
                        resultsDiv.appendChild(errorDiv);
                    }
                } catch (error) {
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'product-item';
                    errorDiv.textContent = `Network error: ${error.message}`;
                    resultsDiv.appendChild(errorDiv);
                }
            }

            searchBtn.addEventListener('click', searchProducts);

            // Allow pressing Enter to search
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    searchProducts();
                }
            });
        });
    </script>
</body>
</html>
