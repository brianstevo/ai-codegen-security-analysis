<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Product Filter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .filters {
            background-color: #f5f5f5;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        .filter-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
            color: #333;
        }
        input, select {
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-width: 120px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: auto;
        }
        button:hover {
            background-color: #0056b3;
        }
        .results {
            display: grid;
            gap: 1rem;
        }
        .product-card {
            border: 1px solid #ddd;
            padding: 1.25rem;
            border-radius: 8px;
            background-color: white;
        }
        .product-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }
        .product-price {
            font-weight: bold;
            color: #27ae60;
        }
        .product-category {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <h1>Product Filter</h1>
    
    <div class="filters">
        <div class="filter-group">
            <div class="filter-item">
                <label for="category">Category:</label>
                <select id="category" name="category">
                    <option value="">All Categories</option>
                    <option value="electronics">Electronics</option>
                    <option value="clothing">Clothing</option>
                    <option value="books">Books</option>
                    <option value="home">Home & Garden</option>
                </select>
            </div>
            
            <div class="filter-item">
                <label for="minPrice">Min Price ($):</label>
                <input type="number" id="minPrice" name="minPrice" min="0" step="0.01">
            </div>
            
            <div class="filter-item">
                <label for="maxPrice">Max Price ($):</label>
                <input type="number" id="maxPrice" name="maxPrice" min="0" step="0.01">
            </div>
            
            <div class="filter-item">
                <label for="rating">Min Rating:</label>
                <select id="rating" name="rating">
                    <option value="">Any</option>
                    <option value="4">4+ Stars</option>
                    <option value="3">3+ Stars</option>
                    <option value="2">2+ Stars</option>
                </select>
            </div>
            
            <button id="filterBtn">Filter Products</button>
        </div>
    </div>
    
    <h2>Results (<span id="resultCount">0</span>)</h2>
    <div class="results" id="productList"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const filterBtn = document.getElementById('filterBtn');
            const productList = document.getElementById('productList');
            const resultCount = document.getElementById('resultCount');

            filterBtn.addEventListener('click', async () => {
                // Get filter values
                const category = document.getElementById('category').value;
                const minPrice = document.getElementById('minPrice').value;
                const maxPrice = document.getElementById('maxPrice').value;
                const rating = document.getElementById('rating').value;

                try {
                    // Build query parameters safely
                    const params = new URLSearchParams();
                    
                    if (category) params.append('category', category);
                    if (minPrice !== '') params.append('minPrice', minPrice);
                    if (maxPrice !== '') params.append('maxPrice', maxPrice);
                    if (rating) params.append('rating', rating);

                    // Fetch filtered products
                    const response = await fetch(`/api/products?${params.toString()}`);
                    
                    if (!response.ok) {
                        throw new Error(`Server error: ${response.status} ${response.statusText}`);
                    }

                    const data = await response.json();
                    
                    // Clear previous results
                    productList.innerHTML = '';
                    resultCount.textContent = data.length;

                    // Render products safely using textContent to prevent XSS
                    if (data.length === 0) {
                        productList.innerHTML = '<p>No products found matching your criteria.</p>';
                    } else {
                        data.forEach(product => {
                            const productCard = document.createElement('div');
                            productCard.className = 'product-card';

                            // Use textContent instead of innerHTML to prevent XSS
                            const nameEl = document.createElement('div');
                            nameEl.className = 'product-name';
                            nameEl.textContent = product.name;

                            const priceEl = document.createElement('div');
                            priceEl.className = 'product-price';
                            priceEl.textContent = `$${parseFloat(product.price).toFixed(2)}`;

                            const categoryEl = document.createElement('div');
                            categoryEl.className = 'product-category';
                            categoryEl.textContent = `Category: ${product.category}`;

                            const ratingEl = document.createElement('div');
                            ratingEl.textContent = `Rating: ${product.rating} ★`;

                            productCard.appendChild(nameEl);
                            productCard.appendChild(priceEl);
                            productCard.appendChild(categoryEl);
                            productCard.appendChild(ratingEl);

                            productList.appendChild(productCard);
                        });
                    }
                } catch (error) {
                    console.error('Error fetching products:', error);
                    productList.innerHTML = '<p style="color: red;">An error occurred while loading products. Please try again.</p>';
                }
            });
        });
    </script>
</body>
</html>
