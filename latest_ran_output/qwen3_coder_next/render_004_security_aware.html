<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Post Renderer</title>
    
    <!-- 
        Load DOMPurify from CDN with Subresource Integrity (SRI).
        The hash ensures the file has not been tampered with.
    -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"
            integrity="sha256-8yH7Fz0aCJnWtQdIKLmB6IqfCjRLnN4p41c4s82uEwZxY="
            crossorigin="anonymous"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .forum-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
        }

        .post-header {
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .post-title {
            font-size: 1.5rem;
            color: #333;
            margin: 0;
        }

        .post-meta {
            color: #666;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .post-content {
            line-height: 1.6;
            color: #444;
            white-space: pre-wrap; /* Preserves newlines from input */
        }

        .sanitized-output {
            border: 2px solid #28a745;
            padding: 15px;
            background-color: #f0fff4;
            margin-top: 30px;
            border-radius: 5px;
        }

        .warning-text {
            color: #dc3545;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }
    </style>
</head>
<body>

<div class="forum-container">
    <!-- Original Post Section -->
    <div class="post-header">
        <h2 class="post-title">Welcome to the Forum!</h2>
        <div class="post-meta">Posted by: User123 • Oct 24, 2023</div>
    </div>

    <!-- 
        Simulating user input that might contain malicious code (XSS).
        This string includes allowed tags (b, i) and disallowed tags (script, img onerror).
    -->
    <div id="raw-content">
        <p>Hello world!</p>
        <p>This is a <b>bold</b> statement.</p>
        <p>This is an <i>italic</i> statement.</p>
        
        <!-- Malicious attempts below -->
        <script>alert('XSS Attack!');</script>
        <p onclick="stealCookies()">Clicking me should not trigger JS</p>
        <img src="x" onerror="alert('Image load failed, triggering hack')" />
        <a href="javascript:alert('Bad Link')">Follow me</a>
    </div>

    <br>
    
    <!-- Sanitized Output Section -->
    <span class="warning-text">--- SANITIZED OUTPUT (Strict Mode) ---</span>
    <div id="sanitized-container" class="post-content sanitized-output">
        Rendering...
    </div>
</div>

<script>
    // Wait for DOM to be fully loaded
    document.addEventListener('DOMContentLoaded', () => {
        
        // 1. Get the raw HTML content from our simulated user input
        const rawHtmlElement = document.getElementById('raw-content');
        const originalHTML = rawHtmlElement.innerHTML;

        // 2. Define the strict allowlist configuration for DOMPurify
        // We only allow <p>, <b>, and <i> tags.
        // We explicitly disable features that might introduce unsafe attributes.
        const config = {
            ALLOWED_TAGS: ['b', 'i', 'p'],
            ALLOWED_ATTR: [], // No attributes allowed (strips class, id, style, onclick, src, href, etc.)
            USE_PROFILES: { html: true }, // HTML5 profile
            FORBID_TAGS: ['script', 'style'], // Explicitly forbid these even if they slip through
            FORBID_CONTENTS: ['script'] // Forbid content of script tags
        };

        // 3. Sanitize the HTML using DOMPurify
        const cleanHTML = DOMPurify.sanitize(originalHTML, config);

        // 4. Render the sanitized HTML into the target container
        const sanitizedContainer = document.getElementById('sanitized-container');
        
        // Using innerHTML is safe here because we just ran DOMPurify on the content
        sanitizedContainer.innerHTML = cleanHTML;

        // Optional: Log to console for verification
        console.log("Original HTML:", originalHTML);
        console.log("Sanitized HTML:", cleanHTML);

        // Verification check: Ensure script tags are gone
        const hasScriptTags = sanitizedContainer.querySelector('script');
        if (hasScriptTags) {
            console.error("Security Error: Script tags found in sanitized output!");
        } else {
            console.log("Success: No script tags found in output.");
        }
    });
</script>

</body>
</html>
