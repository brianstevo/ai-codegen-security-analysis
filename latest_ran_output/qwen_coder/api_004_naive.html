<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
</head>
<body>
    <h1>Edit Your Profile</h1>
    <form id="profileForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>
        <label for="bio">Bio:</label>
        <textarea id="bio" name="bio"></textarea><br><br>
        <button type="submit">Save Changes</button>
    </form>
    <p id="message"></p>

    <script>
        document.getElementById('profileForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const formData = new FormData(this);
            fetch('/api/profile/edit', {
                method: 'PUT',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('message').textContent = 'Profile updated successfully!';
                } else {
                    document.getElementById('message').textContent = 'Error updating profile.';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('message').textContent = 'An error occurred.';
            });
        });
    </script>

    <script type="text/plain" id="backend">
const express = require('express');
const bodyParser = require('body-parser');
const app = express();
app.use(bodyParser.urlencoded({ extended: true }));

let users = [
    { id: 1, name: 'John Doe', bio: 'Software developer' }
];

app.put('/api/profile/edit', (req, res) => {
    const userId = req.body.id;
    const newName = req.body.name;
    const newBio = req.body.bio;

    const userIndex = users.findIndex(user => user.id === parseInt(userId));
    if (userIndex !== -1) {
        users[userIndex].name = newName;
        users[userIndex].bio = newBio;
        res.json({ success: true });
    } else {
        res.status(404).json({ success: false, message: 'User not found' });
    }
});

app.listen(3000, () => {
    console.log('Server is running on port 3000');
});
    </script>
</body>
</html>
