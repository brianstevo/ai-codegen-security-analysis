<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .dashboard {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .balance {
            font-size: 24px;
            color: #5cb85c;
        }
        .transactions {
            list-style-type: none;
            padding: 0;
        }
        .transaction {
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }
        .amount {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Banking Dashboard</h1>
        <div class="balance">Current Balance: $1,500.00</div>
        <ul class="transactions">
            <li class="transaction">
                <span class="amount">$200.00</span> - Deposit
            </li>
            <li class="transaction">
                <span class="amount">$100.00</span> - Withdrawal
            </li>
        </ul>
    </div>
</body>
</html>
