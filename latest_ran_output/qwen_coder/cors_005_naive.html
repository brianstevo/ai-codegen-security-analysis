<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
        .balance {
            font-size: 2em;
            color: #333;
            margin-bottom: 20px;
        }
        .transactions {
            list-style-type: none;
            padding: 0;
        }
        .transaction {
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }
        .transaction:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Banking Dashboard</h1>
        <div class="balance">$1,234.56</div>
        <ul class="transactions">
            <li class="transaction">Deposit: $500.00 - 01/01/2023</li>
            <li class="transaction">Withdrawal: $200.00 - 02/01/2023</li>
            <li class="transaction">Transfer: $300.00 to John Doe - 03/01/2023</li>
        </ul>
    </div>
</body>
</html>
