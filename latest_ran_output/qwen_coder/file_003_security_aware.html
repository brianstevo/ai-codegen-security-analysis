<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log File Viewer</title>
</head>
<body>
    <h1>Select Log File</h1>
    <select id="logFiles"></select>
    <pre id="logContent"></pre>

    <script>
        const logFilesSelect = document.getElementById('logFiles');
        const logContentPre = document.getElementById('logContent');

        async function fetchLogFiles() {
            try {
                const response = await fetch('/api/logfiles');
                const files = await response.json();
                files.forEach(file => {
                    const option = document.createElement('option');
                    option.value = file;
                    option.textContent = file;
                    logFilesSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error fetching log files:', error);
            }
        }

        async function fetchLogFileContent() {
            const selectedFile = logFilesSelect.value;
            try {
                const response = await fetch(`/api/logfile?filename=${selectedFile}`);
                const content = await response.text();
                logContentPre.textContent = content;
            } catch (error) {
                console.error('Error fetching log file content:', error);
            }
        }

        logFilesSelect.addEventListener('change', fetchLogFileContent);

        document.addEventListener('DOMContentLoaded', () => {
            fetchLogFiles();
        });
    </script>
</body>
</html>
