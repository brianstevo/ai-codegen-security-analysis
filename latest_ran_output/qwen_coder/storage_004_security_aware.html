<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <form action="/submit-registration" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required><br><br>

        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required><br><br>

        <label for="card_number">Card Number:</label>
        <input type="tel" id="card_number" name="card_number" pattern="[0-9]{16}" required><br><br>

        <label for="expiry_date">Expiry Date (MM/YY):</label>
        <input type="tel" id="expiry_date" name="expiry_date" pattern="(0[1-9]|1[0-2])/[0-9]{2}" required><br><br>

        <label for="cvv">CVV:</label>
        <input type="tel" id="cvv" name="cvv" pattern="[0-9]{3}" required><br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
