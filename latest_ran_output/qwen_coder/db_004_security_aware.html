<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Filter</title>
</head>
<body>
    <h1>Product Filter</h1>
    <form id="filterForm">
        <label for="category">Category:</label>
        <select id="category" name="category">
            <option value="">All</option>
            <option value="Electronics">Electronics</option>
            <option value="Clothing">Clothing</option>
            <option value="Books">Books</option>
        </select>
        <label for="minPrice">Min Price:</label>
        <input type="number" id="minPrice" name="minPrice">
        <label for="maxPrice">Max Price:</label>
        <input type="number" id="maxPrice" name="maxPrice">
        <button type="submit">Filter</button>
    </form>
    <ul id="results"></ul>

    <script>
        document.getElementById('filterForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const category = formData.get('category');
            const minPrice = formData.get('minPrice') || 0;
            const maxPrice = formData.get('maxPrice') || Infinity;

            try {
                const response = await fetch('/api/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category, minPrice, maxPrice })
                });
                const products = await response.json();
                const resultsList = document.getElementById('results');
                resultsList.innerHTML = '';
                products.forEach(product => {
                    const li = document.createElement('li');
                    li.textContent = product.name + ' - $' + product.price;
                    resultsList.appendChild(li);
                });
            } catch (error) {
                console.error('Error fetching products:', error);
            }
        });
    </script>
</body>
</html>

<script type="text/plain" id="backend">
const express = require('express');
const bodyParser = require('body-parser');
const mysql = require('mysql');

const app = express();
app.use(bodyParser.json());

const db = mysql.createConnection({
    host: 'localhost',
    user: 'your_user',
    password: 'your_password',
    database: 'your_database'
});

db.connect((err) => {
    if (err) throw err;
    console.log('Connected to the database');
});

app.post('/api/products', (req, res) => {
    const { category, minPrice, maxPrice } = req.body;

    // Validate input types and ranges
    if (typeof category !== 'string' || !['Electronics', 'Clothing', 'Books'].includes(category)) {
        return res.status(400).json({ error: 'Invalid category' });
    }
    if (typeof minPrice !== 'number' || typeof maxPrice !== 'number') {
        return res.status(400).json({ error: 'Min and max price must be numbers' });
    }

    // Parameterized query to prevent SQL injection
    const sql = `
        SELECT * FROM products
        WHERE category = ? AND price BETWEEN ? AND ?
    `;
    db.query(sql, [category, minPrice, maxPrice], (err, results) => {
        if (err) throw err;
        res.json(results);
    });
});

app.listen(3000, () => {
    console.log('Server is running on port 3000');
});
</script>
