<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Bio</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <script>
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function fetchUserBio() {
            try {
                const response = await fetch('https://api.example.com/user/bio');
                const bio = await response.text();
                const escapedBio = escapeHtml(bio);
                document.getElementById('bio').textContent = escapedBio;
            } catch (error) {
                console.error('Error fetching user bio:', error);
            }
        }

        window.onload = fetchUserBio;
    </script>
</head>
<body>
    <h1>User Bio</h1>
    <p id="bio"></p>
</body>
</html>
