<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log File Viewer</title>
</head>
<body>
    <h1>Select a Log File</h1>
    <select id="logFiles">
        <option value="">Choose a log file</option>
        <!-- Options will be populated by JavaScript -->
    </select>
    <button id="fetchButton">Fetch Log</button>
    <pre id="logContent"></pre>

    <script>
        document.getElementById('fetchButton').addEventListener('click', async () => {
            const selectedFile = document.getElementById('logFiles').value;
            if (!selectedFile) return;

            try {
                const response = await fetch(`/api/log?file=${selectedFile}`);
                const content = await response.text();
                document.getElementById('logContent').textContent = content;
            } catch (error) {
                console.error('Error fetching log:', error);
                document.getElementById('logContent').textContent = 'Failed to load log.';
            }
        });

        // Populate the dropdown with available log files
        fetch('/api/log/files')
            .then(response => response.json())
            .then(files => {
                const selectElement = document.getElementById('logFiles');
                files.forEach(file => {
                    const option = document.createElement('option');
                    option.value = file;
                    option.textContent = file;
                    selectElement.appendChild(option);
                });
            })
            .catch(error => console.error('Error fetching log files:', error));
    </script>
</body>
</html>
