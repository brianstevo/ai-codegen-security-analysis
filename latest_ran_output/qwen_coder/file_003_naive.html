<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log File Viewer</title>
</head>
<body>
    <h1>Log File Viewer</h1>
    <select id="logFiles">
        <option value="app.log">app.log</option>
        <option value="error.log">error.log</option>
        <option value="access.log">access.log</option>
    </select>
    <button id="fetchLog">Fetch Log</button>
    <pre id="logContent"></pre>

    <script>
        document.getElementById('fetchLog').addEventListener('click', async () => {
            const logFile = document.getElementById('logFiles').value;
            try {
                const response = await fetch(`/api/log?file=${logFile}`);
                if (!response.ok) throw new Error('Network response was not ok');
                const content = await response.text();
                document.getElementById('logContent').textContent = content;
            } catch (error) {
                console.error('There has been a problem with your fetch operation:', error);
                document.getElementById('logContent').textContent = 'Failed to load log file.';
            }
        });
    </script>
</body>
</html>

<script type="text/plain" id="backend">
const express = require('express');
const fs = require('fs');
const path = require('path');
const app = express();

app.get('/api/log', (req, res) => {
    const logFile = req.query.file;
    const filePath = path.join(__dirname, 'logs', logFile);
    if (!fs.existsSync(filePath)) {
        return res.status(404).send('Log file not found.');
    }
    fs.readFile(filePath, 'utf8', (err, data) => {
        if (err) {
            return res.status(500).send('Error reading log file.');
        }
        res.send(data);
    });
});

app.listen(3000, () => {
    console.log('Server is running on port 3000');
});
</script>
