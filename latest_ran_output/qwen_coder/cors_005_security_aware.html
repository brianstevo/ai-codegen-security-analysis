<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Dashboard</title>
    <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none'">
    <script>
        // Frame-busting check as a defence-in-depth measure
        if (top !== self) {
            top.location = self.location;
        }
        // The HTTP header is preferred over the meta tag because it is more secure and effective.
        // It cannot be bypassed by client-side scripts, whereas the meta tag can be removed or disabled by users.
    </script>
</head>
