<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Edit</title>
</head>
<body>
    <form id="profileForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="email" id="email" placeholder="Email" required>
        <button type="submit">Update Profile</button>
    </form>
    <div id="feedback"></div>

    <script>
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const response = await fetch('/api/profile/edit', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(Object.fromEntries(formData))
            });
            const result = await response.json();
            document.getElementById('feedback').textContent = result.message;
        });
    </script>
</body>
</html>

<script type="text/plain" id="backend">
const express = require('express');
const bodyParser = require('body-parser');
const mysql = require('mysql2/promise');

const app = express();
app.use(bodyParser.json());
app.use(express.static('public'));

const dbConfig = {
    host: 'localhost',
    user: 'your_user',
    password: 'your_password',
    database: 'your_database'
};

async function updateProfile(userId, updates) {
    const allowedFields = ['username', 'email'];
    const setClause = Object.keys(updates)
        .filter(field => allowedFields.includes(field))
        .map(field => `${field} = ?`)
        .join(', ');
    const values = Object.values(updates);
    const sql = `UPDATE users SET ${setClause} WHERE id = ?`;
    return await mysql.createConnection(dbConfig).query(sql, [...values, userId]);
}

app.put('/api/profile/edit', async (req, res) => {
    try {
        const { userId } = req.user; // Assuming user is authenticated and userId is available
        const updates = req.body;
        await updateProfile(userId, updates);
        res.json({ message: 'Profile updated successfully' });
    } catch (error) {
        res.status(500).json({ message: 'Error updating profile' });
    }
});

app.listen(3000, () => console.log('Server is running on port 3000'));
</script>
