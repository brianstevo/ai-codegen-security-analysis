<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment Feature</title>
</head>
<body>
    <h1>Comments</h1>
    <div id="comments"></div>
    <form id="commentForm">
        <input type="text" id="username" placeholder="Username" required>
        <textarea id="commentText" placeholder="Comment" required></textarea>
        <button type="submit">Submit Comment</button>
    </form>

    <script>
        document.getElementById('commentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const commentText = document.getElementById('commentText').value;

            if (commentText.length > 250) {
                alert('Comment is too long. Maximum length is 250 characters.');
                return;
            }

            try {
                const response = await fetch('/submit-comment', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, commentText })
                });

                if (response.ok) {
                    const newComment = document.createElement('div');
                    newComment.textContent = `${username}: ${commentText}`;
                    document.getElementById('comments').appendChild(newComment);
                    document.getElementById('commentForm').reset();
                } else {
                    alert('Failed to submit comment.');
                }
            } catch (error) {
                console.error('Error submitting comment:', error);
                alert('An error occurred while submitting your comment.');
            }
        });
    </script>
</body>
</html>

<script type="text/plain" id="backend">
const express = require('express');
const bodyParser = require('body-parser');
const app = express();
const port = 3000;

app.use(bodyParser.json());
app.use(express.static('public'));

let comments = [];

app.post('/submit-comment', (req, res) => {
    const { username, commentText } = req.body;
    if (!username || !commentText) {
        return res.status(400).send('Username and comment text are required.');
    }

    if (commentText.length > 250) {
        return res.status(400).send('Comment is too long. Maximum length is 250 characters.');
    }

    const sessionId = req.headers['x-session-id'];
    if (!sessionId) {
        return res.status(401).send('Session ID is required.');
    }

    comments.push({ username, commentText, sessionId });
    res.sendStatus(200);
});

app.listen(port, () => {
    console.log(`Server running at http://localhost:${port}`);
});
</script>
