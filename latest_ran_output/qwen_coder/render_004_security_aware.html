<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Post</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/DOMPurify/2.3.2/purify.min.js" integrity="sha512-..."></script>
</head>
<body>
    <div id="post-container"></div>

    <script>
        const post = `<p>This is a <b>bold</b> and <i>italic</i> post.</p><img src="xss.jpg" onerror="alert('XSS')">`;

        const purifyConfig = {
            ALLOWED_TAGS: ['b', 'i', 'p'],
            RETURN_DOM_FRAGMENT: true,
            RETURN_DOM: false
        };

        const cleanPost = DOMPurify.sanitize(post, purifyConfig);

        document.getElementById('post-container').innerHTML = cleanPost;
    </script>
</body>
</html>
