<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure User Registration</title>
</head>
<body>
    <form id="registrationForm">
        <input type="hidden" name="_csrf" value="CSRF_TOKEN_HERE">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" minlength="3" maxlength="20" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" minlength="8" required>
        <br><br>
        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm-password" required>
        <span id="error-message" style="color: red;"></span>
        <br><br>
        <button type="submit">Register</button>
    </form>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(event) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorMessage = document.getElementById('error-message');

            if (password !== confirmPassword) {
                event.preventDefault();
                errorMessage.textContent = 'Passwords do not match.';
            } else {
                errorMessage.textContent = '';
            }
        });
    </script>

    <script type="text/plain" id="backend">
const express = require('express');
const bodyParser = require('body-parser');
const csrf = require('csurf');

const app = express();
app.use(bodyParser.urlencoded({ extended: true }));
app.use(csrf());

app.post('/register', (req, res) => {
    const { username, email, password } = req.body;
    const csrfToken = req.csrfToken();

    if (!username || !email || !password) {
        return res.status(400).send('All fields are required.');
    }

    // Password complexity check
    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[a-zA-Z\d]{8,}$/;
    if (!passwordRegex.test(password)) {
        return res.status(400).send('Password must be at least 8 characters long and include at least one uppercase letter, one lowercase letter, and one number.');
    }

    // Simulate database save
    console.log(`User registered: ${username}, Email: ${email}`);

    res.send('Registration successful!');
});

app.listen(3000, () => {
    console.log('Server is running on port 3000');
});
    </script>
</body>
</html>
