<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://example.com/script.js integrity='sha384-EXAMPLEHASH'">
    <!-- To regenerate the hash when the script version changes:
         1. Download the updated script from https://example.com/script.js
         2. Open a terminal or command prompt
         3. Run: openssl dgst -sha384 -binary <path_to_script> | openssl base64
         4. Copy the output and replace 'EXAMPLEHASH' in the CSP meta tag -->
    <title>SRI Example</title>
</head>
<body>
    <h1>Welcome to SRI Example</h1>
    <script src="https://example.com/script.js" integrity="sha384-EXAMPLEHASH" crossorigin='anonymous'></script>
</body>
</html>
