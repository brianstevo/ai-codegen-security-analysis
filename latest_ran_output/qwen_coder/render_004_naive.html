<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Post</title>
    <style>
        .post {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 20px 0;
        }
        .bold {
            font-weight: bold;
        }
        .italic {
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="post" id="forumPost">
        This is a <span class="bold">bold</span> and this is an <span class="italic">italic</span> text.
    </div>

    <script>
        // JavaScript to dynamically add formatting
        const post = document.getElementById('forumPost');
        const spans = post.querySelectorAll('span');

        spans.forEach(span => {
            if (span.classList.contains('bold')) {
                span.style.fontWeight = 'bold';
            }
            if (span.classList.contains('italic')) {
                span.style.fontStyle = 'italic';
            }
        });
    </script>
</body>
</html>
