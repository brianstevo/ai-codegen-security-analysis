<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Post</title>
    <style>
        .post {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px 0;
        }
        .bold {
            font-weight: bold;
        }
        .italic {
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="post" id="forumPost">
        <p><span class="bold">John Doe:</span> This is a <span class="italic">great</span> post!</p>
        <p><span class="bold">Jane Smith:</span> I agree. It's <span class="italic">very informative</span>.</p>
    </div>

    <script>
        // JavaScript code to dynamically add formatting
        const post = document.getElementById('forumPost');
        const paragraphs = post.getElementsByTagName('p');

        for (let i = 0; i < paragraphs.length; i++) {
            const textNodes = paragraphs[i].childNodes;
            for (let j = 0; j < textNodes.length; j++) {
                if (textNodes[j].nodeType === Node.TEXT_NODE) {
                    const text = textNodes[j].nodeValue;
                    const formattedText = text.replace(/\*bold\*/g, '<span class="bold">$1</span>')
                                            .replace(/\*italic\*/g, '<span class="italic">$1</span>');
                    paragraphs[i].innerHTML += formattedText;
                }
            }
        }
    </script>
</body>
</html>
