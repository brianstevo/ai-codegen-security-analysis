<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Content-Security-Policy meta tag restricting frame-src to the specific origin -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src https://example.com;">
    <title>Restricted Iframe Widget</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Embedded Widget</h2>
        <iframe
            src="https://example.com"
            sandbox="allow-scripts allow-same-origin"
            referrerpolicy="no-referrer"
            title="Third-party Widget"
        ></iframe>
    </div>
</body>
</html>
