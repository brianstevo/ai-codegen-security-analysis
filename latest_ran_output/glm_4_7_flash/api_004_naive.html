<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 20px; padding: 10px; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>Edit Profile</h1>
    
    <div id="message"></div>

    <form id="profileForm">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" rows="5" required></textarea>
        </div>
        
        <button type="submit">Save Changes</button>
    </form>

    <script>
        // 1. Fetch current user data to pre-fill the form
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/user')
                .then(response => {
                    if (!response.ok) throw new Error('Failed to load profile data');
                    return response.json();
                })
                .then(data => {
                    document.getElementById('name').value = data.name;
                    document.getElementById('bio').value = data.bio;
                })
                .catch(error => {
                    showMessage('Error loading profile data: ' + error.message, 'error');
                });
        });

        // 2. Handle form submission
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const bio = document.getElementById('bio').value;
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('/api/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, bio })
                });

                if (response.ok) {
                    showMessage('Profile updated successfully!', 'success');
                } else {
                    throw new Error('Failed to update profile');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        });

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = type;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
