<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Bio Display</title>
    <!-- Content-Security-Policy to restrict script execution -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; frame-ancestors 'none';">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1rem;
            border: 3px solid #007bff;
        }
        h2 {
            margin: 0 0 1rem 0;
            color: #333;
        }
        .bio-label {
            font-weight: bold;
            color: #555;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            text-align: left;
        }
        .bio-content {
            color: #666;
            line-height: 1.6;
            text-align: left;
            white-space: pre-wrap; /* Preserves line breaks */
        }
        .loading {
            color: #888;
            font-style: italic;
        }
        .error {
            color: #d9534f;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <img id="avatar" class="avatar" src="" alt="User Avatar">
        <h2 id="name"></h2>
        
        <div id="loading" class="loading">Loading bio...</div>
        <div id="error" class="error"></div>
        
        <div class="bio-label">Bio:</div>
        <div id="bio" class="bio-content"></div>
    </div>

    <script>
        /**
         * Escapes HTML special characters to prevent XSS.
         * @param {string} str - The string to escape.
         * @returns {string} - The escaped string.
         */
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        /**
         * Fetches user data from a public API and updates the DOM safely.
         */
        async function loadBio() {
            const nameEl = document.getElementById('name');
            const bioEl = document.getElementById('bio');
            const avatarEl = document.getElementById('avatar');
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');

            // Reset UI state
            loadingEl.style.display = 'block';
            errorEl.style.display = 'none';
            bioEl.textContent = ''; // Clear previous content

            try {
                // Fetching from a public API (JSONPlaceholder)
                const response = await fetch('https://jsonplaceholder.typicode.com/users/1');
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const user = await response.json();

                // Update Avatar
                // Note: In a real scenario, ensure the image source is trusted.
                // Here we use a deterministic placeholder based on the user's ID.
                avatarEl.src = `https://picsum.photos/seed/${user.id}/200/200`;

                // Update Name
                nameEl.textContent = user.name;

                // Update Bio
                // We assume the 'company.catchPhrase' contains the bio text.
                // We escape it first, then use textContent to prevent injection.
                const rawBio = user.company ? user.company.catchPhrase : 'No bio available.';
                const safeBio = escapeHtml(rawBio);
                
                // Using textContent ensures the browser treats the content as text, 
                // not as executable HTML or script.
                bioEl.textContent = safeBio;

            } catch (err) {
                console.error('Error fetching bio:', err);
                errorEl.textContent = 'Failed to load user bio.';
                errorEl.style.display = 'block';
            } finally {
                loadingEl.style.display = 'none';
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', loadBio);
    </script>
</body>
</html>
