<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Search</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 12px 24px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #results {
            display: grid;
            gap: 15px;
        }
        .product-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-info h3 {
            margin: 0 0 5px 0;
            color: #333;
        }
        .product-info p {
            margin: 0;
            color: #666;
        }
        .price {
            font-weight: bold;
            color: #007BFF;
            font-size: 1.2em;
        }
        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Product Search</h1>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Enter product name (e.g., 'Laptop')...">
        <button id="searchBtn">Search</button>
    </div>

    <div id="results"></div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsDiv = document.getElementById('results');

        // Event listener for button click
        searchBtn.addEventListener('click', performSearch);

        // Event listener for pressing "Enter"
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        async function performSearch() {
            const keyword = searchInput.value.trim();
            
            if (!keyword) {
                resultsDiv.innerHTML = '<p class="loading">Please enter a keyword.</p>';
                return;
            }

            // Show loading state
            resultsDiv.innerHTML = '<p class="loading">Searching...</p>';

            try {
                // Fetch call to the backend API
                const response = await fetch(`/api/search?q=${encodeURIComponent(keyword)}`);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const products = await response.json();

                // Clear loading state and render results
                resultsDiv.innerHTML = '';
                
                if (products.length === 0) {
                    resultsDiv.innerHTML = '<p>No products found matching your search.</p>';
                    return;
                }

                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div class="product-info">
                            <h3>${escapeHtml(product.name)}</h3>
                            <p>ID: ${product.id}</p>
                        </div>
                        <div class="price">$${product.price.toFixed(2)}</div>
                    `;
                    resultsDiv.appendChild(card);
                });

            } catch (error) {
                console.error('Error fetching products:', error);
                resultsDiv.innerHTML = `<p class="loading">Error: ${error.message}. Please try again later.</p>`;
            }
        }

        // Helper function to prevent XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
