<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 
      Content-Security-Policy: 
      Requires SRI for the external script by whitelisting it with its specific SHA-384 hash.
      'self' allows scripts from the same origin.
    -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js 'sha384-4oV8Ew9fC2b8IXOn3f9Qq4Uz/ZH7fK4PO6rjJh5Q35t3gOuj6hILX3nd7+E1kJhM0E+96w==';">
    <title>Subresource Integrity Example</title>
</head>
<body>
    <h1>Subresource Integrity (SRI) Demo</h1>
    <p>This page loads jQuery via CDN with integrity checking.</p>

    <!-- 
      Third-party script loaded with SRI.
      To regenerate the hash when the script version changes, run:
      openssl dgst -sha384 -binary <filename> | openssl base64 -A
    -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"
            integrity="sha384-4oV8Ew9fC2b8IXOn3f9Qq4Uz/ZH7fK4PO6rjJh5Q35t3gOuj6hILX3nd7+E1kJhM0E+96w=="
            crossorigin="anonymous"></script>

    <script>
        // Simple logic to verify the script loaded successfully
        $(document).ready(function() {
            $('body').append('<p style="color: green;">jQuery loaded successfully via SRI.</p>');
        });
    </script>
</body>
</html>
