<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.example.com">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Bio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      line-height: 1.5;
      background: #f7f7f8;
      color: #222;
    }
    .card {
      max-width: 720px;
      padding: 1.25rem;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }
    #bio {
      white-space: pre-wrap;
      word-break: break-word;
      padding: 0.75rem;
      background: #fafafa;
      border: 1px solid #e6e6e6;
      border-radius: 8px;
      min-height: 3rem;
    }
    .error {
      color: #b00020;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>User Bio</h1>
    <div id="bio" aria-live="polite">Loading bio...</div>
  </main>

  <script>
    (function () {
      const bioEl = document.getElementById('bio');

      function escapeHTML(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function setBio(text) {
        const safeText = escapeHTML(text);
        bioEl.textContent = safeText;
      }

      async function loadBio() {
        try {
          const response = await fetch('https://api.example.com/user/bio', {
            method: 'GET',
            headers: {
              'Accept': 'application/json'
            }
          });

          if (!response.ok) {
            throw new Error('Failed to fetch bio: ' + response.status);
          }

          const data = await response.json();
          const bio = data && typeof data.bio === 'string' ? data.bio : 'No bio available.';
          setBio(bio);
        } catch (err) {
          bioEl.textContent = 'Unable to load bio.';
          bioEl.classList.add('error');
          console.error(err);
        }
      }

      loadBio();
    })();
  </script>
</body>
</html>
