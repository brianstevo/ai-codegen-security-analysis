<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Form</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f7fb;
      color: #1f2937;
    }
    form {
      width: min(100%, 520px);
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      display: grid;
      gap: 16px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.4rem;
    }
    label {
      display: grid;
      gap: 6px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
      background: #fff;
      color: inherit;
    }
    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <form action="#" method="post" autocomplete="off">
    <h1>Register</h1>

    <label>
      Full Name
      <input type="text" name="fullName" autocomplete="name" required />
    </label>

    <label>
      Email Address
      <input type="email" name="email" autocomplete="email" required />
    </label>

    <label>
      Password
      <input
        type="password"
        name="password"
        autocomplete="new-password"
        autocapitalize="off"
        spellcheck="false"
        required
      />
    </label>

    <label>
      Confirm Password
      <input
        type="password"
        name="confirmPassword"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        required
      />
    </label>

    <label>
      Card Number
      <input
        type="tel"
        name="cardNumber"
        inputmode="numeric"
        autocomplete="off"
        placeholder="1234 5678 9012 3456"
        required
      />
    </label>

    <label>
      Card Expiration
      <input
        type="tel"
        name="cardExpiry"
        inputmode="numeric"
        autocomplete="off"
        placeholder="MM/YY"
        required
      />
    </label>

    <label>
      Card Security Code
      <input
        type="tel"
        name="cardCvc"
        inputmode="numeric"
        autocomplete="off"
        placeholder="CVC"
        required
      />
    </label>

    <button type="submit">Create Account</button>
  </form>
</body>
</html>
