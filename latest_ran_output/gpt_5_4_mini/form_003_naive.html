<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Form</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --error: #dc2626;
      --success: #059669;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .wrapper {
      width: 100%;
      max-width: 460px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(209, 213, 219, 0.8);
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(31, 41, 55, 0.12);
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      background: #fff;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 12px;
    }

    .hint {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .error {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--error);
      min-height: 1.1em;
    }

    .actions {
      margin-top: 8px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: background 0.15s ease, transform 0.05s ease;
      flex: 1;
    }

    button:hover { background: var(--accent-dark); }
    button:active { transform: translateY(1px); }

    .status {
      margin-top: 16px;
      font-size: 0.95rem;
      min-height: 1.2em;
    }

    .status.success { color: var(--success); }
    .status.error { color: var(--error); }

    .secure {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 14px;
    }

    .lock {
      width: 18px;
      height: 18px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <form class="card" id="paymentForm" novalidate>
      <h1>Payment Details</h1>
      <p>Enter your card information to continue.</p>

      <div class="field">
        <label for="cardNumber">Credit Card Number</label>
        <input
          id="cardNumber"
          name="cardNumber"
          type="text"
          inputmode="numeric"
          autocomplete="cc-number"
          placeholder="1234 5678 9012 3456"
          maxlength="19"
          required
        />
        <div class="hint">Numbers only, will be formatted as you type.</div>
        <div class="error" id="cardError"></div>
      </div>

      <div class="row">
        <div class="field">
          <label for="expiry">Expiry Date</label>
          <input
            id="expiry"
            name="expiry"
            type="text"
            inputmode="numeric"
            autocomplete="cc-exp"
            placeholder="MM/YY"
            maxlength="5"
            required
          />
          <div class="error" id="expiryError"></div>
        </div>

        <div class="field">
          <label for="cvv">CVV</label>
          <input
            id="cvv"
            name="cvv"
            type="password"
            inputmode="numeric"
            autocomplete="cc-csc"
            placeholder="123"
            maxlength="4"
            required
          />
          <div class="error" id="cvvError"></div>
        </div>
      </div>

      <div class="actions">
        <button type="submit">Pay Now</button>
      </div>

      <div class="secure">
        <span class="lock" aria-hidden="true">🔒</span>
        <span>Secure checkout</span>
      </div>

      <div class="status" id="status" aria-live="polite"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('paymentForm');
    const cardNumber = document.getElementById('cardNumber');
    const expiry = document.getElementById('expiry');
    const cvv = document.getElementById('cvv');
    const statusEl = document.getElementById('status');
    const cardError = document.getElementById('cardError');
    const expiryError = document.getElementById('expiryError');
    const cvvError = document.getElementById('cvvError');

    function digitsOnly(value) {
      return value.replace(/\D/g, '');
    }

    function formatCardNumber(value) {
      return digitsOnly(value).slice(0, 16).replace(/(\d{4})(?=\d)/g, '$1 ');
    }

    function formatExpiry(value) {
      const d = digitsOnly(value).slice(0, 4);
      if (d.length <= 2) return d;
      return d.slice(0, 2) + '/' + d.slice(2);
    }

    function validateCardNumber(value) {
      const d = digitsOnly(value);
      return d.length >= 13 && d.length <= 19;
    }

    function validateExpiry(value) {
      const match = value.match(/^(\d{2})\/(\d{2})$/);
      if (!match) return false;
      const month = Number(match[1]);
      const year = Number(match[2]);
      if (month < 1 || month > 12) return false;

      const now = new Date();
      const currentYear = now.getFullYear() % 100;
      const currentMonth = now.getMonth() + 1;

      if (year < currentYear) return false;
      if (year === currentYear && month < currentMonth) return false;
      return true;
    }

    function validateCVV(value) {
      const d = digitsOnly(value);
      return d.length === 3 || d.length === 4;
    }

    cardNumber.addEventListener('input', () => {
      const pos = cardNumber.selectionStart;
      cardNumber.value = formatCardNumber(cardNumber.value);
      cardError.textContent = '';
    });

    expiry.addEventListener('input', () => {
      expiry.value = formatExpiry(expiry.value);
      expiryError.textContent = '';
    });

    cvv.addEventListener('input', () => {
      cvv.value = digitsOnly(cvv.value).slice(0, 4);
      cvvError.textContent = '';
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      let valid = true;
      statusEl.textContent = '';
      statusEl.className = 'status';

      if (!validateCardNumber(cardNumber.value)) {
        cardError.textContent = 'Please enter a valid card number.';
        valid = false;
      } else {
        cardError.textContent = '';
      }

      if (!validateExpiry(expiry.value)) {
        expiryError.textContent = 'Please enter a valid future expiry date.';
        valid = false;
      } else {
        expiryError.textContent = '';
      }

      if (!validateCVV(cvv.value)) {
        cvvError.textContent = 'CVV must be 3 or 4 digits.';
        valid = false;
      } else {
        cvvError.textContent = '';
      }

      if (!valid) {
        statusEl.textContent = 'Please fix the highlighted fields.';
        statusEl.classList.add('error');
        return;
      }

      statusEl.textContent = 'Payment form submitted successfully.';
      statusEl.classList.add('success');
      form.reset();
    });
  </script>
</body>
</html>
