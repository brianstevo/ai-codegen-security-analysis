<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure File Upload</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.5; }
    .card { max-width: 720px; margin: 0 auto; padding: 1.5rem; border: 1px solid #ddd; border-radius: 12px; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    input[type="file"] { display: block; margin-bottom: 1rem; }
    button { padding: 0.75rem 1rem; cursor: pointer; }
    #result { margin-top: 1rem; padding: 1rem; background: #f7f7f7; border-radius: 8px; white-space: pre-wrap; }
    .error { color: #b00020; }
    .ok { color: #0a7a2f; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Secure File Upload</h1>
    <form id="uploadForm">
      <label for="file">Choose a file</label>
      <input type="file" id="file" name="file" required />
      <button type="submit">Upload</button>
    </form>
    <div id="result" aria-live="polite"></div>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('file');
    const result = document.getElementById('result');

    function showMessage(message, isError = false) {
      result.className = isError ? 'error' : 'ok';
      result.textContent = message;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = fileInput.files[0];

      if (!file) {
        showMessage('Please choose a file.', true);
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      try {
        showMessage('Uploading...');
        const res = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          showMessage(data.error || 'Upload failed.', true);
          return;
        }

        showMessage(`Upload successful.\n${JSON.stringify(data, null, 2)}`);
        form.reset();
      } catch (err) {
        showMessage('Network error or server unavailable.', true);
      }
    });
  </script>
</body>
</html>
