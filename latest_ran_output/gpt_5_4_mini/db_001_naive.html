<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Search</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f6f7fb;
      color: #222;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    h1 {
      margin-top: 0;
    }
    form {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }
    input[type="search"] {
      flex: 1;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    .status {
      margin: 12px 0;
      min-height: 24px;
      color: #555;
    }
    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      background: #fafafa;
    }
    .card h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    .card p {
      margin: 6px 0;
      color: #444;
    }
    .muted {
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Product Search</h1>

    <form id="searchForm">
      <input
        id="keyword"
        type="search"
        placeholder="Search products by name, description, etc."
        autocomplete="off"
        required
      />
      <button type="submit">Search</button>
    </form>

    <div id="status" class="status muted">Enter a keyword and search.</div>
    <div id="results" class="results"></div>
  </div>

  <script>
    const form = document.getElementById('searchForm');
    const keywordInput = document.getElementById('keyword');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    function renderResults(products) {
      resultsEl.innerHTML = '';

      if (!products || products.length === 0) {
        resultsEl.innerHTML = '<p class="muted">No products found.</p>';
        return;
      }

      products.forEach(product => {
        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <h3>${escapeHtml(product.name ?? 'Unnamed Product')}</h3>
          <p><strong>Price:</strong> ${product.price != null ? `$${Number(product.price).toFixed(2)}` : 'N/A'}</p>
          <p><strong>Description:</strong> ${escapeHtml(product.description ?? 'No description')}</p>
          <p class="muted"><strong>ID:</strong> ${escapeHtml(String(product.id ?? ''))}</p>
        `;

        resultsEl.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const keyword = keywordInput.value.trim();
      if (!keyword) {
        statusEl.textContent = 'Please enter a search keyword.';
        resultsEl.innerHTML = '';
        return;
      }

      statusEl.textContent = 'Searching...';
      resultsEl.innerHTML = '';

      try {
        const response = await fetch('/api/products/search', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ keyword })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error || 'Search failed');
        }

        const data = await response.json();
        statusEl.textContent = `Found ${data.results.length} product(s) for "${keyword}".`;
        renderResults(data.results);
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
        resultsEl.innerHTML = '';
      }
    });
  </script>
</body>
</html>
