<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Log Viewer Admin</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f7fb;
      color: #1f2937;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #dbe3ef;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.06);
    }
    h1 { margin-top: 0; font-size: 1.6rem; }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: end;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
    }
    select, button {
      font: inherit;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
    }
    button {
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }
    button:hover { background: #1d4ed8; }
    .status {
      margin: 12px 0;
      padding: 10px 12px;
      border-radius: 8px;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      min-height: 20px;
      white-space: pre-wrap;
    }
    pre {
      margin: 0;
      padding: 16px;
      background: #0b1020;
      color: #e5e7eb;
      border-radius: 10px;
      border: 1px solid #1f2937;
      overflow: auto;
      max-height: 70vh;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.92rem;
      line-height: 1.45;
    }
    .small {
      font-size: 0.9rem;
      color: #6b7280;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Secure Log File Viewer</h1>
    <p class="small">Administrator access required. Log contents are rendered using <code>textContent</code> to avoid HTML injection.</p>

    <div class="row">
      <div>
        <label for="logFile">Log file</label>
        <select id="logFile">
          <option value="app.log">app.log</option>
          <option value="error.log">error.log</option>
          <option value="audit.log">audit.log</option>
          <option value="access.log">access.log</option>
        </select>
      </div>

      <div>
        <button id="loadBtn" type="button">Load log</button>
      </div>
    </div>

    <div id="status" class="status" aria-live="polite">Ready.</div>
    <pre id="logOutput" aria-label="Log contents"></pre>
  </div>

  <script>
    const logFileEl = document.getElementById('logFile');
    const loadBtn = document.getElementById('loadBtn');
    const statusEl = document.getElementById('status');
    const logOutputEl = document.getElementById('logOutput');

    function setStatus(message) {
      statusEl.textContent = message;
    }

    async function loadLog() {
      const file = logFileEl.value;

      setStatus('Loading log...');
      logOutputEl.textContent = '';

      try {
        const response = await fetch(`/api/admin/logs?file=${encodeURIComponent(file)}`, {
          method: 'GET',
          credentials: 'include',
          headers: {
            'Accept': 'text/plain'
          }
        });

        const contentType = response.headers.get('content-type') || '';
        let payloadText = '';

        if (contentType.includes('application/json')) {
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || 'Failed to load log.');
          }
          payloadText = data.content || '';
        } else {
          payloadText = await response.text();
          if (!response.ok) {
            throw new Error(payloadText || 'Failed to load log.');
          }
        }

        logOutputEl.textContent = payloadText;
        setStatus(`Loaded ${file}.`);
      } catch (err) {
        setStatus(`Error: ${err.message}`);
        logOutputEl.textContent = '';
      }
    }

    loadBtn.addEventListener('click', loadLog);

    logFileEl.addEventListener('change', () => {
      setStatus(`Selected ${logFileEl.value}. Click "Load log" to view.`);
      logOutputEl.textContent = '';
    });
  </script>
</body>
</html>
