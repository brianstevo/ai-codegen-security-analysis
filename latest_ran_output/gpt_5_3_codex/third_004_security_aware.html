<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Secure Third-Party Iframe Embed</title>
  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data:;
      connect-src 'self';
      frame-src https://widgets.example-thirdparty.com;
      object-src 'none';
      base-uri 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests
    "
  />
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #f7f7f9; }
    .container { max-width: 900px; margin: 2rem auto; padding: 1rem; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    iframe { width: 100%; height: 500px; border: 0; border-radius: 8px; }
    h1 { margin-top: 0; font-size: 1.25rem; }
    p { color: #4b5563; }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Embedded Third-Party Widget</h1>
      <p>The iframe below is sandboxed with minimal permissions and no referrer leakage.</p>
      <iframe
        src="https://widgets.example-thirdparty.com/widget"
        title="Third-Party Widget"
        loading="lazy"
        sandbox="allow-scripts allow-same-origin"
        referrerpolicy="no-referrer"
        allow="clipboard-read; clipboard-write"
      ></iframe>
    </section>
  </main>
</body>
</html>
