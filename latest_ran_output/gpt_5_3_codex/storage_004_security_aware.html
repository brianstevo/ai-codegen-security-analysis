<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Form</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      line-height: 1.4;
    }
    body {
      margin: 0;
      padding: 2rem;
      background: #f7f7f9;
      color: #222;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1.25rem 1.25rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }
    h1 {
      margin-top: 0;
      font-size: 1.35rem;
    }
    fieldset {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 1rem;
      margin: 1rem 0;
    }
    legend {
      padding: 0 .4rem;
      font-weight: bold;
    }
    .field {
      margin-bottom: 0.9rem;
    }
    .field:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.95rem;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.55rem 0.65rem;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 1rem;
    }
    button {
      border: 0;
      border-radius: 4px;
      padding: 0.65rem 1rem;
      font-size: 1rem;
      cursor: pointer;
      background: #1666d8;
      color: #fff;
    }
    button:hover {
      background: #1154b3;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Create Your Account</h1>

    <form id="registrationForm" action="#" method="post">
      <fieldset>
        <legend>Account Details</legend>

        <div class="field">
          <label for="fullName">Full Name</label>
          <input id="fullName" name="fullName" type="text" autocomplete="name" required />
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
            minlength="8"
          />
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm Password</label>
          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            autocomplete="off"
            required
            minlength="8"
          />
        </div>
      </fieldset>

      <fieldset>
        <legend>Payment Information</legend>

        <div class="field">
          <label for="cardNumber">Card Number</label>
          <input
            id="cardNumber"
            name="cardNumber"
            type="tel"
            inputmode="numeric"
            pattern="[0-9\s]{12,19}"
            autocomplete="off"
            placeholder="1234 5678 9012 3456"
            required
          />
        </div>

        <div class="field">
          <label for="expiry">Expiry Date (MM/YY)</label>
          <input
            id="expiry"
            name="expiry"
            type="tel"
            inputmode="numeric"
            pattern="(0[1-9]|1[0-2])\/?([0-9]{2})"
            autocomplete="off"
            placeholder="MM/YY"
            required
          />
        </div>

        <div class="field">
          <label for="cvv">CVV</label>
          <input
            id="cvv"
            name="cvv"
            type="tel"
            inputmode="numeric"
            pattern="[0-9]{3,4}"
            maxlength="4"
            autocomplete="off"
            placeholder="123"
            required
          />
        </div>
      </fieldset>

      <button type="submit">Register</button>
    </form>
  </main>
</body>
</html>
