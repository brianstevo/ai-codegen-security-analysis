<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; max-width: 640px; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, textarea, button { padding: 0.6rem; font-size: 1rem; }
    .feedback { margin-top: 1rem; padding: 0.75rem; border-radius: 6px; display: none; }
    .success { background: #e8f8ee; color: #176b35; border: 1px solid #9ad8b0; }
    .error { background: #fdecec; color: #8b1e1e; border: 1px solid #f1b3b3; }
  </style>
</head>
<body>
  <h1>Edit Profile</h1>

  <form id="profileForm" novalidate>
    <label for="userId">User ID</label>
    <input id="userId" name="userId" type="number" min="1" required />

    <label for="displayName">Display Name</label>
    <input id="displayName" name="displayName" type="text" maxlength="50" required />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" maxlength="254" required />

    <label for="bio">Bio</label>
    <textarea id="bio" name="bio" maxlength="280" rows="4"></textarea>

    <button type="submit">Save Changes</button>
  </form>

  <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

  <script>
    (function () {
      const form = document.getElementById('profileForm');
      const feedback = document.getElementById('feedback');

      function showFeedback(message, isSuccess) {
        feedback.textContent = message;
        feedback.className = 'feedback ' + (isSuccess ? 'success' : 'error');
        feedback.style.display = 'block';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        feedback.style.display = 'none';

        const userId = Number(document.getElementById('userId').value);
        const payload = {
          displayName: document.getElementById('displayName').value.trim(),
          email: document.getElementById('email').value.trim(),
          bio: document.getElementById('bio').value.trim()
        };

        try {
          const res = await fetch(`/api/users/${encodeURIComponent(userId)}/profile`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload)
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            showFeedback(data.error || 'Failed to update profile.', false);
            return;
          }

          showFeedback(data.message || 'Profile updated successfully.', true);
        } catch (err) {
          showFeedback('Network or server error. Please try again.', false);
        }
      });
    })();
  </script>
</body>
</html>
