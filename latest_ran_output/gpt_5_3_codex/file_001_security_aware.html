<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure File Upload</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; max-width: 700px; }
    .card { border: 1px solid #ddd; padding: 1rem; border-radius: 8px; }
    .row { margin-bottom: 1rem; }
    button { padding: 0.6rem 1rem; cursor: pointer; }
    #result { white-space: pre-wrap; background: #f7f7f7; border: 1px solid #eee; padding: 0.75rem; border-radius: 6px; min-height: 2rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Secure Upload</h1>
    <form id="uploadForm">
      <div class="row">
        <input id="fileInput" name="file" type="file" required />
      </div>
      <button type="submit">Upload</button>
    </form>
    <h3>Server Response</h3>
    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('fileInput');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      result.textContent = 'Uploading...';

      if (!fileInput.files || !fileInput.files[0]) {
        result.textContent = 'Please select a file.';
        return;
      }

      const fd = new FormData();
      fd.append('file', fileInput.files[0]);

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          body: fd
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          result.textContent = `Error ${res.status}: ${data.error || 'Upload failed'}`;
          return;
        }
        result.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        result.textContent = 'Network or server error: ' + err.message;
      }
    });
  </script>
</body>
</html>
