<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Secure Payment Form (Stripe Elements)</title>

  <!-- Restrictive CSP: only allow scripts from this origin and Stripe -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://js.stripe.com;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self';
    connect-src 'self' https://api.stripe.com;
    frame-src https://js.stripe.com https://hooks.stripe.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    frame-ancestors 'none';
    upgrade-insecure-requests;
  " />

  <style>
    :root {
      --bg: #0b1220;
      --card: #121a2b;
      --text: #e7ecf5;
      --muted: #9aa7c2;
      --accent: #5b8cff;
      --danger: #ff5d7a;
      --ok: #35c98b;
      --border: #24304b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 700px at 30% -10%, #1a2540 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .panel {
      width: 100%;
      max-width: 460px;
      background: color-mix(in oklab, var(--card) 92%, black);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.25rem;
      font-weight: 700;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #d8e2f6;
      font-weight: 600;
    }
    #card-element {
      background: #0f1728;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      min-height: 44px;
    }
    #card-errors {
      min-height: 20px;
      margin-top: 8px;
      color: var(--danger);
      font-size: 0.88rem;
    }
    .row {
      margin-top: 14px;
    }
    button {
      margin-top: 14px;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.96rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(180deg, #6e99ff 0%, var(--accent) 100%);
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--ok);
      min-height: 20px;
    }
    .small {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <section class="panel">
    <h1>Checkout</h1>
    <p>Your card details are handled by Stripe Elements (PCI-compliant iframe).</p>

    <form id="payment-form" action="/process-payment-token" method="POST" novalidate>
      <label for="card-element">Card details</label>
      <div id="card-element" aria-label="Credit or debit card input"></div>
      <div id="card-errors" role="alert" aria-live="polite"></div>

      <!-- Token generated by Stripe.js gets injected here -->
      <input type="hidden" name="stripeToken" id="stripe-token" />

      <button id="submit-btn" type="submit">Pay</button>
      <div class="status" id="status"></div>
      <div class="small">Only a Stripe token is submitted to your backend — never raw PAN/CVC.</div>
    </form>
  </section>

  <script src="https://js.stripe.com/v3/"></script>
  <script>
    (function () {
      // Replace with your Stripe publishable key (safe for client-side use)
      const STRIPE_PUBLISHABLE_KEY = "pk_test_REPLACE_WITH_YOUR_PUBLISHABLE_KEY";

      const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
      const elements = stripe.elements();

      const card = elements.create("card", {
        hidePostalCode: false,
        style: {
          base: {
            color: "#e7ecf5",
            fontFamily: "system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif",
            fontSize: "16px",
            "::placeholder": { color: "#7e8aa8" },
            iconColor: "#9eb7ff"
          },
          invalid: {
            color: "#ff8da3",
            iconColor: "#ff8da3"
          }
        }
      });

      card.mount("#card-element");

      const form = document.getElementById("payment-form");
      const errorEl = document.getElementById("card-errors");
      const tokenEl = document.getElementById("stripe-token");
      const submitBtn = document.getElementById("submit-btn");
      const statusEl = document.getElementById("status");

      card.on("change", function (event) {
        errorEl.textContent = event.error ? event.error.message : "";
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        submitBtn.disabled = true;
        statusEl.textContent = "Securing payment details…";
        errorEl.textContent = "";

        try {
          const result = await stripe.createToken(card);

          if (result.error) {
            errorEl.textContent = result.error.message || "Unable to tokenize card details.";
            statusEl.textContent = "";
            submitBtn.disabled = false;
            return;
          }

          // Send ONLY the token to your backend
          tokenEl.value = result.token.id;
          statusEl.textContent = "Token created. Submitting securely…";
          form.submit();
        } catch (err) {
          errorEl.textContent = "Unexpected error. Please try again.";
          statusEl.textContent = "";
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
