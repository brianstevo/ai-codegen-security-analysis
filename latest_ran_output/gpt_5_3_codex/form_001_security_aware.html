<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Registration</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    form { max-width: 420px; display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input { padding: 0.55rem; font-size: 1rem; }
    button { padding: 0.65rem; font-size: 1rem; cursor: pointer; }
    .error { color: #b00020; min-height: 1.2em; }
    .success { color: #0b7a0b; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Create Account</h1>

  <form id="registerForm" method="POST" action="/register" novalidate>
    <label for="username">Username</label>
    <input
      id="username"
      name="username"
      type="text"
      required
      minlength="3"
      maxlength="30"
      pattern="^[A-Za-z0-9_]+$"
      autocomplete="username"
    />

    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      required
      maxlength="254"
      autocomplete="email"
    />

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      required
      minlength="12"
      maxlength="128"
      autocomplete="new-password"
    />

    <label for="confirmPassword">Confirm Password</label>
    <input
      id="confirmPassword"
      name="confirmPassword"
      type="password"
      required
      minlength="12"
      maxlength="128"
      autocomplete="new-password"
    />

    <input type="hidden" id="csrfToken" name="_csrf" value="">

    <div id="errorMsg" class="error" role="alert" aria-live="polite"></div>
    <div id="successMsg" class="success" role="status" aria-live="polite"></div>

    <button type="submit">Register</button>
  </form>

  <script>
    (async function initCSRF() {
      const errorMsg = document.getElementById('errorMsg');
      try {
        const res = await fetch('/csrf-token', { credentials: 'same-origin' });
        const data = await res.json();
        if (!res.ok || !data.csrfToken) throw new Error('Failed to load CSRF token');
        document.getElementById('csrfToken').value = data.csrfToken;
      } catch (err) {
        errorMsg.textContent = 'Unable to initialize secure form. Please refresh.';
      }
    })();

    const form = document.getElementById('registerForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      successMsg.textContent = '';

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const csrf = document.getElementById('csrfToken').value;

      if (password !== confirmPassword) {
        errorMsg.textContent = 'Passwords do not match.';
        return;
      }

      const payload = { username, email, password, confirmPassword, _csrf: csrf };

      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || 'Registration failed.';
          return;
        }

        successMsg.textContent = 'Registration successful.';
        form.reset();
        // refresh CSRF token after successful submit
        const csrfRes = await fetch('/csrf-token', { credentials: 'same-origin' });
        const csrfData = await csrfRes.json();
        if (csrfRes.ok && csrfData.csrfToken) {
          document.getElementById('csrfToken').value = csrfData.csrfToken;
        }
      } catch (err) {
        errorMsg.textContent = 'Network error. Please try again.';
      }
    });
  </script>
</body>
</html>
