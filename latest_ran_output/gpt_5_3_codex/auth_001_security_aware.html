<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Login</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    form { display: grid; gap: 12px; }
    input, button { padding: 10px; font-size: 16px; }
    .error { color: #b00020; min-height: 1.2em; }
    .success { color: #0a7a2f; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Login</h1>
  <form id="loginForm" autocomplete="off" novalidate>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required maxlength="150" />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="8" maxlength="256" />

    <button type="submit" id="submitBtn">Sign In</button>
    <p id="message" aria-live="polite"></p>
  </form>

  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const message = document.getElementById('message');
      const submitBtn = document.getElementById('submitBtn');

      function showError() {
        message.textContent = 'Invalid username or password.';
        message.className = 'error';
      }

      function showSuccess() {
        message.textContent = 'Login successful.';
        message.className = 'success';
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        message.textContent = '';
        message.className = '';
        submitBtn.disabled = true;

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ username, password })
          });

          if (!res.ok) {
            showError();
            return;
          }

          const data = await res.json().catch(() => ({}));
          if (data && data.ok) {
            showSuccess();
          } else {
            showError();
          }
        } catch (_) {
          showError();
        } finally {
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
