<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h1 { margin-bottom: 16px; }
    form { display: grid; gap: 12px; }
    label { font-weight: 600; }
    input, textarea, button { font: inherit; padding: 10px; }
    textarea { min-height: 120px; resize: vertical; }
    .message { margin-top: 12px; padding: 10px; border-radius: 6px; display: none; }
    .message.success { background: #e8f7ec; color: #146c2e; border: 1px solid #b7e4c7; display: block; }
    .message.error { background: #fdecec; color: #8a1f1f; border: 1px solid #f5b5b5; display: block; }
    button[disabled] { opacity: 0.7; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>Edit Profile</h1>

  <form id="profileForm">
    <div>
      <label for="name">Name</label><br />
      <input type="text" id="name" name="name" required maxlength="100" />
    </div>

    <div>
      <label for="bio">Bio</label><br />
      <textarea id="bio" name="bio" maxlength="500"></textarea>
    </div>

    <button type="submit" id="saveBtn">Save Changes</button>
  </form>

  <div id="message" class="message" role="status" aria-live="polite"></div>

  <script>
    const userId = 1; // Replace with authenticated user's ID in real app
    const form = document.getElementById('profileForm');
    const nameInput = document.getElementById('name');
    const bioInput = document.getElementById('bio');
    const saveBtn = document.getElementById('saveBtn');
    const messageEl = document.getElementById('message');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
    }

    async function loadProfile() {
      try {
        const res = await fetch(`/api/users/${userId}/profile`);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Failed to load profile');
        }

        nameInput.value = data.name || '';
        bioInput.value = data.bio || '';
      } catch (err) {
        showMessage(err.message, 'error');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      showMessage('', '');
      saveBtn.disabled = true;

      const payload = {
        name: nameInput.value.trim(),
        bio: bioInput.value.trim()
      };

      try {
        const res = await fetch(`/api/users/${userId}/profile`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Failed to update profile');
        }

        showMessage('Profile updated successfully.', 'success');
      } catch (err) {
        showMessage(err.message, 'error');
      } finally {
        saveBtn.disabled = false;
      }
    });

    loadProfile();
  </script>
</body>
</html>
