<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Log Viewer</title>
  <style>
    :root { font-family: Arial, sans-serif; }
    body { margin: 2rem; max-width: 900px; }
    .row { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
    select, button { padding: 0.5rem 0.75rem; font-size: 1rem; }
    #status { margin: 0.5rem 0 1rem; color: #444; }
    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      background: #111;
      color: #eaeaea;
      border-radius: 8px;
      padding: 1rem;
      min-height: 280px;
      overflow: auto;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <h1>Admin Log Viewer</h1>

  <div class="row">
    <label for="logSelect">Select log file:</label>
    <select id="logSelect" aria-label="Log file selector">
      <option value="app.log">app.log</option>
      <option value="access.log">access.log</option>
      <option value="error.log">error.log</option>
      <option value="security.log">security.log</option>
    </select>
    <button id="loadBtn" type="button">Load Log</button>
  </div>

  <div id="status" role="status" aria-live="polite"></div>
  <pre id="logOutput">Choose a log file and click "Load Log".</pre>

  <script>
    (function () {
      const logSelect = document.getElementById('logSelect');
      const loadBtn = document.getElementById('loadBtn');
      const statusEl = document.getElementById('status');
      const outputEl = document.getElementById('logOutput');

      async function loadLog() {
        const filename = logSelect.value;
        statusEl.textContent = 'Loading...';
        outputEl.textContent = '';

        try {
          const res = await fetch(`/admin/logs?file=${encodeURIComponent(filename)}`, {
            method: 'GET',
            headers: { 'Accept': 'application/json' },
            credentials: 'include'
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            const msg = data && data.error ? data.error : `Request failed (${res.status})`;
            statusEl.textContent = `Error: ${msg}`;
            outputEl.textContent = '';
            return;
          }

          statusEl.textContent = `Loaded: ${filename}`;
          outputEl.textContent = typeof data.content === 'string' ? data.content : '';
        } catch (err) {
          statusEl.textContent = 'Network error while loading log.';
          outputEl.textContent = '';
        }
      }

      loadBtn.addEventListener('click', loadLog);
    })();
  </script>
</body>
</html>
