<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile Bio</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --error: #b91c1c;
      --border: #e5e7eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --error: #f87171;
        --border: #1f2937;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: grid;
      place-items: center;
      color: white;
      font-weight: 700;
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.15rem;
      margin: 0;
      line-height: 1.25;
    }

    .username {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .bio {
      margin-top: 12px;
      line-height: 1.6;
      font-size: 1rem;
      white-space: pre-wrap;
    }

    .status {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .error {
      color: var(--error);
      margin-top: 8px;
      font-size: 0.95rem;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }

    button {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
    }

    button.primary {
      background: var(--accent);
      color: white;
      border-color: transparent;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="header">
      <div class="avatar" id="avatar">U</div>
      <div>
        <h1 id="name">Loading user...</h1>
        <p class="username" id="username">@username</p>
      </div>
    </div>

    <p class="bio" id="bio">Fetching bio from API...</p>
    <p class="status" id="status"></p>
    <p class="error" id="error" hidden></p>

    <div class="controls">
      <button class="primary" id="loadBtn">Load Profile</button>
      <button id="randomBtn">Load Random User</button>
    </div>
  </main>

  <script>
    const nameEl = document.getElementById('name');
    const usernameEl = document.getElementById('username');
    const bioEl = document.getElementById('bio');
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const avatarEl = document.getElementById('avatar');
    const loadBtn = document.getElementById('loadBtn');
    const randomBtn = document.getElementById('randomBtn');

    async function fetchUserProfile(userId = 1) {
      setLoading(true);
      clearError();
      statusEl.textContent = 'Loading profile...';

      try {
        const userRes = await fetch(`https://jsonplaceholder.typicode.com/users/${userId}`);
        if (!userRes.ok) throw new Error('Failed to fetch user data.');
        const user = await userRes.json();

        const postRes = await fetch(`https://jsonplaceholder.typicode.com/posts?userId=${userId}`);
        if (!postRes.ok) throw new Error('Failed to fetch bio data.');
        const posts = await postRes.json();

        const bioText = posts[0]?.body || 'No bio available for this user.';
        renderProfile(user, bioText);
        statusEl.textContent = `Loaded profile for user ID ${userId}.`;
      } catch (err) {
        showError(err.message || 'An unexpected error occurred.');
        statusEl.textContent = '';
      } finally {
        setLoading(false);
      }
    }

    function renderProfile(user, bio) {
      const displayName = user.name || 'Unknown User';
      const handle = user.username ? `@${user.username}` : '@unknown';
      nameEl.textContent = displayName;
      usernameEl.textContent = handle;
      bioEl.textContent = bio;
      avatarEl.textContent = getInitials(displayName);
    }

    function getInitials(name) {
      const parts = name.trim().split(/\s+/).slice(0, 2);
      return parts.map(p => p[0]?.toUpperCase() || '').join('') || 'U';
    }

    function showError(message) {
      errorEl.hidden = false;
      errorEl.textContent = message;
      bioEl.textContent = 'Could not load bio.';
      nameEl.textContent = 'Error loading user';
      usernameEl.textContent = '@unknown';
      avatarEl.textContent = '!';
    }

    function clearError() {
      errorEl.hidden = true;
      errorEl.textContent = '';
    }

    function setLoading(isLoading) {
      loadBtn.disabled = isLoading;
      randomBtn.disabled = isLoading;
    }

    loadBtn.addEventListener('click', () => fetchUserProfile(1));
    randomBtn.addEventListener('click', () => {
      const randomId = Math.floor(Math.random() * 10) + 1;
      fetchUserProfile(randomId);
    });

    fetchUserProfile(1);
  </script>
</body>
</html>
