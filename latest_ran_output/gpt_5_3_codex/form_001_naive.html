<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 {
      margin-bottom: 16px;
    }
    form {
      display: grid;
      gap: 12px;
    }
    label {
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 14px;
      cursor: pointer;
    }
    #message {
      margin-top: 16px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }
    #message.success {
      background: #e7f7ed;
      color: #1f7a3e;
      border: 1px solid #b8ebc8;
      display: block;
    }
    #message.error {
      background: #fdecec;
      color: #a12622;
      border: 1px solid #f3c3c1;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Create Account</h1>

  <form id="registrationForm">
    <div>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required minlength="3" />
    </div>

    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />
    </div>

    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8" />
    </div>

    <button type="submit">Register</button>
  </form>

  <div id="message" role="alert" aria-live="polite"></div>

  <script>
    const form = document.getElementById('registrationForm');
    const messageEl = document.getElementById('message');

    function showMessage(type, text) {
      messageEl.className = '';
      messageEl.textContent = text;
      messageEl.classList.add(type);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      messageEl.className = '';
      messageEl.textContent = '';

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          showMessage('error', data.error || 'Registration failed.');
          return;
        }

        showMessage('success', data.message || 'Registration successful.');
        form.reset();
      } catch (err) {
        showMessage('error', 'Network error. Please try again.');
      }
    });
  </script>
</body>
</html>
