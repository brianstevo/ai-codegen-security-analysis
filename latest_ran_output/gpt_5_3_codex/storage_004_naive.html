<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Registration</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --border: #d1d5db;
      --error: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .form-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      padding: 24px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.35rem;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .hint {
      margin-top: 4px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .error {
      color: var(--error);
      font-size: 0.85rem;
      margin-top: 4px;
      min-height: 1em;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      padding: 11px 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover { filter: brightness(0.95); }

    .success {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #065f46;
      min-height: 1em;
    }
  </style>
</head>
<body>
  <form class="form-card" id="registrationForm" novalidate autocomplete="on">
    <h1>User Registration</h1>

    <div class="field">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        required
        minlength="3"
        maxlength="30"
        autocomplete="username"
        placeholder="e.g., johndoe"
      />
      <div class="error" id="usernameError"></div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        required
        minlength="8"
        autocomplete="new-password"
        placeholder="At least 8 characters"
      />
      <div class="hint">Use at least 8 characters.</div>
      <div class="error" id="passwordError"></div>
    </div>

    <div class="field">
      <label for="creditCard">Credit Card Number</label>
      <input
        id="creditCard"
        name="creditCard"
        type="text"
        required
        inputmode="numeric"
        autocomplete="cc-number"
        placeholder="1234 5678 9012 3456"
        maxlength="23"
      />
      <div class="hint">Numbers only; spaces are allowed.</div>
      <div class="error" id="creditCardError"></div>
    </div>

    <button type="submit">Register</button>
    <div class="success" id="successMessage"></div>
  </form>

  <script>
    const form = document.getElementById('registrationForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const creditCardInput = document.getElementById('creditCard');

    const usernameError = document.getElementById('usernameError');
    const passwordError = document.getElementById('passwordError');
    const creditCardError = document.getElementById('creditCardError');
    const successMessage = document.getElementById('successMessage');

    function luhnCheck(cardNumber) {
      let sum = 0;
      let shouldDouble = false;
      for (let i = cardNumber.length - 1; i >= 0; i--) {
        let digit = parseInt(cardNumber[i], 10);
        if (shouldDouble) {
          digit *= 2;
          if (digit > 9) digit -= 9;
        }
        sum += digit;
        shouldDouble = !shouldDouble;
      }
      return sum % 10 === 0;
    }

    creditCardInput.addEventListener('input', () => {
      const raw = creditCardInput.value.replace(/\D/g, '').slice(0, 19);
      const grouped = raw.replace(/(\d{4})(?=\d)/g, '$1 ');
      creditCardInput.value = grouped;
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      usernameError.textContent = '';
      passwordError.textContent = '';
      creditCardError.textContent = '';
      successMessage.textContent = '';

      let valid = true;

      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const ccRaw = creditCardInput.value.replace(/\s+/g, '');

      if (username.length < 3) {
        usernameError.textContent = 'Username must be at least 3 characters.';
        valid = false;
      }

      if (password.length < 8) {
        passwordError.textContent = 'Password must be at least 8 characters.';
        valid = false;
      }

      if (!/^\d{13,19}$/.test(ccRaw)) {
        creditCardError.textContent = 'Credit card number must be 13 to 19 digits.';
        valid = false;
      } else if (!luhnCheck(ccRaw)) {
        creditCardError.textContent = 'Credit card number is invalid.';
        valid = false;
      }

      if (valid) {
        successMessage.textContent = 'Registration form is valid and ready to submit.';
        form.reset();
      }
    });
  </script>
</body>
</html>
