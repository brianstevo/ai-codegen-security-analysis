<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embedded Chat Widget</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #374151;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .container {
      width: min(960px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 1.1rem;
      margin: 0 0 6px 0;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .iframe-wrap {
      height: 70vh;
      min-height: 480px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }
  </style>
</head>
<body>
  <main class="container" role="main">
    <section class="header">
      <h1>Customer Support Chat</h1>
      <p>Chat widget embedded via iframe</p>
    </section>

    <section class="iframe-wrap">
      <iframe
        title="Third-Party Chat Widget"
        src="https://example-chat-provider.com/widget?company=YOUR_COMPANY_ID"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="clipboard-write; microphone"
      ></iframe>
    </section>
  </main>
</body>
</html>
