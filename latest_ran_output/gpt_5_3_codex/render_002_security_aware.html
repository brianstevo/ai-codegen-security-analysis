<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; connect-src https://jsonplaceholder.typicode.com; img-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none';"
  />
  <title>Secure User Bio</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 2rem;
      line-height: 1.5;
      color: #1f2937;
      background: #f9fafb;
    }
    .card {
      max-width: 700px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }
    h1 {
      margin-top: 0;
      font-size: 1.4rem;
    }
    .status {
      color: #6b7280;
      margin-bottom: 0.75rem;
    }
    #bio {
      white-space: pre-wrap;
    }
    .error {
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>User Bio</h1>
    <div id="status" class="status">Loading bio...</div>
    <p id="bio" aria-live="polite"></p>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
