<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SRI + CSP Example</title>

  <!-- Require SRI for external scripts -->
  <meta http-equiv="Content-Security-Policy" content="require-sri-for script;" />
</head>
<body>
  <h1>Subresource Integrity (SRI) Demo</h1>
  <p>Open the console to verify the third-party script loaded successfully.</p>

  <!--
    If you change the script URL/version below, you must regenerate the SRI hash.
    Example (OpenSSL):
      curl -sS https://code.jquery.com/jquery-3.7.1.min.js | openssl dgst -sha384 -binary | openssl base64 -A
    Then set integrity="sha384-<BASE64_HASH>"
  -->
  <script
    src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha384-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0="
    crossorigin="anonymous"></script>

  <script>
    if (window.jQuery) {
      console.log("jQuery loaded with SRI:", jQuery.fn.jquery);
    } else {
      console.error("jQuery failed to load.");
    }
  </script>
</body>
</html>
