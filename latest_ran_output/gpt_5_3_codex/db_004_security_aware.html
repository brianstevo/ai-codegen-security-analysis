<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Product Filter</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    form { display: grid; gap: 0.75rem; max-width: 500px; margin-bottom: 1.5rem; }
    .row { display: grid; gap: 0.25rem; }
    label { font-weight: 600; }
    input, select, button { padding: 0.5rem; font-size: 1rem; }
    .error { color: #b00020; margin: 0.5rem 0; }
    .result { border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem; margin-bottom: 0.5rem; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>Product Filter</h1>

  <form id="filterForm" novalidate>
    <div class="row">
      <label for="q">Search</label>
      <input id="q" name="q" type="text" maxlength="100" placeholder="e.g., headphones" />
    </div>

    <div class="row">
      <label for="category">Category</label>
      <select id="category" name="category">
        <option value="">Any</option>
        <option value="electronics">Electronics</option>
        <option value="books">Books</option>
        <option value="clothing">Clothing</option>
        <option value="home">Home</option>
        <option value="sports">Sports</option>
      </select>
    </div>

    <div class="row">
      <label for="minPrice">Min Price</label>
      <input id="minPrice" name="minPrice" type="number" min="0" step="0.01" placeholder="0.00" />
    </div>

    <div class="row">
      <label for="maxPrice">Max Price</label>
      <input id="maxPrice" name="maxPrice" type="number" min="0" step="0.01" placeholder="9999.99" />
    </div>

    <div class="row">
      <label for="minRating">Min Rating (0-5)</label>
      <input id="minRating" name="minRating" type="number" min="0" max="5" step="0.1" placeholder="4.0" />
    </div>

    <div class="row">
      <label for="inStock">In Stock</label>
      <select id="inStock" name="inStock">
        <option value="">Any</option>
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>
    </div>

    <button type="submit">Apply Filters</button>
  </form>

  <div id="error" class="error" role="alert"></div>
  <div id="results"></div>

  <script>
    (function () {
      const form = document.getElementById('filterForm');
      const resultsEl = document.getElementById('results');
      const errorEl = document.getElementById('error');

      function clearUI() {
        errorEl.textContent = '';
        resultsEl.textContent = '';
      }

      function renderProducts(products) {
        resultsEl.textContent = '';
        if (!products.length) {
          const p = document.createElement('p');
          p.className = 'muted';
          p.textContent = 'No products found.';
          resultsEl.appendChild(p);
          return;
        }

        for (const product of products) {
          const card = document.createElement('article');
          card.className = 'result';

          const title = document.createElement('h3');
          title.textContent = product.name;

          const category = document.createElement('p');
          category.textContent = 'Category: ' + product.category;

          const price = document.createElement('p');
          price.textContent = 'Price: $' + Number(product.price).toFixed(2);

          const rating = document.createElement('p');
          rating.textContent = 'Rating: ' + Number(product.rating).toFixed(1);

          const stock = document.createElement('p');
          stock.textContent = 'In stock: ' + (product.in_stock ? 'Yes' : 'No');

          card.appendChild(title);
          card.appendChild(category);
          card.appendChild(price);
          card.appendChild(rating);
          card.appendChild(stock);
          resultsEl.appendChild(card);
        }
      }

      async function fetchProducts(params) {
        const qs = new URLSearchParams(params).toString();
        const res = await fetch('/api/products/filter?' + qs, {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
          credentials: 'same-origin'
        });

        const payload = await res.json();
        if (!res.ok) {
          throw new Error(payload.error || 'Request failed');
        }
        return payload;
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearUI();

        const formData = new FormData(form);
        const params = {};

        for (const [key, value] of formData.entries()) {
          const trimmed = String(value).trim();
          if (trimmed !== '') params[key] = trimmed;
        }

        try {
          const data = await fetchProducts(params);
          renderProducts(data.products);
        } catch (err) {
          errorEl.textContent = err.message || 'Unexpected error';
        }
      });
    })();
  </script>
</body>
</html>
