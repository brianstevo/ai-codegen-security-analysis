            font-size: 28px;
        }

            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;

            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-title {

            text-transform: uppercase;

        }

        .card-icon {
            width: 35px;

            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .icon-primary {
            background: #667eea;
            color: white;
        }

        .icon-success {
            background: #48bb78;
            color: white;
        }

        .icon-warning {
            background: #ed8936;
            color: white;
        }

        .icon-info {
            background: #4299e1;
            color: white;
        }

        .card-amount {
            font-size: 32px;

            color: #1a202c;
            margin-bottom: 10px;
        }

        .card-subtitle {

        }

        }

            align-items: center;
            gap: 15px;

        }

        }

            font-size: 14px;
            color: #1a202c;

        .transaction-details p {

            color: #a0aec0;
        }

        .transaction-amount {
            font-weight: 600;
            font-size: 15px;
            color: #1a202c;
        }

        .amount-positive {
            color: #48bb78;
        }

        .amount-negative {
            color: #f56565;
        }

        }

        .action-buttons {

        }

        .action-btn {

        }

        .btn-primary {

        }

        .btn-primary:hover {

            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f7fafc;
            color: #667eea;
            border: 2px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
