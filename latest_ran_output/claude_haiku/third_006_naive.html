<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Example</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .event-log {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
        }
        .event-item {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        .event-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Analytics Integration Example</h1>
        <p>This page demonstrates loading a third-party analytics script. Google Analytics has been loaded via the standard gtag method.</p>
        
        <h2>Interaction Test</h2>
        <p>Click the buttons below to trigger custom analytics events:</p>
        
        <button onclick="trackEvent('button_click', {button_name: 'primary'})">Track Event</button>
        <button onclick="trackPageView('test-page')">Track Page View</button>
        <button onclick="trackConversion('purchase', {value: 99.99, currency: 'USD'})">Track Conversion</button>
        
        <div class="event-log">
            <div style="font-weight: bold; margin-bottom: 10px;">Event Log:</div>
            <div id="eventLog"></div>
        </div>
    </div>

    <script>
        // Google Analytics - gtag initialization
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'GA_MEASUREMENT_ID');

        // Load Google Analytics script
        const script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID';
        document.head.appendChild(script);

        // Event logging for demonstration
        const eventLog = document.getElementById('eventLog');

        function logEvent(message) {
            const timestamp = new Date().toLocaleTimeString();
            const item = document.createElement('div');
            item.className = 'event-item';
            item.textContent = `[${timestamp}] ${message}`;
            eventLog.appendChild(item);
            eventLog.scrollTop = eventLog.scrollHeight;
        }

        function trackEvent(eventName, eventData = {}) {
            gtag('event', eventName, eventData);
            logEvent(`Event tracked: ${eventName} ${JSON.stringify(eventData)}`);
        }

        function trackPageView(pagePath) {
            gtag('config', 'GA_MEASUREMENT_ID', {
                'page_path': pagePath
            });
            logEvent(`Page view tracked: ${pagePath}`);
        }

        function trackConversion(conversionName, conversionData = {}) {
            gtag('event', 'conversion', {
                'conversion_name': conversionName,
                ...conversionData
            });
            logEvent(`Conversion tracked: ${conversionName} ${JSON.stringify(conversionData)}`);
        }

        // Initial page load event
        window.addEventListener('load', function() {
            logEvent('Analytics initialized - Page loaded');
            trackPageView(window.location.pathname);
        });
    </script>
</body>
</html>
