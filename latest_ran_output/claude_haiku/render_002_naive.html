            background: white;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            text-align: center;
            overflow: hidden;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 18px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background-color: #fee;
            border: 1px solid #fcc;
            border-radius: 6px;
            color: #c33;
            padding: 15px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 4px solid #667eea;
            object-fit: cover;
            background: #f0f0f0;
        }

        .name {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .username {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .bio {
            color: #555;

            margin-bottom: 20px;
            padding: 15px;

            border-left: 4px solid #667eea;
            border-radius: 4px;
            text-align: left;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .info-item {
            background: #f9f9f9;
            padding: 15px;

        .info-label {

</head>

            profileCard.innerHTML = profileHTML;
