<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Log File Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        select, button {
            font-size: 14px;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        
        select {
            width: 100%;
            color: #333;
            background-color: white;
            cursor: pointer;
        }
        
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            padding: 12px 30px;
            width: 100%;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .log-display {
            margin-top: 40px;
            display: none;
        }
        
        .log-display.active {
            display: block;
        }
        
        .log-header {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        
        .log-filename {
            color: #667eea;
            font-weight: 600;
            font-size: 14px;
        }
        
        #logContent {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            max-height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid #333;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            border-left: 4px solid #c33;
            display: none;
        }
        
        .error.active {
            display: block;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }
        
        .loading.active {
            display: block;
        }
        
        .loading::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Secure Log File Viewer</h1>
        
        <div class="form-group">
            <label for="logSelector">Select Log File</label>
            <select id="logSelector">
                <option value="">-- Choose a log file --</option>
                <option value="application.log">application.log</option>
                <option value="error.log">error.log</option>
                <option value="access.log">access.log</option>
                <option value="security.log">security.log</option>
            </select>
        </div>
        
        <button id="viewBtn">View Log File</button>
        
        <div class="loading" id="loading"></div>
        
        <div class="error" id="error"></div>
        
        <div class="log-display" id="logDisplay">
            <div class="log-header">
                <div class="log-filename" id="logFilename"></div>
            </div>
            <div id="logContent"></div>
        </div>
    </div>

    <script>
        const logSelector = document.getElementById('logSelector');
        const viewBtn = document.getElementById('viewBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const logDisplay = document.getElementById('logDisplay');
        const logFilename = document.getElementById('logFilename');
        const logContent = document.getElementById('logContent');

        viewBtn.addEventListener('click', async () => {
            const selectedLog = logSelector.value;
            
            if (!selectedLog) {
                showError('Please select a log file');
                return;
            }

            loading.classList.add('active');
            error.classList.remove('active');
            logDisplay.classList.remove('active');

            try {
                const response = await fetch(`/api/logs/${encodeURIComponent(selectedLog)}`);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `HTTP Error: ${response.status}`);
                }

                const data = await response.json();
                
                logFilename.textContent = `File: ${selectedLog}`;
                logContent.textContent = data.content;
                logDisplay.classList.add('active');
                error.classList.remove('active');
            } catch (err) {
                showError(err.message || 'Failed to load log file');
                logDisplay.classList.remove('active');
            } finally {
                loading.classList.remove('active');
            }
        });

        function showError(message) {
            error.textContent = '⚠️ ' + message;
            error.classList.add('active');
        }

        logSelector.addEventListener('change', () => {
            error.classList.remove('active');
        });
    </script>
</body>
</html>
