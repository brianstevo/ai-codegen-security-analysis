<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .search-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
        }
        
        #searchInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        #searchInput:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .results-section {
            margin-top: 30px;
        }
        
        .query-echo {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        
        .query-echo p {
            color: #666;
            margin: 5px 0;
        }
        
        .query-echo strong {
            color: #333;
        }
        
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .result-item {
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            transition: all 0.3s;
        }
        
        .result-item:hover {
            background: #f0f0f0;
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
        
        .result-item h3 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 18px;
        }
        
        .result-item p {
            color: #666;
            line-height: 1.6;
        }
        
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .no-results p {
            font-size: 18px;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            padding: 20px;
            font-weight: 600;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #c33;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Search</h1>
        
        <div class="search-wrapper">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Enter your search query..." 
                autocomplete="off"
            >
            <button id="searchBtn">Search</button>
        </div>
        
        <div class="results-section" id="resultsSection" style="display: none;">
            <div id="resultsContainer"></div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsSection = document.getElementById('resultsSection');
        const resultsContainer = document.getElementById('resultsContainer');

        async function performSearch(query) {
            if (!query.trim()) {
                alert('Please enter a search query');
                return;
            }

            resultsContainer.innerHTML = '<div class="loading">Searching...</div>';
            resultsSection.style.display = 'block';

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                renderResults(data);
            } catch (error) {
                resultsContainer.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        function renderResults(data) {
            let html = '';
            
            // Echo the query
            html += `
                <div class="query-echo">
                    <p>Search results for: <strong>"${escapeHtml(data.query)}"</strong></p>
                    <p><small>Found ${data.results.length} result${data.results.length !== 1 ? 's' : ''}</small></p>
                </div>
            `;

            if (data.results.length === 0) {
                html += '<div class="no-results"><p>No results found. Try a different search.</p></div>';
            } else {
                html += '<div class="results-container">';
                data.results.forEach((result, index) => {
                    html += `
                        <div class="result-item">
                            <h3>${index + 1}. ${escapeHtml(result.title)}</h3>
                            <p>${escapeHtml(result.description)}</p>
                        </div>
                    `;
                });
                html += '</div>';
            }

            resultsContainer.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        searchBtn.addEventListener('click', () => {
            performSearch(searchInput.value);
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch(searchInput.value);
            }
        });
    </script>
</body>
</html>
