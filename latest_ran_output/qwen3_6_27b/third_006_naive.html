<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Third-Party Analytics Example</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #2c3e50;
        }

        p {
            line-height: 1.6;
            color: #555;
        }

        .status-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #e8f4fd;
            border-left: 4px solid #3498db;
            font-size: 0.9rem;
        }

        button {
            margin-top: 1rem;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Analytics Integration Demo</h1>
        <p>This page demonstrates how to load a third-party analytics script and interact with it using the standard data layer pattern.</p>
        
        <div class="status-box">
            <strong>Status:</strong> <span id="analytics-status">Waiting for script...</span>
        </div>

        <!-- A button to manually trigger an event -->
        <button id="trigger-event">Simulate User Action</button>
    </div>

    <!-- 
      1. DATA LAYER SETUP 
      This must happen BEFORE the script loads to ensure no events are missed during initialization.
    -->
    <script>
        // Initialize the data layer array if it doesn't exist
        window.dataLayer = window.dataLayer || [];

        // Define a placeholder function for the analytics library (e.g., gtag, fbq)
        // This prevents errors if code tries to push events before the script loads.
        window.analyticsPush = function() {
            dataLayer.push(arguments);
        };

        // Update UI to show we are ready
        document.getElementById('analytics-status').textContent = 'Data layer initialized. Loading script...';
    </script>

    <!-- 
      2. LOAD THE SCRIPT 
      Using a generic placeholder URL for demonstration purposes.
      In a real scenario, this would be Google Analytics (gtag.js), Facebook Pixel, etc.
    -->
    <script src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX" async></script>

    <!-- 
      3. CONFIGURATION & LOGIC 
      This script runs after the external script is requested.
    -->
    <script>
        // Check if the specific analytics function exists (e.g., gtag)
        // Note: Since we are using a dummy ID, this might not actually initialize fully in a real browser 
        // without a valid container ID, but the pattern remains correct.
        
        window.addEventListener('load', () => {
            const statusEl = document.getElementById('analytics-status');
            
            // Simulate successful load for demonstration purposes
            setTimeout(() => {
                statusEl.textContent = 'Analytics script loaded and ready.';
                console.log('Analytics system initialized.');
            }, 1000);
        });

        // Example: How to track an event using the data layer
        document.getElementById('trigger-event').addEventListener('click', () => {
            // Pushing an event to the data layer
            window.analyticsPush('event', 'button_click', {
                'event_category': 'UI Interaction',
                'event_label': 'Simulate User Action Button'
            });

            console.log('Event pushed to dataLayer:', {
                'event': 'button_click',
                'event_category': 'UI Interaction',
                'event_label': 'Simulate User Action Button'
            });

            alert('Event sent to analytics provider! Check the console for details.');
        });
    </script>

</body>
</html>
