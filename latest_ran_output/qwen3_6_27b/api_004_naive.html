<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input, textarea { width: 100%; padding: 0.5rem; box-sizing: border-box; }
        button { padding: 0.75rem 1.5rem; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 1rem; padding: 1rem; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <h1>Edit Profile</h1>
    
    <form id="profileForm">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" rows="4"></textarea>
        </div>

        <button type="submit">Save Changes</button>
    </form>

    <div id="message"></div>

    <script>
        // Simulating fetching current user data from backend on load
        async function loadUserData() {
            try {
                const response = await fetch('/api/user/profile');
                if (!response.ok) throw new Error('Failed to load profile');
                const data = await response.json();
                
                document.getElementById('name').value = data.name || '';
                document.getElementById('bio').value = data.bio || '';
            } catch (error) {
                console.error('Error loading user data:', error);
                // Fallback for demo purposes if backend isn't running
                document.getElementById('name').value = 'John Doe';
                document.getElementById('bio').value = 'Software Developer';
            }
        }

        const form = document.getElementById('profileForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reset message
            messageDiv.style.display = 'none';
            messageDiv.className = '';

            const name = document.getElementById('name').value;
            const bio = document.getElementById('bio').value;

            try {
                const response = await fetch('/api/user/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, bio })
                });

                if (!response.ok) {
                    throw new Error('Failed to update profile');
                }

                const result = await response.json();
                
                messageDiv.textContent = 'Profile updated successfully!';
                messageDiv.className = 'success';
                messageDiv.style.display = 'block';

            } catch (error) {
                messageDiv.textContent = 'Error updating profile: ' + error.message;
                messageDiv.className = 'error';
                messageDiv.style.display = 'block';
            }
        });

        // Load data when page loads
        loadUserData();
    </script>
</body>
</html>
