<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .search-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        #searchInput {
            flex: 1;
            padding: 0.5rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #searchBtn {
            padding: 0.5rem 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #searchBtn:hover {
            background-color: #0056b3;
        }
        .product-card {
            border: 1px solid #ddd;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .product-name {
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }
        .product-price {
            color: #28a745;
            font-weight: bold;
        }
        .no-results {
            color: #666;
            text-align: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <h1>Product Search</h1>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Enter product name...">
        <button id="searchBtn">Search</button>
    </div>
    <div id="resultsContainer"></div>

    <script>
        document.getElementById('searchBtn').addEventListener('click', performSearch);
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        async function performSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            const resultsContainer = document.getElementById('resultsContainer');
            
            if (!keyword) {
                resultsContainer.innerHTML = '<p class="no-results">Please enter a search term.</p>';
                return;
            }

            resultsContainer.innerHTML = '<p>Searching...</p>';

            try {
                const response = await fetch(`/api/products/search?keyword=${encodeURIComponent(keyword)}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const products = await response.json();
                displayResults(products);
            } catch (error) {
                console.error('Search failed:', error);
                resultsContainer.innerHTML = `<p class="no-results">Error searching products. Please try again later.</p>`;
            }
        }

        function displayResults(products) {
            const resultsContainer = document.getElementById('resultsContainer');
            
            if (products.length === 0) {
                resultsContainer.innerHTML = '<p class="no-results">No products found matching your search.</p>';
                return;
            }

            let html = '';
            products.forEach(product => {
                html += `
                    <div class="product-card">
                        <div class="product-name">${escapeHtml(product.name)}</div>
                        <div class="product-price">$${parseFloat(product.price).toFixed(2)}</div>
                        <div>${escapeHtml(product.description || 'No description available')}</div>
                    </div>
                `;
            });
            
            resultsContainer.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
