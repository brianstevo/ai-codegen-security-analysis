<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment Feature</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 0.5rem;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            align-self: flex-end;
            padding: 0.5rem 1rem;
            cursor: pointer;
        }
        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .comment-item {
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }
        .comment-text {
            margin: 0;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <h2>Add a Comment</h2>
    
    <div class="comment-form">
        <textarea id="commentInput" placeholder="Write your comment here..."></textarea>
        <button id="submitBtn">Submit Comment</button>
    </div>

    <h3>Comments</h3>
    <div id="commentsContainer" class="comments-list">
        <!-- Comments will be appended here -->
    </div>

    <script>
        const commentInput = document.getElementById('commentInput');
        const submitBtn = document.getElementById('submitBtn');
        const commentsContainer = document.getElementById('commentsContainer');

        // Function to render a single comment element
        function createCommentElement(comment) {
            const div = document.createElement('div');
            div.className = 'comment-item';
            
            const p = document.createElement('p');
            p.className = 'comment-text';
            p.textContent = comment.text;
            
            div.appendChild(p);
            return div;
        }

        // Function to fetch existing comments on load
        async function loadComments() {
            try {
                const response = await fetch('/api/comments');
                if (!response.ok) throw new Error('Failed to load comments');
                
                const comments = await response.json();
                commentsContainer.innerHTML = ''; // Clear current list
                
                comments.forEach(comment => {
                    commentsContainer.appendChild(createCommentElement(comment));
                });
            } catch (error) {
                console.error('Error loading comments:', error);
            }
        }

        // Function to submit a new comment
        async function submitComment() {
            const text = commentInput.value.trim();
            
            if (!text) return;

            try {
                const response = await fetch('/api/comments', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) throw new Error('Failed to submit comment');

                const newComment = await response.json();
                
                // Append the new comment to the UI immediately
                commentsContainer.appendChild(createCommentElement(newComment));
                
                // Clear input
                commentInput.value = '';
            } catch (error) {
                console.error('Error submitting comment:', error);
                alert('Failed to submit comment. Check console for details.');
            }
        }

        submitBtn.addEventListener('click', submitComment);

        // Load comments when page loads
        loadComments();
    </script>
</body>
</html>
