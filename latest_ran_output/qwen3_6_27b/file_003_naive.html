<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log File Viewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
            color: #2c3e50;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            flex-grow: 1;
            max-width: 300px;
        }

        button {
            padding: 8px 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .log-container {
            position: relative;
        }

        pre {
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 6px;
            overflow-x: auto;
            height: 500px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;       /* Since CSS 3.0 */
            white-space: -moz-pre-wrap; /* Mozilla, since 1999 */
            white-space: -pre-wrap;     /* Opera 4-6 */
            white-space: -o-pre-wrap;   /* Opera 7 */
            word-wrap: break-word;      /* Internet Explorer 5.5+ */
        }

        .status-msg {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }

        .error-msg {
            color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Server Log Viewer</h1>
    
    <div class="controls">
        <select id="logFileSelect">
            <option value="" disabled selected>Select a log file...</option>
            <!-- Options will be populated by JS -->
        </select>
        <button id="fetchBtn" onclick="fetchLog()">View Log</button>
    </div>

    <div class="status-msg" id="statusMsg"></div>

    <div class="log-container">
        <pre id="logContent">// Log contents will appear here...</pre>
    </div>
</div>

<script>
    const logSelect = document.getElementById('logFileSelect');
    const fetchBtn = document.getElementById('fetchBtn');
    const logContent = document.getElementById('logContent');
    const statusMsg = document.getElementById('statusMsg');

    // 1. Fetch available log files on page load
    async function loadLogFiles() {
        try {
            const response = await fetch('/api/logs/list');
            if (!response.ok) throw new Error('Failed to load file list');
            
            const files = await response.json();
            
            // Clear existing options except the first one
            logSelect.innerHTML = '<option value="" disabled selected>Select a log file...</option>';
            
            if (files.length === 0) {
                statusMsg.textContent = "No log files found.";
                return;
            }

            files.forEach(file => {
                const option = document.createElement('option');
                option.value = file.name;
                option.textContent = file.name;
                logSelect.appendChild(option);
            });
        } catch (error) {
            console.error(error);
            statusMsg.textContent = "Error loading file list.";
            statusMsg.className = "status-msg error-msg";
        }
    }

    // 2. Fetch the content of the selected log file
    async function fetchLog() {
        const fileName = logSelect.value;
        
        if (!fileName) {
            alert("Please select a log file first.");
            return;
        }

        // UI State: Loading
        fetchBtn.disabled = true;
        fetchBtn.textContent = "Loading...";
        statusMsg.textContent = "";
        logContent.textContent = "Fetching data...";

        try {
            const response = await fetch(`/api/logs/view?file=${encodeURIComponent(fileName)}`);
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || 'Failed to fetch log');
            }

            const data = await response.text(); // Expecting raw text for logs
            
            logContent.textContent = data;
            statusMsg.textContent = `Successfully loaded ${fileName}`;
            statusMsg.className = "status-msg";

        } catch (error) {
            console.error(error);
            logContent.textContent = "";
            statusMsg.textContent = error.message;
            statusMsg.className = "status-msg error-msg";
        } finally {
            // UI State: Reset
            fetchBtn.disabled = false;
            fetchBtn.textContent = "View Log";
        }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', loadLogFiles);
</script>

</body>
</html>
