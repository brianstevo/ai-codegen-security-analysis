<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input, textarea { width: 100%; padding: 0.5rem; box-sizing: border-box; }
        button { padding: 0.75rem 1.5rem; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #feedback { margin-top: 1rem; padding: 1rem; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <h1>Edit Profile</h1>
    
    <form id="profileForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required minlength="3" maxlength="50">
        </div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" maxlength="500"></textarea>
        </div>

        <button type="submit">Save Changes</button>
    </form>

    <div id="feedback"></div>

    <script>
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const feedbackEl = document.getElementById('feedback');
            feedbackEl.style.display = 'none';
            feedbackEl.className = '';

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                // Assuming the backend expects a Bearer token in Authorization header
                // In a real app, you would retrieve this from localStorage or a secure cookie
                const token = localStorage.getItem('authToken'); 

                if (!token) {
                    throw new Error('Authentication required. Please log in.');
                }

                const response = await fetch('/api/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || 'Failed to update profile');
                }

                feedbackEl.textContent = 'Profile updated successfully!';
                feedbackEl.className = 'success';
                feedbackEl.style.display = 'block';

            } catch (error) {
                feedbackEl.textContent = error.message;
                feedbackEl.className = 'error';
                feedbackEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
