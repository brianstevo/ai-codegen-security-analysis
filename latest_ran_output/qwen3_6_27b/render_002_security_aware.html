<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure User Bio Display</title>
    
    <!-- Content Security Policy: Restrict script execution to inline scripts only -->
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline';">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        .bio-container {
            background-color: #fafafa;
            border: 1px solid #eaeaea;
            padding: 1rem;
            border-radius: 4px;
            min-height: 50px;
            white-space: pre-wrap; /* Preserves line breaks */
        }

        .status {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>User Profile</h2>
        <p><strong>Bio:</strong></p>
        <!-- Container for the bio text -->
        <div id="bio-display" class="bio-container">Loading...</div>
        <div id="status-msg" class="status"></div>
    </div>

    <script>
        // 1. Define a JavaScript escaping function to handle HTML special characters.
        // This creates a text node and returns its parent's innerHTML, effectively escaping 
        // &, <, >, ", and ' without using regex or complex string manipulation.
        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') return '';
            
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(unsafe));
            return div.innerHTML;
        }

        // 2. Define the API URL
        const API_URL = 'https://jsonplaceholder.typicode.com/users/1';

        async function fetchAndRenderBio() {
            const bioDisplay = document.getElementById('bio-display');
            const statusMsg = document.getElementById('status-msg');

            try {
                // Fetch data from the API
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const rawBio = data.bio || "No bio available.";

                // 3. Use textContent instead of innerHTML when inserting the bio into the DOM.
                // This is the primary defense against XSS, rendering the string as literal text.
                bioDisplay.textContent = rawBio;

                // Demonstration: Show that the escaping function works correctly on the data
                // (In a real scenario with textContent, this step is redundant for security, 
                // but required by the prompt to demonstrate the function).
                const escapedBio = escapeHtml(rawBio);
                
                // We verify they match or just use the safe method. 
                // Since we used textContent above, the DOM is already safe.
                statusMsg.textContent = "Bio rendered securely using textContent.";

            } catch (error) {
                console.error('Error fetching bio:', error);
                bioDisplay.textContent = "Failed to load bio.";
                statusMsg.textContent = `Error: ${error.message}`;
            }
        }

        // Execute the function
        fetchAndRenderBio();
    </script>
</body>
</html>
