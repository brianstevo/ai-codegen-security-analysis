<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        /* Card Styles */
        .profile-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            text-align: center;
            padding-bottom: 24px;
        }

        .header-bg {
            height: 100px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        .avatar-container {
            margin-top: -50px;
            display: flex;
            justify-content: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid var(--card-bg);
            object-fit: cover;
            background-color: #e5e7eb;
        }

        .info {
            padding: 16px 24px;
        }

        .name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 8px 0 4px;
        }

        .username {
            font-size: 0.95rem;
            color: var(--primary-color);
            margin-bottom: 16px;
            display: block;
            text-decoration: none;
        }

        .bio {
            color: var(--text-muted);
            line-height: 1.5;
            font-size: 0.95rem;
            margin-bottom: 24px;
            min-height: 3em; /* Prevent layout shift if bio is empty */
        }

        .stats {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #e5e7eb;
            padding-top: 16px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-weight: 700;
            color: var(--text-main);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Loading & Error States */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: #ef4444;
            padding: 20px;
            background-color: #fee2e2;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Loading State -->
    <div id="loader" class="loader"></div>

    <!-- Error State -->
    <div id="error-msg" class="error-message"></div>

    <!-- Profile Card -->
    <div id="profile-card" class="profile-card hidden">
        <div class="header-bg"></div>
        <div class="avatar-container">
            <img id="user-avatar" src="" alt="User Avatar" class="avatar">
        </div>
        <div class="info">
            <h1 id="user-name" class="name"></h1>
            <a id="user-link" href="#" target="_blank" class="username"></a>
            <p id="user-bio" class="bio"></p>
            
            <div class="stats">
                <div class="stat-item">
                    <span id="repo-count" class="stat-value">0</span>
                    <span class="stat-label">Repos</span>
                </div>
                <div class="stat-item">
                    <span id="follower-count" class="stat-value">0</span>
                    <span class="stat-label">Followers</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Configuration: Change this username to test different profiles
    const TARGET_USERNAME = 'octocat'; 

    // DOM Elements
    const loader = document.getElementById('loader');
    const errorDiv = document.getElementById('error-msg');
    const profileCard = document.getElementById('profile-card');
    
    const avatarImg = document.getElementById('user-avatar');
    const nameEl = document.getElementById('user-name');
    const linkEl = document.getElementById('user-link');
    const bioEl = document.getElementById('user-bio');
    const repoCountEl = document.getElementById('repo-count');
    const followerCountEl = document.getElementById('follower-count');

    /**
     * Fetches user data from GitHub API and updates the DOM.
     */
    async function fetchUserProfile(username) {
        try {
            // Show loader, hide others
            loader.classList.remove('hidden');
            errorDiv.style.display = 'none';
            profileCard.classList.add('hidden');

            const response = await fetch(`https://api.github.com/users/${username}`);

            if (!response.ok) {
                throw new Error(`User not found (Status: ${response.status})`);
            }

            const data = await response.json();
            renderProfile(data);

        } catch (error) {
            console.error('Error fetching profile:', error);
            showError(error.message);
        } finally {
            loader.classList.add('hidden');
        }
    }

    /**
     * Populates the HTML elements with data from the API response.
     */
    function renderProfile(data) {
        // Set text content
        nameEl.textContent = data.name || data.login; // Fallback to login if no display name
        linkEl.textContent = `@${data.login}`;
        linkEl.href = data.html_url;
        
        // Handle Bio (might be null)
        bioEl.textContent = data.bio ? `"${data.bio}"` : 'This user has not provided a bio yet.';

        // Set Image
        avatarImg.src = data.avatar_url;
        avatarImg.alt = `${data.login}'s profile picture`;

        // Set Stats
        repoCountEl.textContent = data.public_repos;
        followerCountEl.textContent = data.followers;

        // Show card
        profileCard.classList.remove('hidden');
    }

    /**
     * Displays an error message to the user.
     */
    function showError(message) {
        errorDiv.textContent = `Error: ${message}`;
        errorDiv.style.display = 'block';
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        fetchUserProfile(TARGET_USERNAME);
    });
</script>

</body>
</html>
