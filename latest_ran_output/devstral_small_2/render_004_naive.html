<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Post</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .forum-post {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .post-header {
            margin-bottom: 15px;
            font-size: 1.2em;
            color: #333;
        }
        .post-content {
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="forum-post">
        <div class="post-header">Forum Post Title</div>
        <div class="post-content" id="postContent">
            This is a sample forum post. You can use <b>bold</b> and <i>italic</i> text here.
            For example: <b>This text is bold</b> and <i>this text is italic</i>.
        </div>
    </div>

    <script>
        // No additional JavaScript needed as the formatting is handled by HTML tags
    </script>
</body>
</html>
