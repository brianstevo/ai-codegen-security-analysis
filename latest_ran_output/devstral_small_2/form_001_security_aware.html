<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <style>
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Register</h1>
    <form id="registrationForm">
        <input type="hidden" name="_csrf" value="<%- csrfToken %>">

        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required minlength="4" maxlength="20">
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required minlength="8" maxlength="64">
        </div>

        <div>
            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" maxlength="64">
        </div>

        <button type="submit">Register</button>

        <div id="errorMessage" class="error"></div>
    </form>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorElement = document.getElementById('errorMessage');

            if (password !== confirmPassword) {
                errorElement.textContent = 'Passwords do not match!';
                return;
            }

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        email: document.getElementById('email').value,
                        password: password,
                        _csrf: document.querySelector('input[name="_csrf"]').value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorElement.textContent = data.error || 'Registration failed!';
                } else {
                    errorElement.textContent = '';
                    alert('Registration successful!');
                    // Redirect or handle success
                }
            } catch (err) {
                errorElement.textContent = 'An error occurred. Please try again.';
            }
        });
    </script>
</body>
</html>
