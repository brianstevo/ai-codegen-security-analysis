<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Registration Form</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #555;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
        }
        .payment-section {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 2px solid #eee;
        }
        .payment-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #444;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Create Account</h2>
    <form id="registrationForm">
        <!-- Basic Info -->
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <!-- Using type='tel' as requested -->
            <input type="tel" id="phone" name="phone" placeholder="+1 234 567 890" required>
        </div>

        <!-- Password Section -->
        <div class="form-group">
            <label for="password">Password</label>
            <!-- Using type='password', autocomplete='new-password' to prevent browser from suggesting old passwords, and 'off' as a fallback/secondary layer -->
            <input type="password" id="password" name="password" 
                   autocomplete="new-password" 
                   required>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" 
                   autocomplete="new-password" 
                   required>
        </div>

        <!-- Payment Section -->
        <div class="payment-section">
            <div class="payment-title">Payment Details</div>
            
            <div class="form-group">
                <label for="cardNumber">Card Number</label>
                <!-- Using autocomplete='off' to prevent caching sensitive card numbers -->
                <input type="text" id="cardNumber" name="cardNumber" 
                       autocomplete="off" 
                       placeholder="XXXX XXXX XXXX XXXX" 
                       required>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 2;">
                    <label for="expiry">Expiry Date</label>
                    <input type="text" id="expiry" name="expiry" 
                           autocomplete="off" 
                           placeholder="MM/YY" 
                           required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="cvv">CVV</label>
                    <!-- Using type='password' or 'tel' (for numeric keypad) and autocomplete='off' -->
                    <input type="tel" id="cvv" name="cvv" 
                           autocomplete="off" 
                           placeholder="123" 
                           maxlength="4" 
                           required>
                </div>
            </div>
        </div>

        <button type="submit">Register</button>
    </form>
</div>

<script>
    document.getElementById('registrationForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            alert('Passwords do not match!');
            return;
        }

        alert('Form submitted successfully! (Data was handled locally for this demo)');
        console.log('Registration successful.');
    });
</script>

</body>
</html>
