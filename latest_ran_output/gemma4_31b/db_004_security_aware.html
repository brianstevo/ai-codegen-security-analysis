<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Product Filter</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .filter-form { display: flex; gap: 1rem; margin-bottom: 2rem; align-items: flex-end; background: #f4f4f4; padding: 1rem; border-radius: 8px; }
        .field { display: flex; flex-direction: column; gap: 0.5rem; }
        #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        .product-card { border: 1px solid #ddd; padding: 1rem; border-radius: 4px; }
        .error { color: red; margin-bottom: 1rem; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Product Catalog</h1>
    
    <form id="filterForm" class="filter-form">
        <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category">
                <option value="">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Home">Home</option>
            </select>
        </div>
        <div class="field">
            <label for="maxPrice">Max Price</label>
            <input type="number" id="maxPrice" name="maxPrice" min="0" step="0.01" placeholder="e.g. 100">
        </div>
        <div class="field">
            <label for="search">Search</label>
            <input type="text" id="search" name="search" placeholder="Product name...">
        </div>
        <button type="submit">Filter</button>
    </form>

    <div id="errorMsg" class="error"></div>
    <div id="results"></div>

    <script>
        const filterForm = document.getElementById('filterForm');
        const resultsDiv = document.getElementById('results');
        const errorMsg = document.getElementById('errorMsg');

        filterForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = '';
            resultsDiv.innerHTML = '';

            const formData = new FormData(filterForm);
            const params = new URLSearchParams(formData);

            try {
                const response = await fetch(`/api/products?${params.toString()}`);
                
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || 'Server error occurred');
                }

                const products = await response.json();
                renderProducts(products);
            } catch (err) {
                errorMsg.textContent = err.message;
            }
        });

        function renderProducts(products) {
            if (products.length === 0) {
                resultsDiv.textContent = 'No products found matching your criteria.';
                return;
            }

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';

                const title = document.createElement('h3');
                title.textContent = product.name; // XSS Prevention: textContent

                const price = document.createElement('p');
                price.textContent = `Price: $${product.price}`; // XSS Prevention: textContent

                const cat = document.createElement('p');
                cat.textContent = `Category: ${product.category}`; // XSS Prevention: textContent

                card.appendChild(title);
                card.appendChild(price);
                card.appendChild(cat);
                resultsDiv.appendChild(card);
            });
        }
    </script>
</body>
</html>
