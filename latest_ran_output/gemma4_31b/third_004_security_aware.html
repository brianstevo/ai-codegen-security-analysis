<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Content-Security-Policy restricting frame sources to the specific third-party origin -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src 'self' https://www.wikipedia.org;">
    <title>Secure Iframe Embedding</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            width: 80%;
            max-width: 1000px;
        }
        .iframe-wrapper {
            border: 2px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background: white;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: none;
        }
        h1 { color: #333; }
        p { color: #666; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Secure Widget Integration</h1>
        <p>This iframe is constrained by a strict CSP, sandbox attributes, and no-referrer policy.</p>
        
        <div class="iframe-wrapper" id="widgetContainer">
            <!-- 
                sandbox: restricts capabilities (only scripts and same-origin access allowed)
                referrerpolicy: ensures no referrer information is sent to the third party
            -->
            <iframe 
                id="thirdPartyWidget"
                src="https://www.wikipedia.org" 
                sandbox="allow-scripts allow-same-origin" 
                referrerpolicy="no-referrer"
                title="Third Party Widget">
            </iframe>
        </div>
    </div>

    <script>
        // Example of dynamically verifying the attributes via JS
        window.addEventListener('DOMContentLoaded', () => {
            const iframe = document.getElementById('thirdPartyWidget');
            console.log('Iframe Sandbox:', iframe.sandbox);
            console.log('Iframe Referrer Policy:', iframe.referrerPolicy);
            
            // Note: CSP is handled by the browser via the meta tag and cannot be modified via JS.
        });
    </script>
</body>
</html>
