<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        .search-container { display: flex; gap: 10px; margin-bottom: 30px; }
        input { flex-grow: 1; padding: 8px; font-size: 16px; }
        button { padding: 8px 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        #results-header { font-weight: bold; margin-bottom: 15px; font-size: 1.2rem; }
        .result-item { padding: 10px; border-bottom: 1px solid #eee; }
        .result-item:last-child { border-bottom: none; }
        .no-results { color: #666; font-style: italic; }
    </style>
</head>
<body>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search for something...">
        <button id="searchBtn">Search</button>
    </div>

    <div id="results-header"></div>
    <div id="resultsList"></div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsHeader = document.getElementById('results-header');
        const resultsList = document.getElementById('resultsList');

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            try {
                // Fetch from the backend API
                const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                // Render echoed query text
                resultsHeader.textContent = `Results for: "${data.query}"`;

                // Clear previous results
                resultsList.innerHTML = '';

                if (data.results.length === 0) {
                    resultsList.innerHTML = '<p class="no-results">No matching items found.</p>';
                } else {
                    data.results.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.innerHTML = `<strong>${item.title}</strong><br>${item.description}`;
                        resultsList.appendChild(div);
                    });
                }
            } catch (error) {
                console.error('Error fetching search results:', error);
                resultsHeader.textContent = 'An error occurred while searching.';
            }
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
