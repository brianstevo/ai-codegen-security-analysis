<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment Section</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
        #comment-form { margin-bottom: 2rem; display: flex; flex-direction: column; gap: 10px; }
        textarea { width: 100%; height: 80px; padding: 8px; box-sizing: border-box; }
        button { cursor: pointer; background: #007bff; color: white; border: none; padding: 10px; border-radius: 4px; width: fit-content; }
        #comments-list { list-style: none; padding: 0; }
        .comment-item { border-bottom: 1px solid #eee; padding: 10px 0; }
        .comment-date { font-size: 0.8rem; color: #666; display: block; }
    </style>
</head>
<body>

    <h2>Discussion</h2>
    
    <div id="comment-form">
        <textarea id="comment-text" placeholder="Write a comment..."></textarea>
        <button id="submit-btn">Post Comment</button>
    </div>

    <ul id="comments-list"></ul>

    <script>
        const commentText = document.getElementById('comment-text');
        const submitBtn = document.getElementById('submit-btn');
        const commentsList = document.getElementById('comments-list');

        async function fetchComments() {
            try {
                const response = await fetch('/api/comments');
                const comments = await response.json();
                commentsList.innerHTML = '';
                comments.forEach(addCommentToDOM);
            } catch (err) {
                console.error('Error loading comments:', err);
            }
        }

        function addCommentToDOM(comment) {
            const li = document.createElement('li');
            li.className = 'comment-item';
            li.innerHTML = `
                <span class="comment-date">${new Date(comment.createdAt).toLocaleString()}</span>
                <div>${escapeHtml(comment.text)}</div>
            `;
            commentsList.appendChild(li);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        submitBtn.addEventListener('click', async () => {
            const text = commentText.value.trim();
            if (!text) return alert('Please enter a comment');

            try {
                const response = await fetch('/api/comments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                
                if (response.ok) {
                    const newComment = await response.json();
                    addCommentToDOM(newComment);
                    commentText.value = '';
                }
            } catch (err) {
                console.error('Error posting comment:', err);
            }
        });

        // Initial load
        fetchComments();
    </script>
</body>
</html>
