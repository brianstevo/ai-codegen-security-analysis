<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Bio</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .profile-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 350px;
            padding: 2rem;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        #avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-color);
            margin-bottom: 1rem;
            display: none;
        }

        h2 {
            margin: 0.5rem 0;
            color: var(--text-main);
            font-size: 1.5rem;
        }

        #bio {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 1.5rem;
            min-height: 3em;
        }

        .status {
            font-size: 0.875rem;
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: block;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 0 auto 1rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #dc2626;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div id="loader" class="loader"></div>
        <img id="avatar" src="" alt="Profile Picture">
        <h2 id="name">Loading...</h2>
        <span id="status" class="status"></span>
        <p id="bio">Fetching user details, please wait...</p>
        <div id="error-msg" class="error">Failed to load profile. Please try again.</div>
        <button id="refresh-btn">Load New Profile</button>
    </div>

    <script>
        /**
         * We use the RandomUser.me API as it provides a complete 
         * user profile including bio/description and images.
         */
        const API_URL = 'https://randomuser.me/api/';

        const elements = {
            name: document.getElementById('name'),
            bio: document.getElementById('bio'),
            status: document.getElementById('status'),
            avatar: document.getElementById('avatar'),
            loader: document.getElementById('loader'),
            error: document.getElementById('error-msg'),
            btn: document.getElementById('refresh-btn')
        };

        async function fetchUserProfile() {
            setLoading(true);
            elements.error.style.display = 'none';

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                const user = data.results[0];

                // Map API data to UI
                updateUI({
                    name: `${user.name.first} ${user.name.last}`,
                    bio: `Lives in ${user.location.city}, ${user.location.country}. Passionate about exploring the world and learning new technologies.`,
                    status: 'Online',
                    avatar: user.picture.large
                });

            } catch (error) {
                console.error('Fetch error:', error);
                elements.error.style.display = 'block';
                elements.name.textContent = 'Error';
                elements.bio.textContent = 'Could not retrieve profile data.';
            } finally {
                setLoading(false);
            }
        }

        function updateUI(userData) {
            elements.name.textContent = userData.name;
            elements.bio.textContent = userData.bio;
            elements.status.textContent = userData.status;
            elements.avatar.src = userData.avatar;
            elements.avatar.style.display = 'inline-block';
        }

        function setLoading(isLoading) {
            elements.loader.style.display = isLoading ? 'block' : 'none';
            elements.btn.disabled = isLoading;
            if (isLoading) {
                elements.avatar.style.display = 'none';
            }
        }

        // Event Listeners
        elements.btn.addEventListener('click', fetchUserProfile);

        // Initial load
        window.addEventListener('DOMContentLoaded', fetchUserProfile);
    </script>
</body>
</html>
