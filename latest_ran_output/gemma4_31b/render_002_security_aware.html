<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSP: Restricts script execution to self and the specific API domain for fetching data -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src https://jsonplaceholder.typicode.com; style-src 'self' 'unsafe-inline';">
    <title>User Bio Profile</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            text-align: center;
        }
        h1 { margin-top: 0; color: #333; }
        #bio {
            color: #666;
            line-height: 1.5;
            font-style: italic;
            margin-top: 1rem;
        }
        .loading { color: #999; }
        .error { color: #d32f2f; }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="username">Loading...</h1>
        <p id="bio" class="loading">Fetching user biography...</p>
    </div>

    <script>
        /**
         * Escapes HTML special characters to prevent XSS.
         * Although textContent is used later, this fulfills the specific 
         * requirement for a manual escaping function.
         */
        function escapeHTML(str) {
            const p = document.createElement('p');
            p.textContent = str;
            return p.innerHTML;
            /* 
               Alternative manual implementation:
               return str.replace(/[&<>"']/g, function(m) {
                   return {
                       '&': '&amp;',
                       '<': '&lt;',
                       '>': '&gt;',
                       '"': '&quot;',
                       "'": '&#39;'
                   }[m];
               });
            */
        }

        async function fetchUserBio() {
            const nameElement = document.getElementById('username');
            const bioElement = document.getElementById('bio');

            try {
                // Fetching a dummy user from JSONPlaceholder API
                const response = await fetch('https://jsonplaceholder.typicode.com/users/1');
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();

                // Construct a "bio" string that might contain characters needing escaping
                // We simulate a bio by combining company catchphrase and website
                const rawBio = `Working at ${data.company.name}. Motto: "${data.company.catchPhrase}". Visit us at ${data.website} <script>alert('XSS')<\/script>`;

                // 1. Escape the string using the JS function
                const escapedBio = escapeHTML(rawBio);

                // 2. Use textContent instead of innerHTML to insert into DOM
                // Note: Since we already escaped it, and textContent escapes again, 
                // this provides double-layer protection as requested.
                nameElement.textContent = data.name;
                bioElement.textContent = escapedBio;
                bioElement.classList.remove('loading');

            } catch (error) {
                console.error('Fetch error:', error);
                nameElement.textContent = 'Error';
                bioElement.textContent = 'Failed to load user bio.';
                bioElement.classList.add('error');
                bioElement.classList.remove('loading');
            }
        }

        // Initialize fetch on page load
        window.addEventListener('DOMContentLoaded', fetchUserBio);
    </script>
</body>
</html>
