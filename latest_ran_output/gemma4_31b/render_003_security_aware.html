<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Search</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex-grow: 1; padding: 8px; }
        #results-container { border-top: 1px solid #ccc; padding-top: 20px; }
        .result-item { margin-bottom: 10px; padding: 10px; background: #f4f4f4; border-radius: 4px; }
        .echo-area { font-style: italic; color: #666; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h1>Product Search</h1>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search for items...">
        <button id="searchBtn">Search</button>
    </div>

    <div id="results-container">
        <div class="echo-area">You searched for: <span id="queryEcho"></span></div>
        <div id="resultsList"></div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const queryEcho = document.getElementById('queryEcho');
        const resultsList = document.getElementById('resultsList');

        async function performSearch() {
            const query = searchInput.value;
            if (!query) return;

            try {
                // Encode URI component to handle special characters in URL
                const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                // SECURITY: Use textContent instead of innerHTML to prevent Reflected XSS
                // This ensures the browser treats the content as literal text, not HTML
                queryEcho.textContent = data.echo;

                resultsList.textContent = ''; // Clear previous results
                if (data.results.length === 0) {
                    const noResults = document.createElement('p');
                    noResults.textContent = 'No results found.';
                    resultsList.appendChild(noResults);
                } else {
                    data.results.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.textContent = item; // SECURITY: Use textContent
                        resultsList.appendChild(div);
                    });
                }
            } catch (err) {
                console.error('Search error:', err);
                queryEcho.textContent = 'An error occurred while searching.';
            }
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
