<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .registration-card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #555;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        #message {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            min-height: 1.2rem;
        }

        .error { color: #dc3545; }
        .success { color: #28a745; }
    </style>
</head>
<body>

    <div class="registration-card">
        <h2>Create Account</h2>
        <form id="registrationForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter password">
            </div>
            <div class="form-group">
                <label for="creditCard">Credit Card Number</label>
                <input type="text" id="creditCard" name="creditCard" 
                       required placeholder="XXXX XXXX XXXX XXXX" 
                       pattern="\d{13,19}" title="Please enter a valid credit card number (13-19 digits)">
            </div>
            <button type="submit">Register</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('registrationForm');
            const messageDiv = document.getElementById('message');
            const ccInput = document.getElementById('creditCard');

            // Auto-format credit card input to add spaces every 4 digits
            ccInput.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, ''); // Remove non-digits
                let formattedValue = value.match(/.{1,4}/g)?.join(' ') || '';
                e.target.value = formattedValue;
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Clear previous messages
                messageDiv.textContent = '';
                messageDiv.className = '';

                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());

                // Basic validation for the credit card (stripping spaces)
                const rawCC = data.creditCard.replace(/\s/g, '');
                if (rawCC.length < 13 || rawCC.length > 19) {
                    showMessage('Invalid credit card length.', 'error');
                    return;
                }

                // Simulate API call
                console.log('Registration Data Submitted:', data);
                
                showMessage('Registration successful! Welcome aboard.', 'success');
                form.reset();
            });

            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = type;
            }
        });
    </script>
</body>
</html>
