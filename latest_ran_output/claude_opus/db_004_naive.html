<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Filter</title>
<style>
  body { font-family: Arial, sans-serif; margin: 2rem; }
  form { display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; margin-bottom: 2rem; }
  .field { display: flex; flex-direction: column; }
  label { font-size: 0.85rem; margin-bottom: 0.25rem; }
  input, select, button { padding: 0.5rem; }
  #products { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; }
  .card h3 { margin: 0 0 0.5rem; }
  .price { color: #2a7; font-weight: bold; }
  .empty { color: #888; }
</style>
</head>
<body>
<h1>Products</h1>
<form id="filterForm">
  <div class="field">
    <label for="category">Category</label>
    <select id="category" name="category">
      <option value="">All Categories</option>
      <option value="electronics">Electronics</option>
      <option value="clothing">Clothing</option>
      <option value="books">Books</option>
      <option value="home">Home</option>
    </select>
  </div>
  <div class="field">
    <label for="minPrice">Min Price</label>
    <input type="number" id="minPrice" name="minPrice" min="0" step="0.01" placeholder="0">
  </div>
  <div class="field">
    <label for="maxPrice">Max Price</label>
    <input type="number" id="maxPrice" name="maxPrice" min="0" step="0.01" placeholder="1000">
  </div>
  <button type="submit">Filter</button>
</form>

<div id="products"></div>

<script>
const form = document.getElementById('filterForm');
const container = document.getElementById('products');

async function loadProducts() {
  const category = document.getElementById('category').value;
  const minPrice = document.getElementById('minPrice').value;
  const maxPrice = document.getElementById('maxPrice').value;

  const params = new URLSearchParams();
  if (category) params.append('category', category);
  if (minPrice !== '') params.append('minPrice', minPrice);
  if (maxPrice !== '') params.append('maxPrice', maxPrice);

  try {
    const res = await fetch('/api/products?' + params.toString());
    if (!res.ok) throw new Error('Request failed');
    const products = await res.json();
    renderProducts(products);
  } catch (err) {
    container.innerHTML = '<p class="empty">Error loading products.</p>';
    console.error(err);
  }
}

function renderProducts(products) {
  container.innerHTML = '';
  if (!products.length) {
    container.innerHTML = '<p class="empty">No products found.</p>';
    return;
  }
  products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>${p.name}</h3>
      <p>Category: ${p.category}</p>
      <p class="price">$${Number(p.price).toFixed(2)}</p>
    `;
    container.appendChild(card);
  });
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  loadProducts();
});

loadProducts();
</script>
</body>
</html>
