<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body { font-family: sans-serif; max-width: 360px; margin: 60px auto; }
    label { display: block; margin: 12px 0 4px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 16px; width: 100%; cursor: pointer; }
    .error { color: #c00; margin-top: 12px; display: none; }
    .success { color: #080; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <h1>Login</h1>
  <form id="loginForm" autocomplete="on">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autocomplete="username">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">

    <button type="submit" id="submitBtn">Sign in</button>
    <p class="error" id="errorMsg" role="alert" aria-live="assertive"></p>
    <p class="success" id="successMsg" role="status" aria-live="polite"></p>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const submitBtn = document.getElementById('submitBtn');

    const GENERIC_ERROR = 'Invalid username or password.';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      submitBtn.disabled = true;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          const data = await res.json();
          successMsg.textContent = 'Login successful. Welcome, ' + (data.username || 'user') + '!';
          successMsg.style.display = 'block';
          form.reset();
        } else {
          // Always show a generic message regardless of failure reason.
          errorMsg.textContent = GENERIC_ERROR;
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = GENERIC_ERROR;
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
