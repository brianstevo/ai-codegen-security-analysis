<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banking Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    display: flex;
    min-height: 100vh;
  }
  /* Sidebar */
  .sidebar {
    width: 240px;
    background: #14213d;
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 24px 0;
  }
  .sidebar .logo {
    font-size: 1.4rem;
    font-weight: 700;
    padding: 0 24px 24px;
    letter-spacing: 1px;
    color: #fca311;
  }
  .sidebar nav a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    color: #cdd3e0;
    text-decoration: none;
    font-size: .95rem;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .sidebar nav a:hover, .sidebar nav a.active {
    background: rgba(252,163,17,.15);
    color: #fca311;
    border-left: 3px solid #fca311;
  }
  .sidebar nav a .icon { font-size: 1.2rem; }

  /* Main */
  .main {
    flex: 1;
    padding: 24px 32px;
    overflow-y: auto;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }
  .topbar h1 { font-size: 1.6rem; }
  .topbar .user {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: #fca311;
    color: #14213d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }

  /* Cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 28px;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
  }
  .card .label { color: #6b7280; font-size: .85rem; }
  .card .value { font-size: 1.6rem; font-weight: 700; margin-top: 8px; }
  .card .change { font-size: .8rem; margin-top: 6px; }
  .up { color: #16a34a; }
  .down { color: #dc2626; }
  .card.accent { background: linear-gradient(135deg,#14213d,#233b6e); color:#fff; }
  .card.accent .label { color:#cdd3e0; }

  .grid-2 {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
  }
  .panel {
    background: #fff;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
  }
  .panel h2 { font-size: 1.1rem; margin-bottom: 16px; }

  /* Chart */
  .chart {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    height: 200px;
    padding-top: 10px;
  }
  .bar {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .bar .fill {
    width: 100%;
    background: linear-gradient(#fca311,#e08e00);
    border-radius: 6px 6px 0 0;
    transition: height .6s ease;
  }
  .bar span { font-size: .75rem; color:#6b7280; }

  /* Transactions */
  .tx {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #eef0f4;
  }
  .tx:last-child { border-bottom: none; }
  .tx .info { display: flex; align-items: center; gap: 12px; }
  .tx .ic {
    width: 38px; height: 38px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: #eef0f4;
    font-size: 1.1rem;
  }
  .tx .name { font-weight: 600; font-size: .92rem; }
  .tx .date { font-size: .78rem; color: #6b7280; }
  .amt { font-weight: 700; font-size: .95rem; }

  /* Quick actions */
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .actions button {
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #14213d;
    color: #fff;
    font-size: .9rem;
    cursor: pointer;
    transition: background .2s;
  }
  .actions button:hover { background: #fca311; color:#14213d; }

  @media (max-width: 860px) {
    .grid-2 { grid-template-columns: 1fr; }
    .sidebar { width: 70px; }
    .sidebar .logo { font-size:0; }
    .sidebar nav a span:not(.icon) { display:none; }
  }
</style>
</head>
<body>

    <div class="logo">NOVA<span style="color:#fff">BANK</span></div>
    <nav id="nav">
      <a class
