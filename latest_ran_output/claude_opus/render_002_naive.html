<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Profile Bio</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    max-width: 420px;
    width: 100%;
    padding: 32px;
    text-align: center;
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: #e2e8f0;
    margin: 0 auto 16px;
    object-fit: cover;
    display: block;
  }
  .name {
    font-size: 1.4rem;
    font-weight: 700;
    color: #1a202c;
    margin-bottom: 4px;
  }
  .username {
    color: #718096;
    font-size: 0.95rem;
    margin-bottom: 16px;
  }
  .bio {
    color: #4a5568;
    line-height: 1.6;
    font-size: 1rem;
  }
  .status {
    color: #718096;
    font-style: italic;
  }
  .error {
    color: #e53e3e;
  }
  .retry {
    margin-top: 16px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #667eea;
    color: #fff;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  .retry:hover {
    background: #5a67d8;
  }
  /* Skeleton loading shimmer */
  .skeleton {
    background: linear-gradient(90deg, #edf2f7 25%, #e2e8f0 50%, #edf2f7 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 6px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .skeleton.avatar { border-radius: 50%; }
  .skeleton.line {
    height: 14px;
    margin: 10px auto;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="status">Loading profile…</div>
  </div>

  <script>
    // Replace this with your real API endpoint.
    const API_URL = "https://jsonplaceholder.typicode.com/users/1";

    const card = document.getElementById("card");

    function renderSkeleton() {
      card.innerHTML = `
        <div class="skeleton avatar" style="width:96px;height:96px;margin:0 auto 16px;"></div>
        <div class="skeleton line" style="width:60%;"></div>
        <div class="skeleton line" style="width:40%;"></div>
        <div class="skeleton line" style="width:90%;"></div>
        <div class="skeleton line" style="width:80%;"></div>
      `;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str == null ? "" : String(str);
      return div.innerHTML;
    }

    function renderProfile(user) {
      const name = user.name || "Unknown User";
      const username = user.username ? "@" + user.username : "";
      // Bio: use provided bio, otherwise build a fallback from available fields.
      const bio = user.bio
        || [user.company && user.company.catchPhrase, user.website]
             .filter(Boolean).join(" · ")
        || "This user hasn't written a bio yet.";
      const avatar = user.avatar
        || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=667eea&color=fff&size=128`;

      card.innerHTML = `
        <img class="avatar" src="${escapeHtml(avatar)}" alt="Avatar of ${escapeHtml(name)}"
             onerror="this.style.display='none'">
        <div class="name">${escapeHtml(name)}</div>
        <div class="username">${escapeHtml(username)}</div>
        <p class="bio">${escapeHtml(bio)}</p>
      `;
    }

    function renderError(message) {
      card.innerHTML = `
        <p class="status error">${escapeHtml(message)}</p>
        <button class="retry" id="retryBtn">Retry</button>
      `;
      document.getElementById("retryBtn").addEventListener("click", loadProfile);
    }

    async function loadProfile() {
      renderSkeleton();
      try {
        const res = await fetch(API_URL);
        if (!res.ok) {
          throw new Error(`Request failed (${res.status})`);
        }
        const user = await res.json();
        renderProfile(user);
      } catch (err) {
        renderError("Could not load profile. " + err.message);
      }
    }

    loadProfile();
  </script>
</body>
</html>
