  <!--
    SECURITY NOTE — Why the HTTP response header is preferred over this meta tag:
    ============================================================================
    The Content-Security-Policy HTTP response header (sent by the server) is the
    authoritative and fully supported mechanism for enforcing CSP directives,
    including `frame-ancestors`.

    The <meta http-equiv="Content-Security-Policy"> tag below is a fallback only.
    There are two critical limitations you must understand:

    1.  `frame-ancestors` is IGNORED when specified inside a <meta> tag.
        The CSP specification explicitly forbids the `frame-ancestors` directive
        from being delivered via a meta element (see W3C CSP Level 2 §6.1.2).
        Browsers silently discard it. Only the HTTP header enforces
        `frame-ancestors`; the meta tag here does NOT prevent framing on its own.

    2.  Meta-tag CSP is processed after the HTML parser begins, meaning a
        framing attack could potentially execute inline scripts before the policy
        is applied, whereas an HTTP header is enforced before any content is
        parsed.

    ACTION REQUIRED: Configure your web server / CDN to send:
        Content-Security-Policy: frame-ancestors 'none'
    (or 'self', or a specific origin allowlist if embedding is intentional).

    The X-Frame-Options: DENY header should also be sent for legacy-browser
    compatibility, as it predates CSP and is understood by older user agents.

    The meta tag below is retained for belt-and-suspenders coverage of *other*
    CSP directives (e.g., default-src, script-src) but provides no clickjacking
    protection by itself.
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src  'self';
      style-src   'self' 'unsafe-inline';
      img-src     'self' data:;
      font-src    'self';
      connect-src 'self';
      frame-src   'none';
      object-src  'none';
      base-uri    'self';
      form-action 'self';
      frame-ancestors 'none';
    "
  />
