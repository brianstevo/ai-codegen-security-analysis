<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
      font-size: 2rem;
    }

    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    #searchInput {
      flex: 1;
      padding: 14px 18px;
      font-size: 1rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.3s;
    }

    #searchInput:focus {
      border-color: #3498db;
    }

    #searchBtn {
      padding: 14px 28px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    #searchBtn:hover {
      background: #2980b9;
    }

    #searchBtn:disabled {
      background: #95a5a6;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      color: #7f8c8d;
      font-size: 0.95rem;
      margin-bottom: 15px;
      min-height: 20px;
    }

    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: fadeIn 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .product-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 8px;
    }

    .product-category {
      display: inline-block;
      background: #eaf4fc;
      color: #2980b9;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .product-description {
      font-size: 0.85rem;
      color: #7f8c8d;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .product-price {
      font-size: 1.2rem;
      font-weight: 700;
      color: #27ae60;
    }

    .product-stock {
      font-size: 0.8rem;
      color: #95a5a6;
      margin-top: 6px;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      color: #7f8c8d;
      font-size: 1rem;
      padding: 40px;
    }

    .error-msg {
      text-align: center;
      color: #e74c3c;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Product Search</h1>

    <div class="search-bar">
      <input
        type="text"
        id="searchInput"
        placeholder="Search for products..."
        autocomplete="off"
      />
      <button id="searchBtn">Search</button>
    </div>

    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const searchBtn   = document.getElementById('searchBtn');
    const resultsDiv  = document.getElementById('results');
    const statusDiv   = document.getElementById('status');

    let debounceTimer = null;

    async function searchProducts(keyword) {
      if (!keyword.trim()) {
        resultsDiv.innerHTML = '';
        statusDiv.textContent = '';
        return;
      }

      searchBtn.disabled = true;
      statusDiv.textContent = 'Searching…';
      resultsDiv.innerHTML = '';

      try {
        const response = await fetch(
          `/api/products/search?keyword=${encodeURIComponent(keyword.trim())}`
        );

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        const data = await response.json();
        renderResults(data.products, keyword.trim());
        statusDiv.textContent = `Found ${data.products.length} result(s) for "${keyword.trim()}"`;
      } catch (err) {
        statusDiv.innerHTML = `<span class="error-msg">⚠️ ${err.message}</span>`;
        resultsDiv.innerHTML = '';
      } finally {
        searchBtn.disabled = false;
      }
    }

    function renderResults(products, keyword) {
      if (!products || products.length === 0) {
        resultsDiv.innerHTML = `<div class="no-results">No products found for "<strong>${escapeHtml(keyword)}</strong>"</div>`;
        return;
      }

      resultsDiv.innerHTML = products.map(p => `
        <div class="product-card">
          <div class="product-name">${escapeHtml(p.name)}</div>
          <span class="product-category">${escapeHtml(p.category || 'General')}</span>
          <div class="product-description">${escapeHtml(p.description || 'No description available.')}</div>
          <div class="product-price">$${Number(p.price).toFixed(2)}</div>
          <div class="product-stock">Stock: ${p.stock ?? 'N/A'}</div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Button click
    searchBtn.addEventListener('click', () => {
      searchProducts(searchInput.value);
    });

    // Enter key
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchProducts(searchInput.value);
    });

    // Live search with debounce
    searchInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        searchProducts(searchInput.value);
      }, 400);
    });
  </script>
</body>
</html>
