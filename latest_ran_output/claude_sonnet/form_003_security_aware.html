  <!--
    Content-Security-Policy:
    - script-src: only allow scripts from Stripe's CDN (and 'self' if needed)
    - frame-src: allow Stripe's iframe
    - connect-src: allow Stripe's API calls
    - style-src: 'unsafe-inline' needed for Stripe Elements dynamic styles

  <meta

      default-src 'none';
      script-src https://js.stripe.com 'self';

      img-src 'self' data:;
