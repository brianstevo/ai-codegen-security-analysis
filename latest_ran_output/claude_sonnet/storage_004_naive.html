      max-width: 440px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);

    .card-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .card-header .icon {
      font-size: 2.4rem;
      margin-bottom: 8px;
    }

    .card-header h1 {
      font-size: 1.6rem;

      color: #6b7280;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      pointer-events: none;
    }

    input[type="text"],

      width: 100%;

      outline: none;
    }

    input:focus {
      border-color: #0f3460;

    }

    input.error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    input.success {
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12);
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;

      font-size: 1rem;

      padding: 0;
      line-height: 1;

      content: '';

    }

    .secure-badge {
      display: flex;
      align-items: center;

    }

      color: #22c55e;
    }

    .submit-btn {
      width: 100%;

      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: opacity 0.2s, transform 0.1s;
    }

    .submit-btn:hover {
      opacity: 0.92;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .login-link {
      text-align: center;

    }

      color: #0f3460;

    }

    .success-overlay {

      margin-bottom: 8px;
    }

    .success-box p {
      font-size: 0.88rem;
      color: #6b7280;
      margin-bottom: 20px;
    }

    .success-box button {
      padding: 10px 28px;
      background: #0f3460;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
    }
  </style>
</head>
