<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Embedded Widget</title>

  <!--
    Content Security Policy:
    - frame-src: restricts which origins can be loaded in frames/iframes
    - script-src: only allow scripts from self
    - default-src: fallback to self only
    - style-src: allow self and inline styles (needed for this page's styles)
    - img-src: allow self and data URIs
    - connect-src: restrict fetch/XHR to self only
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data:;
      connect-src 'self';
      frame-src https://widget.example-third-party.com;
    "
  />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-bg: #0f1117;
      --color-surface: #1a1d2e;
      --color-border: #2e3250;
      --color-accent: #4f6ef7;
      --color-accent-hover: #6b85ff;
      --color-text: #e2e8f0;
      --color-text-muted: #8892b0;
      --color-success: #48bb78;
      --color-warning: #f6ad55;
      --color-danger: #fc8181;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      gap: 2rem;
    }

    header {
      text-align: center;
      max-width: 700px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--color-accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--color-text-muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .security-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      max-width: 700px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .badge-green {
      background: rgba(72, 187, 120, 0.15);
      color: var(--color-success);
      border: 1px solid rgba(72, 187, 120, 0.3);
    }

    .badge-blue {
      background: rgba(79, 110, 247, 0.15);
      color: var(--color-accent-hover);
      border: 1px solid rgba(79, 110, 247, 0.3);
    }

    .badge-orange {
      background: rgba(246, 173, 85, 0.15);
      color: var(--color-warning);
      border: 1px solid rgba(246, 173, 85, 0.3);
    }

    .badge svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .widget-container {
      width: 100%;
      max-width: 700px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.2rem;
      border-bottom: 1px solid var(--color-border);
      background: rgba(255, 255, 255, 0.02);
    }

    .widget-header-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .widget-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-success);
      box-shadow: 0 0 6px var(--color-success);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .widget-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--color-text-muted);
    }

    .widget-origin {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      font-family: monospace;
      background: rgba(255,255,255,0.05);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: 400px;
    }

    .iframe-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: var(--color-surface);
      color: var(--color-text-muted);
      font-size: 0.9rem;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .iframe-placeholder.hidden {
      opacity: 0;
    }

    .iframe-placeholder svg {
      width: 48px;
      height: 48px;
      color: var(--color-border);
    }

    .iframe-placeholder p {
      text-align: center;
      max-width: 280px;
      line-height: 1.5;
    }

    .iframe-placeholder small {
      font-size: 0.75rem;
      opacity: 0.6;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .security-details {
      width: 100%;
      max-width: 700px;
    }

    .security-details summary {
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--color-text-muted);
      padding: 0.6rem 0;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      list-style: none;
    }
