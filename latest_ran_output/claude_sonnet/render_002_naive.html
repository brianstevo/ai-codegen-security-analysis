<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #e0e0e0;
    }

    h1.page-title {
      font-size: 1.4rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #a0c4ff;
      margin-bottom: 28px;
      opacity: 0.85;
    }

    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 32px;
      width: 100%;
      max-width: 480px;
    }

    .search-bar input {
      flex: 1;
      padding: 12px 18px;
      border: 2px solid #0f3460;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-bar input::placeholder {
      color: #888;
    }

    .search-bar input:focus {
      border-color: #a0c4ff;
    }

    .search-bar button {
      padding: 12px 24px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #a0c4ff, #5b8dee);
      color: #1a1a2e;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .search-bar button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(91, 141, 238, 0.5);
    }

    .search-bar button:active {
      transform: translateY(0);
    }

    /* Card */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 36px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      transition: opacity 0.4s, transform 0.4s;
    }

    .card.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
    }

    /* Skeleton loader */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.07) 25%, rgba(255,255,255,0.13) 50%, rgba(255,255,255,0.07) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Profile layout */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .avatar-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #5b8dee;
      display: block;
    }

    .avatar-skeleton {
      width: 88px;
      height: 88px;
      border-radius: 50%;
    }

    .online-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 16px;
      height: 16px;
      background: #4caf87;
      border-radius: 50%;
      border: 3px solid #16213e;
    }

    .profile-name-block {
      flex: 1;
      min-width: 0;
    }

    .profile-name {
      font-size: 1.45rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-login {
      font-size: 0.9rem;
      color: #a0c4ff;
      margin-top: 3px;
    }

    .profile-location {
      font-size: 0.85rem;
      color: #888;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .profile-location svg {
      flex-shrink: 0;
    }

    .bio {
      font-size: 0.95rem;
      line-height: 1.65;
      color: #c0c0c0;
      border-left: 3px solid #5b8dee;
      padding-left: 14px;
      margin-bottom: 24px;
      font-style: italic;
    }

    .no-bio {
      color: #666;
      font-style: normal;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      padding: 16px 10px;
      margin-bottom: 24px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: #a0c4ff;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 3px;
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin-bottom: 20px;
    }

    .profile-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #5b8dee, #a0c4ff);
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .profile-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(91, 141, 238, 0.45);
    }

    /* Skeleton blocks */
