      padding: 2rem;
    }

    .container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
      max-width: 540px;
      width: 100%;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 2rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #fff;
      font-weight: 700;
      flex-shrink: 0;
      border: 3px solid rgba(255, 255, 255, 0.5);
    }

    .card-header-info {
      color: #fff;
    }

    .card-header-info h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .card-header-info .username {
      font-size: 0.9rem;
      opacity: 0.85;
      margin-top: 0.2rem;
    }

    .card-body {
      padding: 1.75rem;
    }

    .section {
      margin-bottom: 1.25rem;
    }

    .section:last-child {
      margin-bottom: 0;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8a94a6;
      margin-bottom: 0.35rem;
    }

    .section-value {
      font-size: 0.95rem;
      color: #2d3748;
      line-height: 1.6;
    }

    .bio-text {
      background: #f7fafc;
      border-left: 4px solid #667eea;
      padding: 0.85rem 1rem;
      border-radius: 0 8px 8px 0;
      font-style: italic;
      color: #4a5568;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .badge {
      display: inline-block;
      background: #ebf4ff;
      color: #3182ce;
      border-radius: 20px;
      padding: 0.25rem 0.75rem;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .divider {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 1.5rem 0;
    }

    .status {
      text-align: center;
      padding: 2.5rem 1.5rem;
      color: #718096;
      font-size: 0.95rem;
    }

    .spinner {
      display: inline-block;
      width: 36px;
      height: 36px;
      border: 4px solid #e2e8f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.75rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .error-text {
      color: #c53030;
    }

    .retry-btn {
      margin-top: 1rem;
      padding: 0.5rem 1.25rem;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .retry-btn:hover {
      background: #5a67d8;
    }

    .user-selector {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1.25rem 1.75rem;
      background: #f7fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    .user-selector label {
      font-size: 0.88rem;
      font-weight: 600;
      color: #4a5568;
      white-space: nowrap;
    }

    .user-selector select {
      flex: 1;
      padding: 0.45rem 0.75rem;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.88rem;
      color: #2d3748;
      background: #fff;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .user-selector select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }

    #security-note {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: #a0aec0;
      text-align: center;
      padding: 0 1rem;
    }
  </style>
