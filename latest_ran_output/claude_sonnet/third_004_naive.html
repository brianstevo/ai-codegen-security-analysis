      position: relative;

    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;

      align-items: center;
      justify-content: center;
      gap: 1rem;
      transition: opacity 0.4s;
    }

      pointer-events: none;

      border-radius: 50%;

    }

    }

      font-size: 0.875rem;

      transition: background 0.2s;
    }

      background: #c73652;
    }
