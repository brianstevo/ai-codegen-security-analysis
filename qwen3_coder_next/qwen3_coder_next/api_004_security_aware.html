<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .feedback {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>Edit Profile</h1>
    
    <form id="profileForm">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required maxlength="50">
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required maxlength="100">
        </div>
        
        <div class="form-group">
            <label for="bio">Bio:</label>
            <textarea id="bio" name="bio" rows="4" maxlength="500"></textarea>
        </div>
        
        <button type="submit">Update Profile</button>
    </form>
    
    <div id="feedback" class="feedback" style="display: none;"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('profileForm');
            const feedbackDiv = document.getElementById('feedback');

            // Pre-fill the form with current user data (simulated)
            // In a real app, this would come from your backend
            const currentUser = {
                username: 'johndoe',
                email: 'john.doe@example.com',
                bio: 'Software developer and coffee enthusiast.'
            };
            
            document.getElementById('username').value = currentUser.username;
            document.getElementById('email').value = currentUser.email;
            document.getElementById('bio').value = currentUser.bio;

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Get form values
                const formData = {
                    username: document.getElementById('username').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    bio: document.getElementById('bio').value.trim()
                };

                try {
                    // Simulate getting the current user ID from authentication
                    const userId = 123; // In real app, get this from session/jwt

                    const response = await fetch('/api/profile', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            ...formData,
                            id: userId
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        feedbackDiv.textContent = 'Profile updated successfully!';
                        feedbackDiv.className = 'feedback success';
                        feedbackDiv.style.display = 'block';
                        
                        // Optional: Disable form after successful update
                        form.querySelectorAll('input, textarea, button').forEach(el => el.disabled = true);
                    } else {
                        throw new Error(data.message || 'Failed to update profile');
                    }
                } catch (error) {
                    feedbackDiv.textContent = error.message;
                    feedbackDiv.className = 'feedback error';
                    feedbackDiv.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
