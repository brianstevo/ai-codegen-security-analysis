<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTech | Digital Banking Dashboard</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --secondary-color: #64748b;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-light: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --border-radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: #1e293b;
            color: white;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            position: fixed;
            height: 100vh;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand span { color: var(--primary-color); }

        .nav-links {
            list-style: none;
            flex-grow: 1;
        }

        .nav-item {
            margin-bottom: 0.8rem;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: var(--border-radius);
            transition: all 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            background-color: var(--primary-color);
            color: white;
        }

        .nav-icon { width: 20px; text-align: center; font-size: 1.2rem; }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            margin-left: 260px;
            padding: 2rem;
            transition: margin-left 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
        }

        .user-info { display: flex; align-items: center; gap: 1rem; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background-color: var(--primary-color); color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .card-header { font-size: 0.9rem; color: var(--text-light); margin-bottom: 0.5rem; }
        .card-value { font-size: 2rem; font-weight: 700; color: var(--text-dark); }
        .card-sub { font-size: 0.85rem; margin-top: 0.5rem; display: flex; align-items: center; gap: 5px; }
        .positive { color: var(--success); }
        .negative { color: var(--danger); }

        /* Transactions Table */
        .section-title {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-sm {
            padding: 6px 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }
        .btn-sm:hover { background-color: var(--primary-hover); }

        .transactions-table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .transactions-table th, .transactions-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        .transactions-table th { background-color: #f8fafc; font-weight: 600; color: var(--text-light); }
        .transactions-table tr:last-child td { border-bottom: none; }
        
        .status-pending { padding: 4px 8px; background-color: #fef3c7; color: #d97706; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .status-completed { padding: 4px 8px; background-color: #d1fae5; color: #059669; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }

        /* Quick Transfer Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background-color: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 450px;
        }
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-dark); }
        .form-input {
            width: 100%; padding: 10px;
            border: 1px solid #cbd5e1; border-radius: 8px;
            font-size: 1rem; outline: none;
        }
        .form-input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem; }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; }
            .mobile-menu-btn { display: block; font-size: 1.5rem; background: none; border: none; cursor: pointer; color: var(--text-dark); }
        }

        @media (min-width: 769px) {
            .mobile-menu-btn { display: none; }
        }

        .chart-container {
            height: 200px;
            width: 100%;
            background-color: #f8fafc;
            border-radius: var(--border-radius);
            position: relative;
            overflow: hidden;
            padding: 1rem;
        }

            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 100%;
            gap: 10px;
            padding-top: 20px;
        }
        .bar-group { display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; justify-content: flex-end; }
        .bar { width: 100%; background-color: var(--primary-color); border-radius: 4px 4px 0 0; transition: height 1s ease-in-out; position: relative; }
