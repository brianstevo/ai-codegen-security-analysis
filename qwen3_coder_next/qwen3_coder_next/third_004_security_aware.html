<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandboxed Iframe Widget</title>
    
    <!-- 
        Content Security Policy (CSP) Header equivalent
        Restricts frame sources to the specific third-party origin only
    -->
    <meta http-equiv="Content-Security-Policy" content="frame-src https://third-party-widget.com; default-src 'self'">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        h1 {
            color: #333;
            text-align: center;
        }
        
        .widget-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .fallback-message {
            display: none;
            padding: 20px;
            text-align: center;
            background-color: #ffebee;
            color: #c62828;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Third-Party Widget Integration</h1>
    
    <div class="widget-container">
        <!-- 
            Iframe with restrictive sandbox attributes:
            - allow-scripts: Allows script execution (essential for widget functionality)
            - allow-same-origin: Allows the iframe content to maintain its origin
            - NO allow-forms, allow-popups, allow-modals, etc. to restrict potentially dangerous features
            
            referrerpolicy="no-referrer" prevents sending referrer information to the third-party widget
        -->
        <iframe 
            src="https://third-party-widget.com/widget.html"
            title="Third-Party Widget"
            sandbox="allow-scripts allow-same-origin"
            referrerpolicy="no-referrer">
        </iframe>
    </div>
    
    <p class="fallback-message" id="fallbackMessage">
        Your browser does not support iframes or they have been disabled.
    </p>

    <script>
        // Simple feature detection for iframe support
        document.addEventListener('DOMContentLoaded', function() {
            const iframe = document.querySelector('iframe');
            
            // Check if iframe is loaded (basic check)
            setTimeout(function() {
                try {
                    // Attempt to access iframe properties - will throw if sandboxed without allow-same-origin
                    // Since we have allow-same-origin, this should work for same-origin resources
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    console.log('Iframe loaded successfully');
                } catch (e) {
                    console.error('Could not access iframe content:', e);
                }
            }, 1000);
        });
    </script>
</body>
</html>
