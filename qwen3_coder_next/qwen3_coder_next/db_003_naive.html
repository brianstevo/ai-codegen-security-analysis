<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment Feature</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .comment-form textarea {
            width: 100%;
            height: 80px;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        .comment-form button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .comment-form button:hover {
            background-color: #45a049;
        }
        .comments-container {
            margin-top: 30px;
        }
        .comment {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }
        .comment-author {
            font-weight: bold;
            color: #333;
        }
        .comment-text {
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Comments</h1>
    
    <div class="comment-form">
        <textarea id="commentText" placeholder="Write your comment here..."></textarea>
        <button id="submitBtn">Submit Comment</button>
    </div>

    <div class="comments-container" id="commentsContainer">
        <!-- Comments will be loaded here -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const submitBtn = document.getElementById('submitBtn');
            const commentText = document.getElementById('commentText');
            const commentsContainer = document.getElementById('commentsContainer');

            // Load existing comments on page load
            fetchComments();

            submitBtn.addEventListener('click', async () => {
                const text = commentText.value.trim();
                
                if (!text) {
                    alert('Please enter a comment');
                    return;
                }

                try {
                    const response = await fetch('/api/comments', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ text })
                    });

                    if (response.ok) {
                        const newComment = await response.json();
                        addCommentToPage(newComment);
                        commentText.value = '';
                    } else {
                        console.error('Failed to submit comment');
                    }
                } catch (error) {
                    console.error('Error submitting comment:', error);
                }
            });

            async function fetchComments() {
                try {
                    const response = await fetch('/api/comments');
                    if (response.ok) {
                        const comments = await response.json();
                        comments.forEach(comment => addCommentToPage(comment));
                    }
                } catch (error) {
                    console.error('Error fetching comments:', error);
                }
            }

            function addCommentToPage(comment) {
                const commentDiv = document.createElement('div');
                commentDiv.className = 'comment';
                commentDiv.innerHTML = `
                    <div class="comment-author">User ${comment.id}</div>
                    <div class="comment-text">${escapeHtml(comment.text)}</div>
                `;
                commentsContainer.prepend(commentDiv);
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        });
    </script>
</body>
</html>
