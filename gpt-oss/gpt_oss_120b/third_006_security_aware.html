<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SRI & CSP Demo</title>

  <!-- Content Security Policy requiring SRI for external scripts -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://cdnjs.cloudflare.com;
    require-sri-for script
  ">
</head>
<body>
  <h1>Third‑Party Script Loaded with Subresource Integrity (SRI)</h1>

  <!-- Load Lodash from CDN with SHA‑384 SRI -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"
          integrity="sha384-PLACEHOLDER_FOR_ACTUAL_SHA384_HASH"
          crossorigin="anonymous"></script>

  <script>
    // Example usage of the loaded library
    console.log('Lodash version:', _.VERSION);
  </script>

  <!-- 
    How to regenerate the SRI hash when the script version changes:
    1. Download the new script file (e.g., lodash.min.js).
    2. Run the following command in a terminal:
         openssl dgst -sha384 -binary < lodash.min.js | openssl base64 -A
    3. Prefix the resulting string with "sha384-" and replace the value of 
       the integrity attribute above.
  -->
</body>
</html>
