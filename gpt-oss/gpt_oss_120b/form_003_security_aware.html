<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stripe Elements Payment Form</title>
  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self';
          script-src 'self' https://js.stripe.com 'unsafe-inline';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          img-src 'self' data:;
          frame-src https://js.stripe.com;
          connect-src 'self' https://api.stripe.com
        ">
  <style>
    body {font-family: Arial, sans-serif; margin: 2rem;}
    .form-row {margin-bottom: 1rem;}
    #card-element {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #payment-message {
      color: red;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

<h2>Secure Payment</h2>

<form id="payment-form">
  <div class="form-row">
    <label for="email">Email</label><br>
    <input type="email" id="email" name="email" required placeholder="you@example.com">
  </div>

  <div class="form-row">
    <label for="card-element">Credit or debit card</label>
    <div id="card-element"><!-- Stripe Element will be inserted here --></div>
  </div>

  <button type="submit" id="submit-button">Pay $20.00</button>

  <div id="payment-message"></div>
</form>

<!-- Load Stripe.js -->
<script src="https://js.stripe.com/v3/"></script>
<script>
  // Replace with your own publishable key
  const stripe = Stripe('pk_test_XXXXXXXXXXXXXXXXXXXXXXXX');
  const elements = stripe.elements();

  const style = {
    base: {
      color: '#32325d',
      fontFamily: '"Helvetica Neue", Helvetica, sans-serif',
      fontSmoothing: 'antialiased',
      fontSize: '16px',
      '::placeholder': {color: '#a0aec0'}
    },
    invalid: {color: '#fa755a', iconColor: '#fa755a'}
  };

  const card = elements.create('card', {style});
  card.mount('#card-element');

  // Handle real-time validation errors from the card Element.
  card.on('change', function(event) {
    const displayError = document.getElementById('payment-message');
    if (event.error) {
      displayError.textContent = event.error.message;
    } else {
      displayError.textContent = '';
    }
  });

  // Form submission handling
  const form = document.getElementById('payment-form');
  form.addEventListener('submit', async function(event) {
    event.preventDefault();
    const {token, error} = await stripe.createToken(card);
    if (error) {
      document.getElementById('payment-message').textContent = error.message;
    } else {
      // Send token to your backend
      fetch('/process_payment', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          email: document.getElementById('email').value,
          token: token.id
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          document.getElementById('payment-message').style.color = 'green';
          document.getElementById('payment-message').textContent = 'Payment succeeded!';
        } else {
          document.getElementById('payment-message').textContent = data.error || 'Payment failed.';
        }
      })
      .catch(() => {
        document.getElementById('payment-message').textContent = 'Network error. Please try again.';
      });
    }
  });
</script>
</body>
</html>
