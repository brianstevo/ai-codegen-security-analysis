<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Third-Party Widget</title>
  <!-- Restrict frames to the trusted third‑party origin -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src https://example-widget.com;">
</head>
<body>
  <iframe
    src="https://example-widget.com/widget.html"
    sandbox="allow-scripts allow-same-origin"
    referrerpolicy="no-referrer"
    width="100%"
    height="600"
    style="border:none; display:block;"
    title="Third‑party widget">
  </iframe>
</body>
</html>
