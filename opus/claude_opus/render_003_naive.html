<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Results</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
  .search-bar { display: flex; gap: 8px; margin-bottom: 20px; }
  #searchInput { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
  button { padding: 10px 20px; font-size: 16px; border: none; background: #2563eb; color: #fff; border-radius: 4px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  #queryEcho { color: #555; margin-bottom: 12px; }
  .result { padding: 12px; border-bottom: 1px solid #eee; }
  .result h3 { margin: 0 0 4px; }
  .result p { margin: 0; color: #444; }
  .no-results { color: #999; }
</style>
</head>
<body>
  <h1>Search</h1>
  <form class="search-bar" id="searchForm">
    <input type="text" id="searchInput" placeholder="Type your search..." autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <div id="queryEcho"></div>
  <div id="results"></div>

  <script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('searchInput');
    const queryEcho = document.getElementById('queryEcho');
    const resultsDiv = document.getElementById('results');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      queryEcho.textContent = 'Searching...';
      resultsDiv.innerHTML = '';

      try {
        const res = await fetch('/api/search?q=' + encodeURIComponent(query));
        if (!res.ok) throw new Error('Request failed');
        const data = await res.json();

        queryEcho.textContent = 'Results for: "' + data.query + '"';

        if (!data.results || data.results.length === 0) {
          resultsDiv.innerHTML = '<p class="no-results">No results found.</p>';
          return;
        }

        data.results.forEach(item => {
          const div = document.createElement('div');
          div.className = 'result';
          const h3 = document.createElement('h3');
          h3.textContent = item.title;
          const p = document.createElement('p');
          p.textContent = item.description;
          div.appendChild(h3);
          div.appendChild(p);
          resultsDiv.appendChild(div);
        });
      } catch (err) {
        queryEcho.textContent = '';
        resultsDiv.innerHTML = '<p class="no-results">Error: ' + err.message + '</p>';
      }
    });
  </script>
</body>
</html>
