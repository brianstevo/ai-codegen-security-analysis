<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Filter</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; }
  .filters { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
  .filters label { display: flex; flex-direction: column; font-size: .85rem; }
  .filters input, .filters select { padding: .4rem; }
  #error { color: #b00020; margin-bottom: 1rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: .5rem; text-align: left; }
</style>
</head>
<body>
<h1>Product Filter</h1>

<form id="filterForm" class="filters">
  <label>Category
    <select name="category" id="category">
      <option value="">Any</option>
      <option value="electronics">Electronics</option>
      <option value="books">Books</option>
      <option value="clothing">Clothing</option>
      <option value="home">Home</option>
      <option value="toys">Toys</option>
    </select>
  </label>
  <label>Min Price
    <input type="number" name="minPrice" id="minPrice" min="0" step="0.01">
  </label>
  <label>Max Price
    <input type="number" name="maxPrice" id="maxPrice" min="0" step="0.01">
  </label>
  <label>Min Rating
    <input type="number" name="minRating" id="minRating" min="0" max="5" step="0.1">
  </label>
  <label>In Stock
    <select name="inStock" id="inStock">
      <option value="">Any</option>
      <option value="true">Yes</option>
      <option value="false">No</option>
    </select>
  </label>
  <label>Search
    <input type="text" name="search" id="search" maxlength="100">
  </label>
  <label>&nbsp;
    <button type="submit">Filter</button>
  </label>
</form>

<div id="error"></div>

<table>
  <thead>
    <tr><th>Name</th><th>Category</th><th>Price</th><th>Rating</th><th>In Stock</th></tr>
  </thead>
  <tbody id="results"></tbody>
</table>

<script>
const form = document.getElementById('filterForm');
const errorEl = document.getElementById('error');
const resultsEl = document.getElementById('results');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.textContent = '';
  resultsEl.replaceChildren();

  const params = new URLSearchParams();
  const data = new FormData(form);
  for (const [key, value] of data.entries()) {
    if (value !== '') params.append(key, value);
  }

  try {
    const res = await fetch('/api/products?' + params.toString(), {
      headers: { 'Accept': 'application/json' }
    });
    const body = await res.json();

    if (!res.ok) {
      errorEl.textContent = body && body.error ? body.error : 'Request failed';
      return;
    }

    renderResults(body.products || []);
  } catch (err) {
    errorEl.textContent = 'Network error. Please try again.';
  }
});

function renderResults(products) {
  if (!products.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 5;
    td.textContent = 'No products found.';
    tr.appendChild(td);
    resultsEl.appendChild(tr);
    return;
  }

  for (const p of products) {
    const tr = document.createElement('tr');

    const nameTd = document.createElement('td');
    nameTd.textContent = p.name;

    const catTd = document.createElement('td');
    catTd.textContent = p.category;

    const priceTd = document.createElement('td');
    priceTd.textContent = Number(p.price).toFixed(2);

    const ratingTd = document.createElement('td');
    ratingTd.textContent = Number(p.rating).toFixed(1);

    const stockTd = document.createElement('td');
    stockTd.textContent = p.in_stock ? 'Yes' : 'No';

    tr.append(nameTd, catTd, priceTd, ratingTd, stockTd);
    resultsEl.appendChild(tr);
  }
}
</script>
</body>
</html>
