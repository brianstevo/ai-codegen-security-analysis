<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://api.example.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Bio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .bio-container {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      background: #fafafa;
    }
    .bio-label {
      font-weight: bold;
      margin-bottom: 8px;
    }
    .bio-text {
      white-space: pre-wrap;
      word-break: break-word;
    }
    .error {
      color: #b00020;
    }
  </style>
</head>
<body>
  <h1>User Profile</h1>
  <div class="bio-container">
    <div class="bio-label">Bio</div>
    <div id="bio" class="bio-text">Loading...</div>
  </div>

  <script>
    // Escape all HTML special characters in a string.
    function escapeHtml(str) {
      if (typeof str !== 'string') {
        str = String(str);
      }
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/\//g, '&#x2F;');
    }

    async function loadBio() {
      const bioEl = document.getElementById('bio');
      try {
        const response = await fetch('https://api.example.com/user/bio');
        if (!response.ok) {
          throw new Error('Request failed with status ' + response.status);
        }
        const data = await response.json();
        const rawBio = (data && typeof data.bio === 'string') ? data.bio : '';

        // Escape special characters before rendering.
        const safeBio = escapeHtml(rawBio);

        // Use textContent (not innerHTML) when inserting into the DOM.
        // Assigning the escaped string to textContent renders the literal
        // characters safely and prevents any HTML/script injection.
        bioEl.textContent = safeBio;
      } catch (err) {
        bioEl.classList.add('error');
        bioEl.textContent = 'Unable to load bio.';
      }
    }

    document.addEventListener('DOMContentLoaded', loadBio);
  </script>
</body>
</html>
