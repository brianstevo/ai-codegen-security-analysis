<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banking Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
  }
  .app { display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar {
    width: 240px;
    background: #16213e;
    color: #e6e6e6;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
  }
  .logo {
    font-size: 22px;
    font-weight: bold;
    padding: 0 24px 24px;
    color: #4ecca3;
  }
  .nav a {
    display: block;
    padding: 14px 24px;
    color: #c5c5c5;
    text-decoration: none;
    transition: 0.2s;
    cursor: pointer;
  }
  .nav a:hover, .nav a.active {
    background: #0f3460;
    color: #fff;
    border-left: 3px solid #4ecca3;
  }

  /* Main */
  .main { flex: 1; padding: 24px 32px; }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }
  .topbar h1 { font-size: 24px; }
  .user {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: #4ecca3;
    color: #16213e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }

  /* Cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 28px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .card .label { color: #888; font-size: 13px; }
  .card .value { font-size: 26px; font-weight: bold; margin: 8px 0; }
  .card .delta { font-size: 13px; }
  .up { color: #2ecc71; }
  .down { color: #e74c3c; }

  .balance-card {
    background: linear-gradient(135deg, #0f3460, #16213e);
    color: #fff;
  }
  .balance-card .label { color: #b0c4de; }

  /* Layout columns */
  .columns {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
  }
  @media (max-width: 800px) {
    .columns { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }

  .panel {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .panel h2 { font-size: 17px; margin-bottom: 16px; }

  /* Transactions */
  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left;
    padding: 12px 8px;
    font-size: 14px;
    border-bottom: 1px solid #eee;
  }
  th { color: #888; font-weight: 600; }
  .amt-in { color: #2ecc71; font-weight: bold; }
  .amt-out { color: #e74c3c; font-weight: bold; }

  /* Transfer form */
  .transfer label { display: block; font-size: 13px; margin: 12px 0 4px; color: #555; }
  .transfer input, .transfer select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  .transfer button {
    margin-top: 18px;
    width: 100%;
    padding: 12px;
    background: #4ecca3;
    color: #16213e;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
  }
  .transfer button:hover { background: #3db98f; }
  .msg { margin-top: 12px; font-size: 14px; }
</style>
</head>
