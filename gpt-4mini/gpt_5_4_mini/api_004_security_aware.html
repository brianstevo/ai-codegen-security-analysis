<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f6f7fb;
      color: #111827;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    h1 { margin-top: 0; }
    form {
      display: grid;
      gap: 1rem;
    }
    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 0.8rem 0.9rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font: inherit;
      background: #fff;
      color: inherit;
    }
    textarea { min-height: 120px; resize: vertical; }
    .actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 0.85rem 1.1rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    .feedback {
      margin-top: 1rem;
      padding: 0.9rem 1rem;
      border-radius: 10px;
      display: none;
      white-space: pre-wrap;
    }
    .feedback.success {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .feedback.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .hint {
      font-size: 0.92rem;
      color: #6b7280;
      margin-top: -0.4rem;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Edit Profile</h1>
    <p class="hint">Update only the fields you want to change. The server validates and authorizes the request.</p>

    <form id="profileForm" autocomplete="off">
      <div class="grid">
        <div>
          <label for="displayName">Display Name</label>
          <input id="displayName" name="displayName" type="text" maxlength="80" placeholder="Jane Doe" />
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" maxlength="254" placeholder="jane@example.com" />
        </div>
        <div>
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" maxlength="20" placeholder="+1 555 123 4567" />
        </div>
        <div>
          <label for="location">Location</label>
          <input id="location" name="location" type="text" maxlength="120" placeholder="New York, NY" />
        </div>
      </div>

      <div>
        <label for="bio">Bio</label>
        <textarea id="bio" name="bio" maxlength="500" placeholder="Tell us a little about yourself"></textarea>
      </div>

      <div class="actions">
        <button id="saveBtn" type="submit">Save Changes</button>
      </div>
    </form>

    <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
  </main>

  <script>
    const form = document.getElementById('profileForm');
    const feedback = document.getElementById('feedback');
    const saveBtn = document.getElementById('saveBtn');

    function showFeedback(type, message) {
      feedback.className = `feedback ${type}`;
      feedback.textContent = message;
    }

    function clearFeedback() {
      feedback.className = 'feedback';
      feedback.textContent = '';
      feedback.style.display = 'none';
    }

    function getTrimmedValue(id) {
      return document.getElementById(id).value.trim();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearFeedback();
      saveBtn.disabled = true;

      const payload = {
        displayName: getTrimmedValue('displayName'),
        email: getTrimmedValue('email'),
        phone: getTrimmedValue('phone'),
        location: getTrimmedValue('location'),
        bio: getTrimmedValue('bio')
      };

      try {
        const res = await fetch('/api/profile/me', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          const message = data.error || data.message || 'Failed to update profile.';
          showFeedback('error', message);
          feedback.style.display = 'block';
          return;
        }

        showFeedback('success', data.message || 'Profile updated successfully.');
        feedback.style.display = 'block';
      } catch (err) {
        showFeedback('error', 'Network error. Please try again.');
        feedback.style.display = 'block';
      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
