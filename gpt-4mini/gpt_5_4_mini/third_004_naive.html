<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embedded Chat Widget</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --border: #d9e1ec;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .page {
      width: min(1100px, 100%);
      display: grid;
      gap: 16px;
    }

    .header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .widget-shell {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      min-height: 700px;
      display: flex;
      flex-direction: column;
    }

    .widget-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.06), transparent);
    }

    .widget-toolbar .label {
      font-weight: 600;
    }

    .widget-toolbar .status {
      color: var(--muted);
      font-size: 0.95rem;
    }

    iframe {
      width: 100%;
      flex: 1;
      border: 0;
      display: block;
      background: #fff;
    }

    .footer-note {
      color: var(--muted);
      font-size: 0.92rem;
      padding: 0 4px;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="header">
      <h1>Customer Support Chat</h1>
      <p>This page embeds a third-party chat widget inside an iframe. Replace the <code>src</code> URL with your provider’s widget URL.</p>
    </section>

    <section class="widget-shell" aria-label="Chat widget container">
      <div class="widget-toolbar">
        <div class="label">Live Chat</div>
        <div class="status">Powered by third-party service</div>
      </div>

      <iframe
        id="chatWidget"
        title="Third-party chat widget"
        src="https://example.com/chat-widget"
        loading="lazy"
        referrerpolicy="no-referrer"
        allow="microphone; camera; clipboard-read; clipboard-write"
      ></iframe>
    </section>

    <div class="footer-note">
      If the widget provider requires a specific embed URL or query parameters, update the iframe <code>src</code> accordingly.
    </div>
  </main>

  <script>
    // Optional: basic iframe load/error handling
    const iframe = document.getElementById('chatWidget');

    iframe.addEventListener('load', () => {
      console.log('Chat widget iframe loaded.');
    });

    // Note: iframe error events are not reliably exposed cross-origin in browsers.
  </script>
</body>
</html>
