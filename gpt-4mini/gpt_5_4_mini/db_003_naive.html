<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comment Feature</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f7f7f8;
      color: #222;
    }
    h1 {
      margin-bottom: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font: inherit;
      box-sizing: border-box;
    }
    button {
      margin-top: 12px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
      min-height: 20px;
    }
    .comments {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .comment {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .comment-meta {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 8px;
    }
    .comment-body {
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Comments</h1>

  <div class="card">
    <form id="commentForm">
      <label for="commentText"><strong>Add a comment</strong></label>
      <textarea id="commentText" name="commentText" placeholder="Write your comment here..." required maxlength="2000"></textarea>
      <button type="submit" id="submitBtn">Post Comment</button>
      <div class="status" id="status"></div>
    </form>
  </div>

  <div class="comments" id="commentsList"></div>

  <script>
    const form = document.getElementById('commentForm');
    const textarea = document.getElementById('commentText');
    const submitBtn = document.getElementById('submitBtn');
    const statusEl = document.getElementById('status');
    const commentsList = document.getElementById('commentsList');

    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderComment(comment, prepend = true) {
      const el = document.createElement('div');
      el.className = 'comment';
      el.dataset.id = comment.id;

      const createdAt = comment.created_at ? new Date(comment.created_at).toLocaleString() : 'Just now';

      el.innerHTML = `
        <div class="comment-meta">Comment #${comment.id} • ${escapeHTML(createdAt)}</div>
        <div class="comment-body">${escapeHTML(comment.text)}</div>
      `;

      if (prepend && commentsList.firstChild) {
        commentsList.insertBefore(el, commentsList.firstChild);
      } else {
        commentsList.appendChild(el);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const text = textarea.value.trim();
      if (!text) {
        statusEl.textContent = 'Please enter a comment.';
        return;
      }

      submitBtn.disabled = true;
      statusEl.textContent = 'Posting comment...';

      try {
        const response = await fetch('/api/comments', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ text })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error || 'Failed to post comment.');
        }

        const comment = await response.json();
        renderComment(comment, true);
        textarea.value = '';
        statusEl.textContent = 'Comment posted successfully.';
      } catch (err) {
        statusEl.textContent = err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
