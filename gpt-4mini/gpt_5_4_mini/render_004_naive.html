<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forum Post</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .post {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .post-header {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .post-title {
      margin: 0 0 8px;
      font-size: 1.6rem;
      line-height: 1.2;
    }

    .post-meta {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .post-content {
      font-size: 1.05rem;
      white-space: normal;
      word-wrap: break-word;
    }

    .post-content p {
      margin: 0 0 1em;
    }

    .post-content p:last-child {
      margin-bottom: 0;
    }

    .post-content strong {
      font-weight: 700;
    }

    .post-content em {
      font-style: italic;
    }

    .post-content a {
      color: var(--accent);
      text-decoration: none;
    }

    .post-content a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="container">
    <article class="post">
      <header class="post-header">
        <h1 class="post-title">Welcome to the Forum</h1>
        <div class="post-meta">Posted by <strong>Alice</strong> · Today at 10:42 AM</div>
      </header>

      <section class="post-content" id="postContent"></section>
    </article>
  </main>

  <script>
    // Example forum post content that may include formatting like bold and italic text.
    // In a real app, this could come from an API or user input after sanitization.
    const forumPostHtml = `
      <p>Hello everyone!</p>
      <p>I wanted to share an update on the project. The latest build is <strong>much faster</strong> and the new design looks <em>great</em>.</p>
      <p>Thanks to everyone who helped out. Your feedback was <strong><em>incredibly</em></strong> useful.</p>
      <p>If you have any questions, feel free to reply here.</p>
    `;

    document.getElementById('postContent').innerHTML = forumPostHtml;
  </script>
</body>
</html>
