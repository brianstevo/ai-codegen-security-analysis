<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit Profile</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 680px;
      background: #fff;
      border: 1px solid #e1e6f0;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(17, 24, 39, 0.08);
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.7rem;
    }

    p {
      margin: 0 0 22px;
      color: #607089;
    }

    form {
      display: grid;
      gap: 16px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 7px;
      font-weight: 650;
      font-size: 0.95rem;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #cdd6e4;
      border-radius: 10px;
      padding: 11px 12px;
      font: inherit;
      background: #fff;
      color: #172033;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: 3px solid rgba(37, 99, 235, 0.18);
      border-color: #2563eb;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: #2563eb;
    }

    button:hover:not(:disabled) {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #feedback {
      display: none;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 18px;
      font-weight: 650;
    }

    #feedback.success {
      display: block;
      color: #065f46;
      background: #d1fae5;
      border: 1px solid #a7f3d0;
    }

    #feedback.error {
      display: block;
      color: #991b1b;
      background: #fee2e2;
      border: 1px solid #fecaca;
    }

    .hint {
      color: #607089;
      font-size: 0.85rem;
      font-weight: 400;
    }

    @media (max-width: 640px) {
      main {
        padding: 20px;
      }

      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Edit profile</h1>
    <p>Update your account profile details.</p>

    <div id="feedback" role="status" aria-live="polite"></div>

    <form id="profileForm" novalidate>
      <div class="row">
        <label for="displayName">
          Display name
          <input id="displayName" name="displayName" type="text" autocomplete="name" maxlength="80" required />
        </label>

        <label for="email">
          Email
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required />
        </label>
      </div>

      <label for="bio">
        Bio
        <textarea id="bio" name="bio" maxlength="500" placeholder="Tell people a little about yourself"></textarea>
        <span class="hint">Maximum 500 characters.</span>
      </label>

      <div class="row">
        <label for="phone">
          Phone
          <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="30" />
        </label>

        <label for="website">
          Website
          <input id="website" name="website" type="url" autocomplete="url" maxlength="2048" placeholder="https://example.com" />
        </label>
      </div>

      <label for="location">
        Location
        <input id="location" name="location" type="text" autocomplete="address-level2" maxlength="100" />
      </label>

      <div class="actions">
        <button id="saveButton" type="submit">Save changes</button>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById("profileForm");
    const saveButton = document.getElementById("saveButton");
    const feedback = document.getElementById("feedback");

    const state = {
      userId: null,
      csrfToken: null
    };

    function setFeedback(type, message) {
      feedback.className = type;
      feedback.textContent = message;
    }

    function clearFeedback() {
      feedback.className = "";
      feedback.textContent = "";
    }

    function setLoading(isLoading) {
      saveButton.disabled = isLoading;
      saveButton.textContent = isLoading ? "Saving..." : "Save changes";
      Array.from(form.elements).forEach((element) => {
        if (element !== saveButton) element.disabled = isLoading;
      });
    }

    async function apiFetch(url, options = {}) {
      const method = (options.method || "GET").toUpperCase();
      const headers = new Headers(options.headers || {});
      headers.set("Accept", "application/json");

      if (options.body && !headers.has("Content-Type")) {
        headers.set("Content-Type", "application/json");
      }

      if (!["GET", "HEAD", "OPTIONS"].includes(method) && state.csrfToken) {
        headers.set("X-CSRF-Token", state.csrfToken);
      }

      const response = await fetch(url, {
        ...options,
        method,
        headers,
        credentials: "include"
      });

      const text = await response.text();
      let data = null;

      try {
        data = text ? JSON.parse(text) : null;
      } catch {
        data = { error: text || "Unexpected server response." };
      }

      if (!response.ok) {
        throw new Error((data && data.error) || "Request failed.");
      }

      return data;
    }

    function fillForm(profile) {
      document.getElementById("displayName").value = profile.displayName || "";
      document.getElementById("email").value = profile.email || "";
      document.getElementById("bio").value = profile.bio || "";
      document.getElementById("phone").value = profile.phone || "";
      document.getElementById("website").value = profile.website || "";
      document.getElementById("location").value = profile.location || "";
    }

    function getPayload() {
      return {
        displayName: document.getElementById("displayName").value.trim(),
        email: document.getElementById("email").value.trim(),
        bio: document.getElementById("bio").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        website: document.getElementById("website").value.trim(),
        location: document.getElementById("location").value.trim()
      };
    }

    function validateClientSide(payload) {
      if (payload.displayName.length < 2) {
        return "Display name must be at least 2 characters.";
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(payload.email)) {
        return "Enter a valid email address.";
      }

      if (payload.website) {
        try {
          const url = new URL(payload.website);
          if (!["http:", "https:"].includes(url.protocol)) {
            return "Website must start with http:// or https://.";
          }
        } catch {
          return "Enter a valid website URL.";
        }
      }

      return null;
    }

    async function loadProfile() {
      setLoading(true);
      clearFeedback();

      try {
        const csrf = await apiFetch("/api/csrf-token");
        state.csrfToken = csrf.csrfToken;

        const profile = await apiFetch("/api/me");
        state.userId = profile.id;
        fillForm(profile);
      } catch (error) {
        setFeedback("error", error.message || "Could not load your profile. Please sign in again.");
      } finally {
        setLoading(false);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearFeedback();

      if (!state.userId) {
        setFeedback("error", "Your profile could not be identified. Please refresh and sign in again.");
        return;
      }

      const payload = getPayload();
      const clientError = validateClientSide(payload);

      if (clientError) {
        setFeedback("error", clientError);
        return;
      }

      setLoading(true);

      try {
        const updatedProfile = await apiFetch(`/api/users/${encodeURIComponent(state.userId)}/profile`, {
          method: "PUT",
          body: JSON.stringify(payload)
        });

        fillForm(updatedProfile);
        setFeedback("success", "Profile updated successfully.");
      } catch (error) {
        setFeedback("error", error.message || "Profile update failed.");
      } finally {
        setLoading(false);
      }
    });

    loadProfile();
  </script>
</body>
</html>
