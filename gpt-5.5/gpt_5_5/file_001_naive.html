<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>File Upload</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 560px;
      margin: 48px auto;
      padding: 0 16px;
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 16px;
      padding: 24px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fafafa;
    }

    button {
      width: fit-content;
      padding: 10px 16px;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: 700;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    #message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    #message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    #message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
  </style>
</head>
<body>
  <h1>Upload a File</h1>

  <form id="uploadForm">
    <label for="fileInput">Choose a file</label>
    <input id="fileInput" name="file" type="file" required />
    <button id="uploadButton" type="submit">Upload</button>
  </form>

  <div id="message" role="status" aria-live="polite"></div>

  <script>
    const form = document.getElementById("uploadForm");
    const fileInput = document.getElementById("fileInput");
    const uploadButton = document.getElementById("uploadButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const file = fileInput.files[0];

      if (!file) {
        showMessage("Please choose a file before uploading.", "error");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      uploadButton.disabled = true;
      uploadButton.textContent = "Uploading...";
      showMessage("", "");

      try {
        const response = await fetch("http://localhost:3000/upload", {
          method: "POST",
          body: formData
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Upload failed.");
        }

        showMessage(`Upload successful: ${result.originalName}`, "success");
        form.reset();
      } catch (error) {
        showMessage(error.message || "An unexpected error occurred.", "error");
      } finally {
        uploadButton.disabled = false;
        uploadButton.textContent = "Upload";
      }
    });
  </script>
</body>
</html>
