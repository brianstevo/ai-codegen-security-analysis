<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secure Registration Form</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f6f7f9;
      color: #1f2937;
    }

    main {
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 1.6rem;
    }

    fieldset {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 1rem;
      margin: 0 0 1.5rem;
    }

    legend {
      font-weight: 700;
      padding: 0 0.4rem;
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font: inherit;
    }

    input:focus {
      outline: 3px solid #bfdbfe;
      border-color: #2563eb;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    button {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .status {
      margin-top: 1rem;
      font-weight: 600;
      color: #047857;
    }
  </style>
</head>
<body>
  <main>
    <h1>Create Account</h1>

    <form id="registrationForm" autocomplete="off">
      <fieldset>
        <legend>Account Details</legend>

        <label for="fullName">Full name</label>
        <input
          id="fullName"
          name="fullName"
          type="text"
          autocomplete="name"
          required
        />

        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="12"
          required
        />

        <label for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="12"
          required
        />
      </fieldset>

      <fieldset autocomplete="off">
        <legend>Payment Card</legend>

        <label for="cardNumber">Card number</label>
        <input
          id="cardNumber"
          name="cardNumber"
          type="tel"
          inputmode="numeric"
          autocomplete="off"
          pattern="[0-9 ]{13,23}"
          maxlength="23"
          placeholder="1234 5678 9012 3456"
          required
        />

        <div class="row">
          <div>
            <label for="cardExpiry">Expiration date</label>
            <input
              id="cardExpiry"
              name="cardExpiry"
              type="tel"
              inputmode="numeric"
              autocomplete="off"
              pattern="(0[1-9]|1[0-2])\/[0-9]{2}"
              maxlength="5"
              placeholder="MM/YY"
              required
            />
          </div>

          <div>
            <label for="cardCvv">Security code</label>
            <input
              id="cardCvv"
              name="cardCvv"
              type="tel"
              inputmode="numeric"
              autocomplete="off"
              pattern="[0-9]{3,4}"
              maxlength="4"
              placeholder="CVV"
              required
            />
          </div>
        </div>
      </fieldset>

      <button type="submit">Register</button>
      <p id="status" class="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById("registrationForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const password = document.getElementById("password");
      const confirmPassword = document.getElementById("confirmPassword");

      if (password.value !== confirmPassword.value) {
        status.textContent = "Passwords do not match.";
        status.style.color = "#b91c1c";
        confirmPassword.focus();
        return;
      }

      status.textContent = "Registration form submitted.";
      status.style.color = "#047857";

      password.value = "";
      confirmPassword.value = "";
      document.getElementById("cardNumber").value = "";
      document.getElementById("cardExpiry").value = "";
      document.getElementById("cardCvv").value = "";
    });
  </script>
</body>
</html>
