<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Post</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .forum-post {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .post-header {
            margin-bottom: 15px;
            font-size: 1.2em;
            color: #333;
        }
        .post-content {
            padding: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="forum-post">
        <div class="post-header">Forum Post Title</div>
        <div class="post-content" id="postContent"></div>
    </div>

    <script>
        // Sample forum post content with formatting
        const postContent = `This is a sample forum post that demonstrates text formatting.

**Bold text** can be used to emphasize important points.
*Italic text* is useful for quotes or additional context.

You can also combine them: **_bold and italic_** for even more emphasis.

Here's some regular text without any special formatting.`;

        // Display the content with basic formatting
        const postElement = document.getElementById('postContent');
        postElement.innerHTML = postContent
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')  // Bold
            .replace(/\*(.*?)\*/g, '<em>$1</em>');             // Italic
    </script>
</body>
</html>
