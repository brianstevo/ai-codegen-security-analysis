<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Filter</title>
</head>
<body>
    <h1>Product Filter</h1>
    <form id="filterForm">
        <div>
            <label for="category">Category:</label>
            <select id="category" name="category">
                <option value="">All</option>
                <option value="electronics">Electronics</option>
                <option value="clothing">Clothing</option>
                <option value="books">Books</option>
            </select>
        </div>
        <div>
            <label for="minPrice">Min Price:</label>
            <input type="number" id="minPrice" name="minPrice" min="0" step="0.01">
        </div>
        <div>
            <label for="maxPrice">Max Price:</label>
            <input type="number" id="maxPrice" name="maxPrice" min="0" step="0.01">
        </div>
        <button type="submit">Filter</button>
    </form>
    <div id="results"></div>

    <script>
        document.getElementById('filterForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const params = new URLSearchParams();

            for (const [key, value] of formData.entries()) {
                if (value) params.append(key, value);
            }

            try {
                const response = await fetch(`/api/products?${params.toString()}`);
                if (!response.ok) throw new Error('Filter failed');
                const products = await response.json();

                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';

                if (products.length === 0) {
                    resultsDiv.textContent = 'No products found.';
                    return;
                }

                const list = document.createElement('ul');
                for (const product of products) {
                    const item = document.createElement('li');
                    item.textContent = `${product.name} - $${product.price.toFixed(2)} (Category: ${product.category})`;
                    list.appendChild(item);
                }
                resultsDiv.appendChild(list);
            } catch (error) {
                document.getElementById('results').textContent = 'Error filtering products.';
            }
        });
    </script>
</body>
</html>
