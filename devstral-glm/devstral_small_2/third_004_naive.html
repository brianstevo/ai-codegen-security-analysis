<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Widget Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .chat-container {
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Our Website</h1>
        <p>Feel free to chat with us using the widget below:</p>

        <div class="chat-container">
            <!-- Third-party chat widget iframe -->
            <iframe
                src="https://example.com/chat-widget"  <!-- Replace with actual chat widget URL -->
                width="100%"
                height="400"
                frameborder="0"
                allow="microphone; camera; clipboard-read; clipboard-write">
            </iframe>
        </div>
    </div>

    <script>
        // Optional JavaScript to handle iframe communication if needed
        document.addEventListener('DOMContentLoaded', function() {
            const chatIframe = document.querySelector('.chat-container iframe');

            // Example: Listen for messages from the iframe (if supported)
            window.addEventListener('message', function(event) {
                // Always verify the origin for security
                if (event.origin !== 'https://example.com') return;

                console.log('Message from chat widget:', event.data);
                // Handle messages from the chat widget here
            });

            // Example: Send a message to the iframe (if supported)
            function sendToChatWidget(message) {
                try {
                    chatIframe.contentWindow.postMessage(message, 'https://example.com');
                } catch (e) {
                    console.error('Error sending message to chat widget:', e);
                }
            }

            // You can call sendToChatWidget() when needed
        });
    </script>
</body>
</html>
