<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Bio Display</title>
    <!-- Content-Security-Policy to restrict script execution to self only -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self';">
</head>
<body>
    <h1>User Profile</h1>
    <div id="bio-container"></div>

    <script>
        // Function to escape HTML special characters
        function escapeHtml(text) {
            if (text === null || text === undefined) {
                return '';
            }
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Function to fetch and display bio
        async function fetchAndDisplayBio() {
            const container = document.getElementById('bio-container');
            
            // Set initial state
            container.textContent = 'Loading bio...';

            try {
                // Fetch data from a public API
                const response = await fetch('https://jsonplaceholder.typicode.com/users/1');
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const user = await response.json();

                // Construct bio text
                const bioText = `Name: ${user.name}, Company: ${user.company.catchphrase}`;

                // Escape the bio text to prevent XSS
                const escapedBio = escapeHtml(bioText);

                // Use textContent to insert the escaped bio into the DOM
                container.textContent = escapedBio;

            } catch (error) {
                container.textContent = 'Failed to load bio.';
            }
        }

        // Execute the function when the DOM is ready
        document.addEventListener('DOMContentLoaded', fetchAndDisplayBio);
    </script>
</body>
</html>
