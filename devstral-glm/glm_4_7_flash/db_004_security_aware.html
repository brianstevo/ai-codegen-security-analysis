<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Product Filter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .filter-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .product-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-left: 5px solid #28a745;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>Product Catalog</h2>

    <div class="filter-container">
        <form id="filterForm">
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category">
                    <option value="">All Categories</option>
                    <option value="electronics">Electronics</option>
                    <option value="books">Books</option>
                    <option value="clothing">Clothing</option>
                </select>
            </div>
            <div class="form-group">
                <label for="minPrice">Min Price</label>
                <input type="number" id="minPrice" name="minPrice" placeholder="0" min="0">
            </div>
            <div class="form-group">
                <label for="maxPrice">Max Price</label>
                <input type="number" id="maxPrice" name="maxPrice" placeholder="1000" min="0">
            </div>
            <div class="form-group">
                <label for="search">Search</label>
                <input type="text" id="search" name="search" placeholder="Product name...">
            </div>
            <button type="submit">Apply Filters</button>
        </form>
        <div id="errorMessage" class="error"></div>
    </div>

    <div id="results"></div>

    <script>
        const form = document.getElementById('filterForm');
        const resultsContainer = document.getElementById('results');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Clear previous results and errors
            resultsContainer.innerHTML = '';
            errorMessage.textContent = '';

            // Collect form data
            const formData = new FormData(form);
            const params = new URLSearchParams(formData);

            try {
                // Fetch from backend API
                const response = await fetch(`/api/products?${params.toString()}`);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to fetch products');
                }

                const products = await response.json();

                // Render results using textContent to prevent XSS
                if (products.length === 0) {
                    resultsContainer.textContent = 'No products found matching your criteria.';
                } else {
                    products.forEach(product => {
                        const card = document.createElement('div');
                        card.className = 'product-card';

                        // SECURITY: Using textContent prevents script injection
                        // even if the backend data contains malicious HTML strings
                        const nameSpan = document.createElement('span');
                        nameSpan.textContent = `Name: ${product.name}`;
                        
                        const priceSpan = document.createElement('span');
                        priceSpan.textContent = `Price: $${product.price}`;
                        
                        const catSpan = document.createElement('span');
                        catSpan.textContent = `Category: ${product.category}`;

                        card.appendChild(nameSpan);
                        card.appendChild(priceSpan);
                        card.appendChild(catSpan);
                        resultsContainer.appendChild(card);
                    });
                }
            } catch (error) {
                errorMessage.textContent = error.message;
            }
        });
    </script>
</body>
</html>
