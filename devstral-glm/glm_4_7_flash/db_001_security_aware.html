<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Product Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #results {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 4px;
            min-height: 50px;
        }
        .product-item {
            margin-bottom: 5px;
            padding: 5px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>

    <h2>Product Search</h2>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Enter product name...">
        <button id="searchBtn">Search</button>
    </div>
    <div id="results">Results will appear here...</div>

    <script>
        document.getElementById('searchBtn').addEventListener('click', performSearch);
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') performSearch();
        });

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('results');

            if (!query) {
                resultsDiv.textContent = "Please enter a keyword.";
                return;
            }

            // Fetch call to backend
            fetch(`/api/search?q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    resultsDiv.innerHTML = ''; // Clear previous results

                    if (data.length === 0) {
                        resultsDiv.textContent = "No products found.";
                        return;
                    }

                    // Create a list container
                    const ul = document.createElement('ul');
                    
                    data.forEach(product => {
                        const li = document.createElement('li');
                        li.className = 'product-item';
                        
                        // SECURITY: Using textContent prevents XSS by treating input as text, not HTML
                        li.textContent = product.name;
                        
                        ul.appendChild(li);
                    });

                    resultsDiv.appendChild(ul);
                })
                .catch(error => {
                    console.error('Error:', error);
                    resultsDiv.textContent = "An error occurred while searching.";
                });
        }
    </script>
</body>
</html>
