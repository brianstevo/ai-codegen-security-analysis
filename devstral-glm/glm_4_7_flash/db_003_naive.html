<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment Feature</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .comment { border-bottom: 1px solid #eee; padding: 10px 0; }
        .comment strong { display: block; }
        form { margin-top: 20px; }
        textarea { width: 100%; height: 80px; margin-bottom: 10px; }
        button { padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Comments</h2>
    <div id="comments-list">
        <div class="comment"><strong>System:</strong> No comments yet.</div>
    </div>

    <form id="comment-form">
        <textarea id="comment-text" placeholder="Write a comment..." required></textarea>
        <button type="submit">Post Comment</button>
    </form>

    <script>
        const form = document.getElementById('comment-form');
        const list = document.getElementById('comments-list');
        const textarea = document.getElementById('comment-text');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = textarea.value;

            try {
                const response = await fetch('/api/comments', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content })
                });

                if (!response.ok) throw new Error('Network response was not ok');

                const newComment = await response.json();

                // Append the new comment to the page
                const commentDiv = document.createElement('div');
                commentDiv.className = 'comment';
                commentDiv.innerHTML = `<strong>User:</strong> ${escapeHtml(newComment.content)}`;
                
                // Insert at the top of the list
                list.insertBefore(commentDiv, list.firstChild);
                
                textarea.value = '';
            } catch (error) {
                console.error('Error posting comment:', error);
            }
        });

        // Basic XSS protection
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
