<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Log Viewer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; max-width: 900px; }
    h1 { margin-bottom: 1rem; }
    .row { margin-bottom: 1rem; display: flex; gap: 0.75rem; align-items: center; }
    select, button { padding: 0.5rem; font-size: 1rem; }
    #status { margin: 0.5rem 0 1rem; min-height: 1.2rem; color: #333; }
    pre {
      background: #111;
      color: #eaeaea;
      padding: 1rem;
      border-radius: 8px;
      overflow: auto;
      max-height: 70vh;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>Secure Admin Log Viewer</h1>

  <div class="row">
    <label for="logSelect">Log file:</label>
    <select id="logSelect" aria-label="Select log file">
      <option value="app.log">app.log</option>
      <option value="error.log">error.log</option>
      <option value="access.log">access.log</option>
      <option value="audit.log">audit.log</option>
    </select>
    <button id="loadBtn" type="button">Load Log</button>
  </div>

  <div id="status" role="status" aria-live="polite"></div>
  <pre id="logOutput">Select a log file and click "Load Log".</pre>

  <script>
    (function () {
      const loadBtn = document.getElementById('loadBtn');
      const logSelect = document.getElementById('logSelect');
      const statusEl = document.getElementById('status');
      const outputEl = document.getElementById('logOutput');

      async function loadLog() {
        const file = logSelect.value;
        statusEl.textContent = 'Loading...';
        outputEl.textContent = '';

        try {
          const res = await fetch('/api/admin/logs/view', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ file })
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            statusEl.textContent = data.error || 'Failed to load log.';
            outputEl.textContent = '';
            return;
          }

          statusEl.textContent = `Loaded: ${data.file}`;
          outputEl.textContent = typeof data.content === 'string' ? data.content : '';
        } catch (err) {
          statusEl.textContent = 'Network or server error while loading log.';
          outputEl.textContent = '';
        }
      }

      loadBtn.addEventListener('click', loadLog);
    })();
  </script>
</body>
</html>
