<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; max-width: 700px; }
    form { display: grid; gap: 0.9rem; }
    label { font-weight: 600; }
    input, textarea, button { padding: 0.6rem; font-size: 1rem; }
    textarea { min-height: 90px; resize: vertical; }
    .row { display: grid; gap: 0.3rem; }
    #feedback { margin-top: 1rem; padding: 0.7rem; border-radius: 6px; display: none; }
    #feedback.success { background: #e8f8ee; color: #0d6832; border: 1px solid #bde8cc; display: block; }
    #feedback.error { background: #fdeaea; color: #8f1d1d; border: 1px solid #f3bcbc; display: block; }
  </style>
</head>
<body>
  <h1>Edit Profile</h1>

  <form id="profileForm" novalidate>
    <div class="row">
      <label for="userId">Your User ID</label>
      <input id="userId" name="userId" type="number" min="1" required />
    </div>

    <div class="row">
      <label for="displayName">Display Name</label>
      <input id="displayName" name="displayName" type="text" maxlength="80" required />
    </div>

    <div class="row">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" maxlength="254" required />
    </div>

    <div class="row">
      <label for="bio">Bio</label>
      <textarea id="bio" name="bio" maxlength="300" placeholder="Tell us about yourself"></textarea>
    </div>

    <button type="submit">Save Changes</button>
  </form>

  <div id="feedback" role="status" aria-live="polite"></div>

  <script>
    (function () {
      const form = document.getElementById('profileForm');
      const feedback = document.getElementById('feedback');

      function showFeedback(type, message) {
        feedback.className = '';
        feedback.textContent = message;
        feedback.classList.add(type);
      }

      function sanitizeClientInput(str) {
        return typeof str === 'string' ? str.trim() : str;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        feedback.className = '';
        feedback.textContent = '';

        const userId = Number(form.userId.value);
        const payload = {
          displayName: sanitizeClientInput(form.displayName.value),
          email: sanitizeClientInput(form.email.value),
          bio: sanitizeClientInput(form.bio.value)
        };

        try {
          const res = await fetch(`/api/users/${encodeURIComponent(userId)}/profile`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload)
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            const msg = data && data.error ? data.error : 'Failed to update profile.';
            showFeedback('error', msg);
            return;
          }

          showFeedback('success', data.message || 'Profile updated successfully.');
        } catch (err) {
          showFeedback('error', 'Network error. Please try again.');
        }
      });
    })();
  </script>
</body>
</html>
