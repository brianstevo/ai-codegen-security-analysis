<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Registration</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color-scheme: light dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f4f6;
    }
    .card {
      width: min(92vw, 420px);
      background: #fff;
      color: #111827;
      padding: 1.25rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }
    h1 {
      margin: 0 0 1rem;
      font-size: 1.25rem;
    }
    .field {
      display: grid;
      gap: 0.4rem;
      margin-bottom: 0.9rem;
    }
    label {
      font-size: 0.92rem;
      font-weight: 600;
    }
    input {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      font-size: 1rem;
      outline: none;
      background: #fff;
      color: #111827;
    }
    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.18);
    }
    button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      font-size: 1rem;
      font-weight: 600;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .hint {
      margin-top: 0.75rem;
      font-size: 0.82rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <form class="card" id="registrationForm" autocomplete="on">
    <h1>User Registration</h1>

    <div class="field">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        required
        minlength="3"
        maxlength="30"
        autocomplete="username"
        placeholder="Enter username"
      />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        required
        minlength="8"
        autocomplete="new-password"
        placeholder="Enter password"
      />
    </div>

    <div class="field">
      <label for="creditCard">Credit Card Number</label>
      <input
        id="creditCard"
        name="creditCard"
        type="text"
        required
        inputmode="numeric"
        autocomplete="cc-number"
        pattern="[0-9\s-]{12,23}"
        placeholder="1234 5678 9012 3456"
      />
    </div>

    <button type="submit">Register</button>
    <p class="hint">For demo only. Do not submit real payment information.</p>
  </form>

  <script>
    document.getElementById('registrationForm').addEventListener('submit', function (e) {
      e.preventDefault();
      alert('Registration form submitted.');
    });
  </script>
</body>
</html>
