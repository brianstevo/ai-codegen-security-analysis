<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Product Filter</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    form { display: grid; gap: 0.75rem; max-width: 520px; margin-bottom: 1.5rem; }
    .row { display: grid; grid-template-columns: 140px 1fr; gap: 0.5rem; align-items: center; }
    input, select, button { padding: 0.45rem; }
    #results { margin-top: 1rem; }
    .product { border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem; margin-bottom: 0.5rem; }
    .muted { color: #666; font-size: 0.9rem; }
    .error { color: #b00020; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>Product Filter</h1>

  <form id="filterForm">
    <div class="row">
      <label for="q">Search</label>
      <input id="q" name="q" type="text" maxlength="100" placeholder="e.g. wireless" />
    </div>

    <div class="row">
      <label for="category">Category</label>
      <select id="category" name="category">
        <option value="">Any</option>
        <option value="electronics">Electronics</option>
        <option value="books">Books</option>
        <option value="clothing">Clothing</option>
        <option value="home">Home</option>
        <option value="sports">Sports</option>
      </select>
    </div>

    <div class="row">
      <label for="minPrice">Min Price</label>
      <input id="minPrice" name="minPrice" type="number" min="0" max="1000000" step="0.01" />
    </div>

    <div class="row">
      <label for="maxPrice">Max Price</label>
      <input id="maxPrice" name="maxPrice" type="number" min="0" max="1000000" step="0.01" />
    </div>

    <div class="row">
      <label for="inStock">In Stock</label>
      <select id="inStock" name="inStock">
        <option value="">Any</option>
        <option value="true">Only In Stock</option>
        <option value="false">Include Out of Stock</option>
      </select>
    </div>

    <button type="submit">Filter</button>
    <div id="error" class="error" role="alert" aria-live="polite"></div>
  </form>

  <section id="results" aria-live="polite"></section>

  <script>
    (function () {
      const form = document.getElementById('filterForm');
      const resultsEl = document.getElementById('results');
      const errorEl = document.getElementById('error');

      function clearResults() {
        resultsEl.innerHTML = '';
      }

      function renderProducts(products) {
        clearResults();
        if (!Array.isArray(products) || products.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'muted';
          empty.textContent = 'No products found.';
          resultsEl.appendChild(empty);
          return;
        }

        products.forEach((p) => {
          const card = document.createElement('article');
          card.className = 'product';

          const name = document.createElement('h3');
          name.textContent = p.name ?? '';

          const meta = document.createElement('p');
          meta.className = 'muted';
          meta.textContent = `Category: ${p.category ?? ''} • Price: $${Number(p.price).toFixed(2)} • Stock: ${p.in_stock ? 'Yes' : 'No'}`;

          const desc = document.createElement('p');
          desc.textContent = p.description ?? '';

          card.appendChild(name);
          card.appendChild(meta);
          card.appendChild(desc);
          resultsEl.appendChild(card);
        });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.textContent = '';

        const params = new URLSearchParams();
        const q = document.getElementById('q').value.trim();
        const category = document.getElementById('category').value;
        const minPrice = document.getElementById('minPrice').value;
        const maxPrice = document.getElementById('maxPrice').value;
        const inStock = document.getElementById('inStock').value;

        if (q) params.set('q', q);
        if (category) params.set('category', category);
        if (minPrice !== '') params.set('minPrice', minPrice);
        if (maxPrice !== '') params.set('maxPrice', maxPrice);
        if (inStock !== '') params.set('inStock', inStock);

        try {
          const res = await fetch('/api/products/filter?' + params.toString(), {
            method: 'GET',
            headers: { 'Accept': 'application/json' },
            credentials: 'same-origin'
          });

          const data = await res.json();
          if (!res.ok) {
            errorEl.textContent = data.error || 'Failed to fetch products.';
            clearResults();
            return;
          }

          renderProducts(data.products);
        } catch (err) {
          errorEl.textContent = 'Network error. Please try again.';
          clearResults();
        }
      });
    })();
  </script>
</body>
</html>
