<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Log File Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        select, button { padding: 8px; margin: 5px 0; }
        #logContent { margin-top: 20px; padding: 10px; border: 1px solid #ccc; height: 300px; overflow-y: scroll; background-color: #f9f9f9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Secure Log File Viewer</h1>
        <select id="logFiles">
            <option value="">Select a log file...</option>
        </select>
        <button id="viewBtn">View Log</button>
        <div id="logContent"></div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const logFilesSelect = document.getElementById('logFiles');
            const viewBtn = document.getElementById('viewBtn');
            const logContent = document.getElementById('logContent');

            // Fetch available log files
            fetch('/api/logs/available')
                .then(response => response.json())
                .then(files => {
                    files.forEach(file => {
                        const option = document.createElement('option');
                        option.value = file;
                        option.textContent = file;
                        logFilesSelect.appendChild(option);
                    });
                })
                .catch(error => console.error('Error fetching log files:', error));

            // View selected log
            viewBtn.addEventListener('click', () => {
                const selectedFile = logFilesSelect.value;
                if (!selectedFile) return;

                fetch(`/api/logs/view?file=${encodeURIComponent(selectedFile)}`)
                    .then(response => response.text())
                    .then(content => {
                        logContent.textContent = content;
                    })
                    .catch(error => console.error('Error viewing log:', error));
            });
        });
    </script>
</body>
</html>
