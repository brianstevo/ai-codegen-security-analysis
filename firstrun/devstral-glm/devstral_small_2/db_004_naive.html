<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Filter</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .filter-form { margin-bottom: 20px; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { border: 1px solid #ddd; padding: 15px; border-radius: 5px; }
        .product-card img { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <h1>Product Filter</h1>
    <div class="filter-form">
        <form id="filterForm">
            <label for="category">Category:</label>
            <select id="category" name="category">
                <option value="">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Books">Books</option>
            </select>

            <label for="minPrice">Min Price:</label>
            <input type="number" id="minPrice" name="minPrice" min="0" step="0.01">

            <label for="maxPrice">Max Price:</label>
            <input type="number" id="maxPrice" name="maxPrice" min="0" step="0.01">

            <button type="submit">Filter Products</button>
        </form>
    </div>

    <div class="product-grid" id="productGrid">
        <!-- Products will be rendered here -->
    </div>

    <script>
        document.getElementById('filterForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const category = document.getElementById('category').value;
            const minPrice = document.getElementById('minPrice').value || 0;
            const maxPrice = document.getElementById('maxPrice').value || Infinity;

            try {
                const response = await fetch('/api/products/filter', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category, minPrice, maxPrice })
                });

                if (!response.ok) throw new Error('Failed to fetch products');

                const products = await response.json();
                renderProducts(products);
            } catch (error) {
                console.error('Error:', error);
                alert('Error fetching products');
            }
        });

        function renderProducts(products) {
            const productGrid = document.getElementById('productGrid');
            productGrid.innerHTML = '';

            if (products.length === 0) {
                productGrid.innerHTML = '<p>No products found matching your criteria.</p>';
                return;
            }

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <h3>${product.name}</h3>
                    <img src="${product.image}" alt="${product.name}">
                    <p>Category: ${product.category}</p>
                    <p>$${product.price.toFixed(2)}</p>
                `;
                productGrid.appendChild(card);
            });
        }
    </script>
</body>
</html>
