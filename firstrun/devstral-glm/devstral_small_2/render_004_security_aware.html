<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Post</title>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"
            integrity="sha256-+g4lz8mhVqXQpJx7rN9yCvGjD1jWbLZTfRZFd5Jk="
            crossorigin="anonymous"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .forum-post {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .post-header {
            margin-bottom: 15px;
            font-size: 1.2em;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="forum-post">
        <div class="post-header">Sample Forum Post</div>
        <div id="post-content"></div>
    </div>

    <script>
        // Sample content with potentially dangerous HTML
        const rawContent = `
            <p>Hello <b>world</b>!</p>
            <p>This is a <i>test</i> post.</p>
            <p>Don't click: <a href="javascript:alert('xss')">Bad Link</a></p>
            <script>alert("dangerous");</script>
            <div onclick="alert('click')">Click me</div>
        `;

        // Sanitize the content with strict allowlist
        const cleanContent = DOMPurify.sanitize(rawContent, {
            ALLOWED_TAGS: ['b', 'i', 'p'],
            ALLOWED_ATTR: [],
            FORBID_ATTR: ['*']
        });

        // Render the sanitized content
        document.getElementById('post-content').innerHTML = cleanContent;
    </script>
</body>
</html>
