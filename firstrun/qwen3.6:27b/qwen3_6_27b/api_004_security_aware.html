<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input, textarea { width: 100%; padding: 0.5rem; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 0.75rem 1.5rem; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #0056b3; }
        .feedback { margin-top: 1rem; padding: 1rem; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <h1>Edit Profile</h1>
    
    <form id="profileForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required minlength="3" maxlength="50">
        </div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" maxlength="500"></textarea>
        </div>

        <button type="submit">Save Changes</button>
    </form>

    <div id="feedback" class="feedback"></div>

    <script>
        const form = document.getElementById('profileForm');
        const feedback = document.getElementById('feedback');

        // Mocking a token for demonstration. In production, this comes from auth flow.
        const authToken = 'mock-jwt-token-12345'; 

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reset feedback
            feedback.style.display = 'none';
            feedback.className = 'feedback';

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    feedback.textContent = result.message || 'Profile updated successfully!';
                    feedback.classList.add('success');
                } else {
                    throw new Error(result.message || 'An error occurred while updating profile.');
                }
            } catch (error) {
                feedback.textContent = error.message;
                feedback.classList.add('error');
            } finally {
                feedback.style.display = 'block';
            }
        });
    </script>
</body>
</html>
