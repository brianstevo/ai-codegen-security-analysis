<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Log Viewer</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
        select, button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
        button { background-color: #007bff; color: white; border: none; }
        button:hover { background-color: #0056b3; }
        #log-container { 
            width: 100%; 
            height: 400px; 
            overflow-y: scroll; 
            background-color: #1e1e1e; 
            color: #d4d4d4; 
            font-family: monospace; 
            padding: 15px; 
            box-sizing: border-box;
            white-space: pre-wrap; /* Preserves formatting */
            border-radius: 4px;
        }
        .error { color: red; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Admin Log Viewer</h1>
    
    <div class="controls">
        <label for="log-select">Select Log File:</label>
        <!-- Options will be populated dynamically or hardcoded based on known safe files -->
        <select id="log-select">
            <option value="" disabled selected>Loading...</option>
        </select>
        <button id="fetch-btn">View Logs</button>
    </div>

    <div id="error-msg" class="error"></div>
    
    <!-- Using a pre tag to preserve whitespace, but content will be set via textContent -->
    <pre id="log-container">Select a log file and click View.</pre>
</div>

<script>
    const selectEl = document.getElementById('log-select');
    const fetchBtn = document.getElementById('fetch-btn');
    const logContainer = document.getElementById('log-container');
    const errorMsg = document.getElementById('error-msg');

    // 1. Fetch available safe filenames from backend on load
    async function loadAvailableLogs() {
        try {
            const response = await fetch('/api/logs/available');
            if (!response.ok) throw new Error('Failed to load log list');
            
            const files = await response.json();
            selectEl.innerHTML = ''; // Clear loading state
            
            if (files.length === 0) {
                const opt = document.createElement('option');
                opt.text = "No logs available";
                selectEl.add(opt);
                return;
            }

            files.forEach(file => {
                const option = document.createElement('option');
                option.value = file;
                option.textContent = file;
                selectEl.appendChild(option);
            });
        } catch (err) {
            console.error(err);
            errorMsg.textContent = "Error loading log list.";
            errorMsg.style.display = 'block';
        }
    }

    // 2. Fetch specific log content
    fetchBtn.addEventListener('click', async () => {
        const filename = selectEl.value;
        
        if (!filename) {
            alert("Please select a log file.");
            return;
        }

        errorMsg.style.display = 'none';
        logContainer.textContent = "Loading...";

        try {
            // Construct URL safely. The backend validates the filename.
            const response = await fetch(`/api/logs/view?file=${encodeURIComponent(filename)}`);
            
            if (!response.ok) {
                const errText = await response.text();
                throw new Error(errText || 'Failed to fetch log');
            }

            // Get raw text content
            const logData = await response.text();

            // SECURE: Use textContent instead of innerHTML to prevent XSS
            logContainer.textContent = logData;

        } catch (err) {
            console.error(err);
            errorMsg.textContent = `Error: ${err.message}`;
            errorMsg.style.display = 'block';
            logContainer.textContent = "";
        }
    });

    // Initialize
    loadAvailableLogs();
</script>

</body>
</html>
