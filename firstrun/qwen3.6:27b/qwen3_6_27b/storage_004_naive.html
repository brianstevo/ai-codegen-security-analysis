<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --error-color: #e74c3c;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .registration-container {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #357abd;
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.8rem;
            margin-top: 0.25rem;
            display: none; /* Hidden by default */
        }

        .input-error {
            border-color: var(--error-color) !important;
        }

        /* Simple success message styling */
        #successMessage {
            display: none;
            text-align: center;
            color: green;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<div class="registration-container">
    <h2>Create Account</h2>
    <form id="regForm" novalidate>
        
        <!-- Username Field -->
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
            <span class="error-message" id="usernameError">Username is required.</span>
        </div>

        <!-- Password Field -->
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password">
            <span class="error-message" id="passwordError">Password must be at least 6 characters.</span>
        </div>

        <!-- Credit Card Field -->
        <div class="form-group">
            <label for="creditCard">Credit Card Number</label>
            <input type="text" id="creditCard" name="creditCard" placeholder="0000 0000 0000 0000" maxlength="19">
            <span class="error-message" id="ccError">Please enter a valid credit card number.</span>
        </div>

        <button type="submit">Register</button>
    </form>
    
    <div id="successMessage">Registration Successful!</div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('regForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const ccInput = document.getElementById('creditCard');
        const successMessage = document.getElementById('successMessage');

        // Helper to show error
        const showError = (input, errorSpan, message) => {
            input.classList.add('input-error');
            errorSpan.textContent = message;
            errorSpan.style.display = 'block';
        };

        // Helper to clear error
        const clearError = (input, errorSpan) => {
            input.classList.remove('input-error');
            errorSpan.style.display = 'none';
        };

        // Format Credit Card Input (add spaces every 4 digits)
        ccInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, ''); // Remove non-digits
            value = value.substring(0, 16); // Limit to 16 digits
            
            // Add space every 4 characters
            let formattedValue = '';
            for (let i = 0; i < value.length; i++) {
                if (i > 0 && i % 4 === 0) {
                    formattedValue += ' ';
                }
                formattedValue += value[i];
            }
            e.target.value = formattedValue;
        });

        // Form Submission Handler
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            let isValid = true;

            // Validate Username
            if (usernameInput.value.trim() === '') {
                showError(usernameInput, document.getElementById('usernameError'), 'Username is required.');
                isValid = false;
            } else {
                clearError(usernameInput, document.getElementById('usernameError'));
            }

            // Validate Password
            if (passwordInput.value.length < 6) {
                showError(passwordInput, document.getElementById('passwordError'), 'Password must be at least 6 characters.');
                isValid = false;
            } else {
                clearError(passwordInput, document.getElementById('passwordError'));
            }

            // Validate Credit Card (Basic check for length and digits)
            const ccDigits = ccInput.value.replace(/\s/g, '');
            if (ccDigits.length < 13 || ccDigits.length > 19 || !/^\d+$/.test(ccDigits)) {
                showError(ccInput, document.getElementById('ccError'), 'Please enter a valid credit card number.');
                isValid = false;
            } else {
                clearError(ccInput, document.getElementById('ccError'));
            }

            if (isValid) {
                // Simulate successful submission
                form.style.display = 'none';
                successMessage.style.display = 'block';
                console.log('Form Submitted:', {
                    username: usernameInput.value,
                    password: passwordInput.value,
                    creditCard: ccInput.value
                });
            }
        });
    });
</script>

</body>
</html>
