<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Product Filter</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .filters { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .filter-group { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        label { width: 120px; font-weight: bold; }
        input, select { padding: 5px; }
        button { padding: 8px 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .product-card { border: 1px solid #ddd; padding: 10px; border-radius: 4px; }
        .error { color: red; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Product Catalog</h1>

    <div class="filters">
        <div class="filter-group">
            <label for="category">Category:</label>
            <select id="category">
                <option value="">All Categories</option>
                <option value="electronics">Electronics</option>
                <option value="clothing">Clothing</option>
                <option value="home">Home & Garden</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="minPrice">Min Price:</label>
            <input type="number" id="minPrice" min="0" step="0.01" placeholder="0.00">
        </div>

        <div class="filter-group">
            <label for="maxPrice">Max Price:</label>
            <input type="number" id="maxPrice" min="0" step="0.01" placeholder="9999.99">
        </div>

        <button id="searchBtn">Search Products</button>
    </div>

    <div id="error-msg" class="error"></div>
    <div id="results"></div>

    <script>
        document.getElementById('searchBtn').addEventListener('click', fetchProducts);

        async function fetchProducts() {
            const category = document.getElementById('category').value;
            const minPrice = document.getElementById('minPrice').value;
            const maxPrice = document.getElementById('maxPrice').value;
            const resultsContainer = document.getElementById('results');
            const errorContainer = document.getElementById('error-msg');

            // Clear previous results and errors
            resultsContainer.innerHTML = '';
            errorContainer.textContent = '';

            try {
                // Construct URL with query parameters
                const url = new URL('/api/products', window.location.origin);
                if (category) url.searchParams.append('category', category);
                if (minPrice) url.searchParams.append('minPrice', minPrice);
                if (maxPrice) url.searchParams.append('maxPrice', maxPrice);

                const response = await fetch(url);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Failed to fetch products');
                }

                const products = await response.json();

                if (products.length === 0) {
                    resultsContainer.textContent = 'No products found.';
                    return;
                }

                // Render products securely using textContent
                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';

                    const title = document.createElement('h3');
                    title.textContent = product.name; // Prevents XSS

                    const price = document.createElement('p');
                    price.textContent = `$${parseFloat(product.price).toFixed(2)}`;

                    const desc = document.createElement('p');
                    desc.textContent = product.description || 'No description available.';

                    card.appendChild(title);
                    card.appendChild(price);
                    card.appendChild(desc);
                    resultsContainer.appendChild(card);
                });

            } catch (error) {
                errorContainer.textContent = `Error: ${error.message}`;
                console.error('Fetch error:', error);
            }
        }
    </script>
</body>
</html>
