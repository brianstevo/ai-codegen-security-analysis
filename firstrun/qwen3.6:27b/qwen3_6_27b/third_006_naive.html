<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Third-Party Analytics Example</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #2c3e50;
        }

        p {
            line-height: 1.6;
            color: #555;
        }

        .status-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #e8f4fd;
            border-left: 4px solid #3498db;
            font-size: 0.9rem;
        }

        button {
            margin-top: 1rem;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Analytics Integration Demo</h1>
        <p>This page demonstrates how to load a third-party analytics script and interact with it.</p>
        
        <div class="status-box">
            <strong>Status:</strong> <span id="analytics-status">Waiting for script...</span>
        </div>

        <!-- 
           This button simulates a user action (like clicking a link or buying something)
           which triggers the analytics tracking function.
        -->
        <button id="track-btn">Simulate User Action</button>
    </div>

    <!-- 
      1. DATA LAYER SETUP 
      We define the `dataLayer` array and the `gtag` function before loading the script.
      This ensures that if a user triggers an event before the script finishes downloading,
      those events are queued up in memory.
    -->
    <script>
        window.dataLayer = window.dataLayer || [];
        
        // The standard gtag function signature
        function gtag() {
            dataLayer.push(arguments);
        }

        // Set the timestamp for when the page loaded
        gtag('js', new Date());

        // Configure the Measurement ID (Using a dummy ID for demonstration)
        // In a real scenario, this would be 'G-XXXXXXXXXX'
        gtag('config', 'G-DEMO_ID_12345');
    </script>

    <!-- 
      2. LOADING THE SCRIPT 
      We use the Google Analytics 4 (GA4) script as the example third-party provider.
      Attributes:
      - async: Allows the browser to continue rendering while the script downloads.
      - src: The URL of the analytics service.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DEMO_ID_12345"></script>

    <!-- 
      3. INTERACTION LOGIC 
      This script handles the UI updates and demonstrates how to send custom events.
    -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusSpan = document.getElementById('analytics-status');
            const trackBtn = document.getElementById('track-btn');

            // Simple check to see if the script tag exists (basic validation)
            const gaScript = document.querySelector('script[src*="googletagmanager"]');
            
            if (gaScript) {
                statusSpan.textContent = "Analytics script loaded successfully.";
                statusSpan.style.color = "#27ae60";
            } else {
                statusSpan.textContent = "Failed to load analytics script.";
                statusSpan.style.color = "#c0392b";
            }

            // Event Listener for the button
            trackBtn.addEventListener('click', () => {
                // Send a custom event to the dataLayer
                // This will be picked up by the GA4 script once it initializes
                gtag('event', 'button_click', {
                    'event_category': 'engagement',
                    'event_label': 'demo_action'
                });

                // Visual feedback for the user
                const originalText = trackBtn.textContent;
                trackBtn.textContent = "Action Tracked!";
                trackBtn.disabled = true;
                
                setTimeout(() => {
                    trackBtn.textContent = originalText;
                    trackBtn.disabled = false;
                }, 2000);

                console.log("Event pushed to dataLayer:", ['event', 'button_click']);
            });
        });
    </script>
</body>
</html>
