<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure User Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .error {
            color: red;
            font-size: 0.9em;
            margin-top: 5px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h2>Register New Account</h2>
    <form id="registrationForm" method="POST">
        <!-- CSRF Token (hidden field) -->
        <input type="hidden" name="_csrf" value="{{ csrfToken }}">
        
        <div class="form-group">
            <label for="username">Username:</label>
            <input 
                type="text" 
                id="username" 
                name="username" 
                required 
                minlength="3" 
                maxlength="20"
                placeholder="Enter username (3-20 characters)"
            >
            <div class="error" id="usernameError"></div>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                required 
                placeholder="Enter email"
            >
            <div class="error" id="emailError"></div>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                required 
                minlength="8"
                maxlength="128"
                placeholder="Enter password (min 8 chars, must include uppercase, lowercase, number, special char)"
            >
            <div class="error" id="passwordError"></div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password:</label>
            <input 
                type="password" 
                id="confirmPassword" 
                name="confirmPassword" 
                required 
                placeholder="Re-enter password"
            >
            <div class="error" id="confirmPasswordError"></div>
        </div>

        <button type="submit">Register</button>
    </form>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Clear previous errors
            document.querySelectorAll('.error').forEach(el => el.textContent = '');
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            let hasError = false;

            // Validate username
            if (username.length < 3 || username.length > 20) {
                document.getElementById('usernameError').textContent = 'Username must be between 3 and 20 characters';
                hasError = true;
            }

            // Validate email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('emailError').textContent = 'Please enter a valid email address';
                hasError = true;
            }

            // Validate password complexity (min 8 chars, uppercase, lowercase, number, special char)
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;
            if (!passwordRegex.test(password)) {
                document.getElementById('passwordError').textContent = 'Password must be at least 8 characters and include uppercase, lowercase, number, and special character';
                hasError = true;
            }

            // Validate password confirmation
            if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Passwords do not match';
                hasError = true;
            }

            if (!hasError) {
                // Submit form via fetch to prevent page reload
                const formData = new FormData(this);
                
                fetch('/api/register', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRF-Token': document.querySelector('input[name="_csrf"]').value
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('Registration successful!');
                        // Optionally redirect or clear form
                        this.reset();
                    } else {
                        // Display server-side errors
                        if (data.errors) {
                            data.errors.forEach(error => {
                                const field = error.field;
                                const message = error.message;
                                document.getElementById(field + 'Error').textContent = message;
                            });
                        }
                    }
                })
                .catch(err => {
                    console.error('Registration failed:', err);
                    alert('An error occurred during registration. Please try again.');
                });
            }
        });
    </script>
</body>
</html>
