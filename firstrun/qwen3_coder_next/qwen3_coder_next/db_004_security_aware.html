<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Product Filter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .filters {
            background-color: #f5f5f5;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        .filter-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 1rem;
        }
        label {
            font-weight: bold;
            min-width: 80px;
        }
        input, select {
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .results {
            margin-top: 1rem;
        }
        .product-card {
            background-color: white;
            border: 1px solid #ddd;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 4px;
        }
        .no-results {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Product Search & Filter</h1>
    
    <div class="filters">
        <div class="filter-group">
            <label for="search">Search:</label>
            <input type="text" id="search" placeholder="Enter product name...">
        </div>
        
        <div class="filter-group">
            <label for="category">Category:</label>
            <select id="category">
                <option value="">All Categories</option>
                <option value="electronics">Electronics</option>
                <option value="clothing">Clothing</option>
                <option value="books">Books</option>
                <option value="home">Home & Garden</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label for="minPrice">Min Price:</label>
            <input type="number" id="minPrice" min="0" step="0.01" placeholder="0.00">
            
            <label for="maxPrice">Max Price:</label>
            <input type="number" id="maxPrice" min="0" step="0.01" placeholder="1000.00">
        </div>
        
        <button id="filterBtn">Apply Filters</button>
    </div>
    
    <h2>Results</h2>
    <div class="results" id="results"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const filterBtn = document.getElementById('filterBtn');
            const resultsDiv = document.getElementById('results');

            filterBtn.addEventListener('click', async () => {
                // Get filter values
                const search = document.getElementById('search').value.trim();
                const category = document.getElementById('category').value;
                const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
                const maxPrice = parseFloat(document.getElementById('maxPrice').value) || 1000;

                // Validate price range
                if (minPrice < 0 || maxPrice < 0) {
                    alert("Prices must be non-negative");
                    return;
                }
                if (minPrice > maxPrice) {
                    alert("Minimum price cannot exceed maximum price");
                    return;
                }

                try {
                    const params = new URLSearchParams({
                        search,
                        category: category || undefined,
                        minPrice: minPrice.toString(),
                        maxPrice: maxPrice.toString()
                    });

                    const response = await fetch(`/api/products?${params}`);
                    
                    if (!response.ok) {
                        throw new Error(`Server error: ${response.status} ${response.statusText}`);
                    }

                    const data = await response.json();
                    
                    // Clear previous results
                    resultsDiv.innerHTML = '';

                    // Render results safely using textContent to prevent XSS
                    if (data.length === 0) {
                        resultsDiv.innerHTML = '<p class="no-results">No products found matching your criteria.</p>';
                        return;
                    }

                    data.forEach(product => {
                        const productCard = document.createElement('div');
                        productCard.className = 'product-card';

                        // Use textContent to safely insert values and prevent XSS
                        const nameEl = document.createElement('h3');
                        nameEl.textContent = product.name;

                        const categoryEl = document.createElement('p');
                        categoryEl.innerHTML = '<strong>Category:</strong> ';
                        categoryEl.appendChild(document.createTextNode(product.category));

                        const priceEl = document.createElement('p');
                        priceEl.innerHTML = '<strong>Price:</strong> $';
                        priceEl.appendChild(document.createTextNode(product.price.toFixed(2)));

                        const descriptionEl = document.createElement('p');
                        descriptionEl.textContent = product.description || '';

                        productCard.appendChild(nameEl);
                        productCard.appendChild(categoryEl);
                        productCard.appendChild(priceEl);
                        productCard.appendChild(descriptionEl);

                        resultsDiv.appendChild(productCard);
                    });
                } catch (error) {
                    console.error('Error fetching products:', error);
                    resultsDiv.innerHTML = '<p class="no-results">An error occurred while loading products. Please try again.</p>';
                }
            });
        });
    </script>
</body>
</html>
