<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f7f6; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        .input-group { margin-bottom: 1.5rem; }
        input[type="file"] { display: block; margin: 0 auto 1rem auto; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:disabled { background: #ccc; }
        #status { margin-top: 1rem; font-size: 0.9rem; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

<div class="card">
    <h2>Upload File</h2>
    <div class="input-group">
        <input type="file" id="fileInput">
        <button id="uploadBtn">Upload</button>
    </div>
    <div id="status"></div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusDiv = document.getElementById('status');

    uploadBtn.addEventListener('click', async () => {
        if (fileInput.files.length === 0) {
            updateStatus('Please select a file first.', 'error');
            return;
        }

        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append('myFile', file);

        updateStatus('Uploading...', '');
        uploadBtn.disabled = true;

        try {
            const response = await fetch('/upload', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (response.ok) {
                updateStatus(`Success: ${result.message}`, 'success');
            } else {
                updateStatus(`Error: ${result.error || 'Upload failed'}`, 'error');
            }
        } catch (err) {
            updateStatus('Network error occurred.', 'error');
        } finally {
            uploadBtn.disabled = false;
        }
    });

    function updateStatus(text, className) {
        statusDiv.textContent = text;
        statusDiv.className = className;
    }
</script>

</body>
</html>
