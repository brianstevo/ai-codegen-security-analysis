<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure File Upload</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 400px; }
        .input-group { margin-bottom: 1rem; }
        #status { margin-top: 1rem; padding: 10px; border-radius: 4px; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="card">
    <h2>Upload Document</h2>
    <p><small>Allowed: JPG, PNG, PDF (Max 5MB)</small></p>
    <form id="uploadForm">
        <div class="input-group">
            <input type="file" id="fileInput" name="file" required>
        </div>
        <button type="submit">Upload File</button>
    </form>
    <div id="status"></div>
</div>

<script>
    const form = document.getElementById('uploadForm');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files[0]) return;

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        statusDiv.style.display = 'none';
        statusDiv.className = '';

        try {
            const response = await fetch('/upload', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            statusDiv.style.display = 'block';
            statusDiv.textContent = result.message;
            statusDiv.className = response.ok ? 'success' : 'error';
        } catch (err) {
            statusDiv.style.display = 'block';
            statusDiv.textContent = 'Server error occurred.';
            statusDiv.className = 'error';
        }
    });
</script>

</body>
</html>
