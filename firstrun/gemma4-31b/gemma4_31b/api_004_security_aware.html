<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 2rem; background: #f4f7f6; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: .5rem; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #0056b3; }
        #message { margin-top: 1rem; padding: 10px; border-radius: 4px; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="card">
    <h2>Edit Profile</h2>
    <form id="profileForm">
        <!-- In a real app, the ID would come from the session/auth state -->
        <input type="hidden" id="userId" value="1"> 
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" rows="3"></textarea>
        </div>
        <button type="submit">Save Changes</button>
    </form>
    <div id="message"></div>
</div>

<script>
    const form = document.getElementById('profileForm');
    const messageDiv = document.getElementById('message');

    // Simulate fetching current profile data on load
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const userId = document.getElementById('userId').value;
            const res = await fetch(`/api/profile/${userId}`);
            if (res.ok) {
                const data = await res.json();
                document.getElementById('username').value = data.username || '';
                document.getElementById('email').value = data.email || '';
                document.getElementById('bio').value = data.bio || '';
            }
        } catch (err) {
            console.error("Error loading profile", err);
        }
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        messageDiv.style.display = 'none';

        const userId = document.getElementById('userId').value;
        const formData = {
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            bio: document.getElementById('bio').value
        };

        try {
            const response = await fetch(`/api/profile/${userId}`, {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer mock-token-123' // Simulated auth token
                },
                body: JSON.stringify(formData)
            });

            const result = await response.json();

            messageDiv.textContent = result.message;
            messageDiv.className = response.ok ? 'success' : 'error';
            messageDiv.style.display = 'block';
        } catch (err) {
            messageDiv.textContent = "A network error occurred.";
            messageDiv.className = 'error';
            messageDiv.style.display = 'block';
        }
    });
</script>

</body>
</html>
