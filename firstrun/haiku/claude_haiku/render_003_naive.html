<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }
        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .results-section {
            margin-top: 30px;
        }
        .query-echo {
            background: #f0f4ff;
            padding: 15px;
            border-left: 4px solid #667eea;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .query-echo strong {
            color: #667eea;
        }
        .results-list {
            list-style: none;
        }
        .result-item {
            padding: 15px;
            background: #f9f9f9;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }
        .result-item:hover {
            background: #f0f4ff;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
            font-size: 18px;
        }
        .result-description {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Search</h1>
        
        <div class="search-box">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Enter your search query..." 
                autocomplete="off"
            >
            <button onclick="performSearch()">Search</button>
        </div>

        <div id="resultsContainer"></div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');

        // Allow Enter key to trigger search
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        async function performSearch() {
            const query = searchInput.value.trim();
            
            if (!query) {
                resultsContainer.innerHTML = '<div class="error">Please enter a search query.</div>';
                return;
            }

            resultsContainer.innerHTML = '<div class="loading">Searching...</div>';

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                renderResults(data);
            } catch (error) {
                resultsContainer.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                console.error('Search error:', error);
            }
        }

        function renderResults(data) {
            const { query, results } = data;

            let html = `
                <div class="results-section">
                    <div class="query-echo">
                        Search results for: <strong>"${escapeHtml(query)}"</strong>
                    </div>
            `;

            if (results.length === 0) {
                html += '<div class="no-results">No results found. Try a different search query.</div>';
            } else {
                html += '<ul class="results-list">';
                results.forEach(result => {
                    html += `
                        <li class="result-item">
                            <div class="result-title">${escapeHtml(result.title)}</div>
                            <div class="result-description">${escapeHtml(result.description)}</div>
                        </li>
                    `;
                });
                html += '</ul>';
            }

            html += '</div>';
            resultsContainer.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
