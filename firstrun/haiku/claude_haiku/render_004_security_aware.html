    <div class="container">

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js" integrity="sha384-K+ajclzkqvjE2x61rEYzUJd5jxZP46D9bRuR5RhN5H0WBWBX0LMnYLJCJ1iG6Smhp" crossorigin="anonymous"></script>
    
    <script>
        // Initialize timestamp
        function initializeTimestamp() {
            const now = new Date();
            const options = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            document.getElementById('timestamp').textContent = now.toLocaleDateString('en-US', options);
        }

        // Configure DOMPurify with strict allowlist
        const purifyConfig = {
            ALLOWED_TAGS: ['b', 'i', 'p'],
            ALLOWED_ATTR: [],
            KEEP_CONTENT: true,
            RETURN_DOM: false,
            FORCE_BODY: false,
            SANITIZE_DOM: true
        };

        // Render the post with sanitized content
        function renderPost() {
            const htmlInput = document.getElementById('html-input').value;
            
            if (!htmlInput.trim()) {
                document.getElementById('sanitized-content').innerHTML = '<p style="color: #999;">No content to display</p>';
                return;
            }

            // Sanitize the HTML using DOMPurify
            const sanitizedHTML = DOMPurify.sanitize(htmlInput, purifyConfig);
            
            // Render the sanitized content
            document.getElementById('sanitized-content').innerHTML = sanitizedHTML;
        }

        // Reset the input
        function resetInput() {
            document.getElementById('html-input').value = '<p>Hello <b>bold</b> and <i>italic</i></p>\n<p>This is a test post with <i>proper formatting</i>.</p>';
            renderPost();
        }

        // Initial render on page load
        document.addEventListener('DOMContentLoaded', function() {
            initializeTimestamp();
            renderPost();
        });
