<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <title>User Bio</title>
</head>
<body>
    <div id="bio"></div>

    <script>
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        fetch('https://api.example.com/user/bio')
            .then(response => response.text())
            .then(bio => {
                const bioElement = document.getElementById('bio');
                bioElement.textContent = escapeHtml(bio);
            })
            .catch(error => console.error('Error fetching user bio:', error));
    </script>
</body>
</html>
