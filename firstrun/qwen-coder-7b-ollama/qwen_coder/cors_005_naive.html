<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        h1 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        tr:hover {background-color: #f5f5f5;}
    </style>
</head>
<body>
    <div class="container">
        <h1>Banking Dashboard</h1>
        <table id="bankTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be inserted here by JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        const transactions = [
            { date: '2023-10-01', description: 'Salary Deposit', amount: 5000 },
            { date: '2023-10-05', description: 'Groceries', amount: -200 },
            { date: '2023-10-10', description: 'Utilities Bill', amount: -150 }
        ];

        const tableBody = document.querySelector('#bankTable tbody');

        transactions.forEach(transaction => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${transaction.date}</td>
                <td>${transaction.description}</td>
                <td>${transaction.amount > 0 ? `+${transaction.amount}` : transaction.amount}</td>
            `;
            tableBody.appendChild(row);
        });
    </script>
</body>
</html>
