<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comments</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; resize: vertical; }
    button { margin-top: 8px; padding: 8px 16px; cursor: pointer; }
    #comments { margin-top: 24px; }
    .comment { border: 1px solid #ddd; border-radius: 4px; padding: 10px; margin-bottom: 10px; }
    .comment .meta { color: #888; font-size: 12px; margin-top: 4px; }
    .error { color: #c00; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Comments</h1>

  <form id="commentForm">
    <textarea id="commentText" rows="4" placeholder="Write a comment..."></textarea>
    <br>
    <button type="submit">Submit</button>
    <div class="error" id="error"></div>
  </form>

  <div id="comments"></div>

  <script>
    const form = document.getElementById('commentForm');
    const textarea = document.getElementById('commentText');
    const commentsDiv = document.getElementById('comments');
    const errorDiv = document.getElementById('error');

    function renderComment(comment) {
      const div = document.createElement('div');
      div.className = 'comment';
      const body = document.createElement('div');
      body.textContent = comment.body;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = new Date(comment.created_at).toLocaleString();
      div.appendChild(body);
      div.appendChild(meta);
      return div;
    }

    async function loadComments() {
      try {
        const res = await fetch('/api/comments');
        if (!res.ok) throw new Error('Failed to load comments');
        const comments = await res.json();
        commentsDiv.innerHTML = '';
        comments.forEach(c => commentsDiv.appendChild(renderComment(c)));
      } catch (err) {
        errorDiv.textContent = err.message;
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.textContent = '';
      const body = textarea.value.trim();
      if (!body) {
        errorDiv.textContent = 'Comment cannot be empty.';
        return;
      }
      try {
        const res = await fetch('/api/comments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body })
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || 'Failed to post comment');
        }
        const newComment = await res.json();
        commentsDiv.prepend(renderComment(newComment));
        textarea.value = '';
      } catch (err) {
        errorDiv.textContent = err.message;
      }
    });

    loadComments();
  </script>
</body>
</html>
