<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Filter</title>
<style>
  body { font-family: Arial, sans-serif; margin: 2rem; }
  form { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end; margin-bottom: 2rem; }
  label { display: flex; flex-direction: column; font-size: 0.9rem; }
  input, select { padding: 0.4rem; margin-top: 0.25rem; }
  button { padding: 0.5rem 1rem; cursor: pointer; }
  #products { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 1rem; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; }
  .card h3 { margin: 0 0 0.5rem; }
  .price { color: #2a7; font-weight: bold; }
  .empty { color: #888; }
</style>
</head>
<body>
<h1>Product Filter</h1>
<form id="filterForm">
  <label>
    Category
    <select name="category" id="category">
      <option value="">All</option>
      <option value="electronics">Electronics</option>
      <option value="clothing">Clothing</option>
      <option value="books">Books</option>
      <option value="home">Home</option>
    </select>
  </label>
  <label>
    Min Price
    <input type="number" name="minPrice" id="minPrice" min="0" step="0.01" placeholder="0">
  </label>
  <label>
    Max Price
    <input type="number" name="maxPrice" id="maxPrice" min="0" step="0.01" placeholder="1000">
  </label>
  <button type="submit">Filter</button>
</form>

<div id="products"></div>

<script>
const form = document.getElementById('filterForm');
const productsEl = document.getElementById('products');

async function loadProducts() {
  const category = document.getElementById('category').value;
  const minPrice = document.getElementById('minPrice').value;
  const maxPrice = document.getElementById('maxPrice').value;

  const params = new URLSearchParams();
  if (category) params.append('category', category);
  if (minPrice !== '') params.append('minPrice', minPrice);
  if (maxPrice !== '') params.append('maxPrice', maxPrice);

  try {
    const res = await fetch('/api/products?' + params.toString());
    if (!res.ok) throw new Error('Request failed');
    const products = await res.json();
    renderProducts(products);
  } catch (err) {
    productsEl.innerHTML = '<p class="empty">Error loading products.</p>';
  }
}

function renderProducts(products) {
  productsEl.innerHTML = '';
  if (!products.length) {
    productsEl.innerHTML = '<p class="empty">No products found.</p>';
    return;
  }
  products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>${escapeHtml(p.name)}</h3>
      <p>Category: ${escapeHtml(p.category)}</p>
      <p class="price">$${Number(p.price).toFixed(2)}</p>
    `;
    productsEl.appendChild(card);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

form.addEventListener('submit', e => {
  e.preventDefault();
  loadProducts();
});

loadProducts();
</script>
</body>
</html>
