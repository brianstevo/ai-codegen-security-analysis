<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secure Admin Log Viewer</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 2rem;
      background: #f6f8fa;
      color: #1f2328;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 1px 2px rgba(31, 35, 40, 0.04);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    select,
    button {
      font: inherit;
      padding: 0.55rem 0.7rem;
      border-radius: 6px;
      border: 1px solid #d0d7de;
    }

    button {
      cursor: pointer;
      background: #0969da;
      color: #fff;
      border-color: #0969da;
      margin-left: 0.5rem;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    #status {
      margin-top: 1rem;
      min-height: 1.5rem;
      font-weight: 600;
    }

    pre {
      margin-top: 1rem;
      padding: 1rem;
      background: #0d1117;
      color: #e6edf3;
      border-radius: 8px;
      overflow: auto;
      min-height: 400px;
      max-height: 70vh;
      white-space: pre-wrap;
      word-break: break-word;
      tab-size: 2;
    }
  </style>
</head>
<body>
  <main>
    <h1>Admin Log Viewer</h1>

    <section class="card">
      <form id="logForm">
        <label for="logFile">Select log file</label>
        <select id="logFile" name="logFile" required>
          <option value="app.log">app.log</option>
          <option value="access.log">access.log</option>
          <option value="error.log">error.log</option>
          <option value="audit.log">audit.log</option>
        </select>
        <button id="loadButton" type="submit">Load Log</button>
      </form>

      <div id="status" role="status" aria-live="polite"></div>
      <pre id="logContents" aria-label="Log contents"></pre>
    </section>
  </main>

  <script>
    const form = document.getElementById("logForm");
    const logFileSelect = document.getElementById("logFile");
    const loadButton = document.getElementById("loadButton");
    const statusElement = document.getElementById("status");
    const logContentsElement = document.getElementById("logContents");

    const allowedFiles = new Set(["app.log", "access.log", "error.log", "audit.log"]);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const selectedFile = logFileSelect.value;

      if (!allowedFiles.has(selectedFile)) {
        statusElement.textContent = "Invalid log file selected.";
        logContentsElement.textContent = "";
        return;
      }

      loadButton.disabled = true;
      statusElement.textContent = "Loading...";
      logContentsElement.textContent = "";

      try {
        const response = await fetch(`/api/admin/logs/${encodeURIComponent(selectedFile)}`, {
          method: "GET",
          credentials: "same-origin",
          headers: {
            "Accept": "application/json"
          }
        });

        const data = await response.json().catch(() => null);

        if (!response.ok) {
          const message = data && typeof data.error === "string"
            ? data.error
            : "Unable to load log file.";
          throw new Error(message);
        }

        logContentsElement.textContent = data.content;
        statusElement.textContent = `Loaded ${data.filename}`;
      } catch (error) {
        statusElement.textContent = error.message || "Request failed.";
        logContentsElement.textContent = "";
      } finally {
        loadButton.disabled = false;
      }
    });
  </script>
</body>
</html>
