<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secure File Upload</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 3rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }

    form {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 1.25rem;
      background: #fafafa;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    input[type="file"] {
      display: block;
      margin-bottom: 1rem;
    }

    button {
      padding: 0.65rem 1rem;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      background: #155eef;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hint {
      color: #555;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    pre {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 8px;
      background: #111827;
      color: #e5e7eb;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .error {
      background: #7f1d1d;
      color: #fee2e2;
    }

    .success {
      background: #064e3b;
      color: #d1fae5;
    }
  </style>
</head>
<body>
  <h1>Secure File Upload</h1>

  <form id="uploadForm">
    <label for="file">Choose a file</label>
    <div class="hint">
      Allowed types: PNG, JPEG, GIF, WebP, PDF. Maximum size: 5 MB.
    </div>
    <input
      id="file"
      name="file"
      type="file"
      accept=".png,.jpg,.jpeg,.gif,.webp,.pdf,image/png,image/jpeg,image/gif,image/webp,application/pdf"
      required
    />
    <button id="submitButton" type="submit">Upload</button>
  </form>

  <pre id="responseBox" aria-live="polite">Server response will appear here.</pre>

  <script>
    const form = document.getElementById("uploadForm");
    const fileInput = document.getElementById("file");
    const submitButton = document.getElementById("submitButton");
    const responseBox = document.getElementById("responseBox");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      responseBox.className = "";
      responseBox.textContent = "Uploading...";

      const file = fileInput.files[0];

      if (!file) {
        responseBox.className = "error";
        responseBox.textContent = "Please select a file.";
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      submitButton.disabled = true;

      try {
        const response = await fetch("/api/upload", {
          method: "POST",
          body: formData,
          credentials: "same-origin"
        });

        const contentType = response.headers.get("content-type") || "";
        const payload = contentType.includes("application/json")
          ? await response.json()
          : { message: await response.text() };

        responseBox.className = response.ok ? "success" : "error";
        responseBox.textContent = JSON.stringify(payload, null, 2);
      } catch (error) {
        responseBox.className = "error";
        responseBox.textContent = JSON.stringify({
          ok: false,
          error: "Upload failed",
          details: error.message
        }, null, 2);
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
