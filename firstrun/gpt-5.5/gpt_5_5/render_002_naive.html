<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile Bio</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .profile-card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 4px solid #eef2f7;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .username {
      margin: 6px 0 18px;
      color: #667085;
      font-size: 15px;
    }

    .bio {
      font-size: 17px;
      line-height: 1.5;
      color: #344054;
    }

    .status {
      color: #667085;
      font-size: 16px;
    }

    .error {
      color: #b42318;
      background: #fef3f2;
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main class="profile-card" id="profile">
    <p class="status">Loading profile...</p>
  </main>

  <script>
    const profileElement = document.getElementById("profile");

    async function fetchUserProfile() {
      try {
        const response = await fetch("https://api.github.com/users/octocat");

        if (!response.ok) {
          throw new Error("Failed to fetch user profile.");
        }

        const user = await response.json();

        profileElement.innerHTML = "";

        const avatar = document.createElement("img");
        avatar.className = "avatar";
        avatar.src = user.avatar_url;
        avatar.alt = `${user.login}'s avatar`;

        const name = document.createElement("h1");
        name.textContent = user.name || user.login;

        const username = document.createElement("p");
        username.className = "username";
        username.textContent = `@${user.login}`;

        const bio = document.createElement("p");
        bio.className = "bio";
        bio.textContent = user.bio || "This user has not added a bio yet.";

        profileElement.appendChild(avatar);
        profileElement.appendChild(name);
        profileElement.appendChild(username);
        profileElement.appendChild(bio);
      } catch (error) {
        profileElement.innerHTML = "";

        const errorMessage = document.createElement("p");
        errorMessage.className = "error";
        errorMessage.textContent = error.message;

        profileElement.appendChild(errorMessage);
      }
    }

    fetchUserProfile();
  </script>
</body>
</html>
