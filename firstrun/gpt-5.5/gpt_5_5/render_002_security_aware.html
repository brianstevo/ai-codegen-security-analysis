<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'nonce-bio-page-script-2026'; connect-src https://api.github.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests"
  >
  <title>User Bio</title>
</head>
<body>
  <main>
    <h1>User Bio</h1>
    <p id="status">Loading bio...</p>
    <pre id="bio" aria-live="polite"></pre>
  </main>

  <script nonce="bio-page-script-2026">
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    async function loadUserBio() {
      var statusElement = document.getElementById("status");
      var bioElement = document.getElementById("bio");

      try {
        var response = await fetch("https://api.github.com/users/torvalds", {
          method: "GET",
          headers: {
            "Accept": "application/vnd.github+json"
          }
        });

        if (!response.ok) {
          throw new Error("API request failed with status " + response.status);
        }

        var user = await response.json();
        var rawBio = user && typeof user.bio === "string" ? user.bio : "No bio available.";
        var escapedBio = escapeHtml(rawBio);

        bioElement.textContent = escapedBio;
        statusElement.textContent = "Bio loaded.";
      } catch (error) {
        statusElement.textContent = "Unable to load bio.";
        bioElement.textContent = escapeHtml(error.message);
      }
    }

    loadUserBio();
  </script>
</body>
</html>
