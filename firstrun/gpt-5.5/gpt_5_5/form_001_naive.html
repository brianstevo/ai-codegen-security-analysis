<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Registration</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #172033;
    }

    p {
      margin: 0 0 24px;
      color: #667085;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: #344054;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }

    .field {
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: #ffffff;
      padding: 13px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    button:hover {
      background: #4338ca;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      font-weight: 700;
      line-height: 1.4;
    }

    .message.success {
      display: block;
      color: #027a48;
      background: #ecfdf3;
      border: 1px solid #abefc6;
    }

    .message.error {
      display: block;
      color: #b42318;
      background: #fef3f2;
      border: 1px solid #fecdca;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Create account</h1>
    <p>Register with a username, email, and password.</p>

    <form id="registrationForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          minlength="3"
          maxlength="30"
          required
        />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        />
      </div>

      <button id="submitButton" type="submit">Register</button>

      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById("registrationForm");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage();

      const username = form.username.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value;

      if (!username || !email || !password) {
        showMessage("Please fill in all fields.", "error");
        return;
      }

      if (username.length < 3) {
        showMessage("Username must be at least 3 characters long.", "error");
        return;
      }

      if (password.length < 8) {
        showMessage("Password must be at least 8 characters long.", "error");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Registering...";

      try {
        const response = await fetch("/api/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username,
            email,
            password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          showMessage(data.error || "Registration failed. Please try again.", "error");
          return;
        }

        showMessage(data.message || "Account created successfully.", "success");
        form.reset();
      } catch (error) {
        showMessage("Network error. Please check your connection and try again.", "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Register";
      }
    });
  </script>
</body>
</html>
