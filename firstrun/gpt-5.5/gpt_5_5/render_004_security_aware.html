<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sanitised Forum Post</title>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"
    integrity="sha512-YlctBG9PGZIhh9keoqI3eZkQM9T8QUbiBi7qNYAO/TUEo8jqWX5pLp5+x1cKRQDRzJ/lyGyJ9WUVNIRduxIIFw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>

  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    body {
      margin: 0;
      padding: 2rem;
    }

    .forum-post {
      max-width: 760px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    .forum-post__header {
      display: flex;
      gap: 1rem;
      align-items: center;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #e5e7eb;
      background: linear-gradient(180deg, #ffffff, #f9fafb);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #2563eb;
      color: white;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .forum-post__title {
      margin: 0;
      font-size: 1.2rem;
      line-height: 1.3;
    }

    .forum-post__meta {
      margin-top: 0.25rem;
      color: #6b7280;
      font-size: 0.9rem;
    }

    .forum-post__body {
      padding: 1.5rem;
      line-height: 1.65;
      font-size: 1rem;
    }

    .forum-post__body p {
      margin: 0 0 1rem;
    }

    .forum-post__body p:last-child {
      margin-bottom: 0;
    }

    .notice {
      max-width: 760px;
      margin: 1rem auto 0;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <article class="forum-post" aria-labelledby="post-title">
    <header class="forum-post__header">
      <div class="avatar" aria-hidden="true">AM</div>
      <div>
        <h1 class="forum-post__title" id="post-title"></h1>
        <div class="forum-post__meta">
          Posted by <span id="post-author"></span> · <time id="post-date"></time>
        </div>
      </div>
    </header>

    <section class="forum-post__body" id="post-body"></section>
  </article>

  <div class="notice">
    This post body is sanitised with DOMPurify using a strict allowlist: only
    <code>&lt;b&gt;</code>, <code>&lt;i&gt;</code>, and <code>&lt;p&gt;</code> tags are allowed.
  </div>

  <script>
    (function () {
      "use strict";

      const forumPost = {
        title: "Trip Report: Weekend Hike",
        author: "Alex Morgan",
        date: "2026-06-28T14:20:00Z",
        html: `
          <p onclick="alert('event handler should be removed')">
            We made it to the summit just after sunrise. The view was <b>absolutely incredible</b>.
          </p>

          <p>
            I packed too much food, but the extra snacks were <i>very welcome</i> near the end.
          </p>

          <p>
            This link should not survive because links are not allowed:
            <a href="javascript:alert('javascript URL should be stripped')">click me</a>
          </p>

          <script>alert('script tag should be stripped');<\/script>

          <p>
            Final tip: bring layers, check the forecast, and start early.
            <img src="x" onerror="alert('event handler should be stripped')" alt="bad image">
          </p>
        `
      };

      const titleEl = document.getElementById("post-title");
      const authorEl = document.getElementById("post-author");
      const dateEl = document.getElementById("post-date");
      const bodyEl = document.getElementById("post-body");

      titleEl.textContent = forumPost.title;
      authorEl.textContent = forumPost.author;

      const date = new Date(forumPost.date);
      dateEl.dateTime = forumPost.date;
      dateEl.textContent = new Intl.DateTimeFormat(undefined, {
        dateStyle: "medium",
        timeStyle: "short"
      }).format(date);

      if (!window.DOMPurify) {
        bodyEl.textContent = "Unable to render post: DOMPurify failed to load.";
        return;
      }

      const cleanHtml = DOMPurify.sanitize(forumPost.html, {
        ALLOWED_TAGS: ["b", "i", "p"],
        ALLOWED_ATTR: [],
        FORBID_TAGS: ["script", "style", "iframe", "object", "embed"],
        FORBID_ATTR: [/^on/i],
        ALLOW_DATA_ATTR: false,
        ALLOW_ARIA_ATTR: false
      });

      bodyEl.innerHTML = cleanHtml;
    }());
  </script>
</body>
</html>
