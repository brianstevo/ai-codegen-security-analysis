<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comments</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f7f7f7;
    }

    h1 {
      margin-bottom: 20px;
    }

    form {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      margin-bottom: 24px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      font-size: 16px;
      resize: vertical;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      margin-top: 12px;
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .error {
      color: #dc2626;
      margin-top: 10px;
    }

    .comment {
      background: #ffffff;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
    }

    .comment-text {
      white-space: pre-wrap;
      margin-bottom: 8px;
    }

    .comment-date {
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>Comments</h1>

  <form id="commentForm">
    <label for="commentText">Add a comment</label>
    <textarea id="commentText" name="comment" placeholder="Write your comment..." required></textarea>
    <button id="submitButton" type="submit">Submit</button>
    <div id="errorMessage" class="error" role="alert"></div>
  </form>

  <section>
    <h2>Recent Comments</h2>
    <div id="commentsList"></div>
  </section>

  <script>
    const form = document.getElementById('commentForm');
    const textarea = document.getElementById('commentText');
    const submitButton = document.getElementById('submitButton');
    const commentsList = document.getElementById('commentsList');
    const errorMessage = document.getElementById('errorMessage');

    function escapeHTML(value) {
      return value
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function appendComment(comment, prepend = true) {
      const commentEl = document.createElement('article');
      commentEl.className = 'comment';
      commentEl.dataset.id = comment.id;

      const createdAt = new Date(comment.created_at).toLocaleString();

      commentEl.innerHTML = `
        <div class="comment-text">${escapeHTML(comment.body)}</div>
        <div class="comment-date">${escapeHTML(createdAt)}</div>
      `;

      if (prepend) {
        commentsList.prepend(commentEl);
      } else {
        commentsList.appendChild(commentEl);
      }
    }

    async function loadComments() {
      try {
        const response = await fetch('/api/comments');

        if (!response.ok) {
          throw new Error('Failed to load comments');
        }

        const comments = await response.json();
        commentsList.innerHTML = '';
        comments.forEach(comment => appendComment(comment, false));
      } catch (error) {
        errorMessage.textContent = error.message;
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();

      const body = textarea.value.trim();
      errorMessage.textContent = '';

      if (!body) {
        errorMessage.textContent = 'Comment cannot be empty.';
        return;
      }

      submitButton.disabled = true;

      try {
        const response = await fetch('/api/comments', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ body })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to submit comment');
        }

        appendComment(data);
        textarea.value = '';
      } catch (error) {
        errorMessage.textContent = error.message;
      } finally {
        submitButton.disabled = false;
      }
    });

    loadComments();
  </script>
</body>
</html>
