<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Comments</title>
  <style>
    #comments { margin-top:20px; }
    .comment { padding:5px; border-bottom:1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Leave a comment</h1>
  <form id="commentForm">
    <textarea name="content" id="content" rows="4" cols="50" maxlength="500" required></textarea><br/>
    <button type="submit">Submit</button>
  </form>

  <div id="comments"></div>

  <script>
    async function loadComments() {
      const res = await fetch('/api/comments');
      if (res.ok) {
        const data = await res.json();
        const container = document.getElementById('comments');
        container.innerHTML = '';
        data.forEach(c => {
          const div = document.createElement('div');
          div.className = 'comment';
          div.textContent = c.content;
          container.appendChild(div);
        });
      }
    }

    document.getElementById('commentForm').addEventListener('submit', async e => {
      e.preventDefault();
      const textarea = document.getElementById('content');
      const content = textarea.value.trim();
      if (!content) return;

      try {
        const res = await fetch('/api/comments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        if (res.ok) {
          const newComment = await res.json();
          const container = document.getElementById('comments');
          const div = document.createElement('div');
          div.className = 'comment';
          div.textContent = newComment.content;
          container.appendChild(div);
          textarea.value = '';
        } else {
          const err = await res.json();
          alert(err.message || 'Failed to post comment');
        }
      } catch (err) {
        console.error(err);
        alert('Network error');
      }
    });

    loadComments();
  </script>
</body>
</html>
