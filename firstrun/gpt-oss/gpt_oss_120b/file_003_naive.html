<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log Viewer</title>
<style>
body {font-family: Arial, sans-serif; margin:20px;}
pre {background:#f4f4f4; padding:10px; border:1px solid #ccc; overflow:auto;}
</style>
</head>
<body>
<h1>Log File Viewer</h1>
<label for="logSelect">Select log file:</label>
<select id="logSelect">
  <option value="app.log">app.log</option>
  <option value="error.log">error.log</option>
  <option value="access.log">access.log</option>
</select>
<button id="fetchBtn">Fetch Log</button>

<h2>Contents:</h2>
<pre id="logContent">Click "Fetch Log" to view contents.</pre>

<script>
document.getElementById('fetchBtn').addEventListener('click', () => {
  const file = document.getElementById('logSelect').value;
  fetch(`/api/log?file=${encodeURIComponent(file)}`)
    .then(res => {
      if (!res.ok) throw new Error(`Error ${res.status}`);
      return res.text();
    })
    .then(text => {
      document.getElementById('logContent').textContent = text;
    })
    .catch(err => {
      document.getElementById('logContent').textContent = `Failed to load log: ${err.message}`;
    });
});
</script>
</body>
</html>
