<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forum Post</title>
  <script
    src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"
    integrity="sha256-jtmXzGFB3UGMbDGFBBGCkXqAeqiYuyS5oFOJwGKQqbk="
    crossorigin="anonymous"
  ></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .page-wrapper {
      max-width: 780px;
      margin: 0 auto;
    }

    h1.page-title {
      font-size: 1.1rem;
      color: #6b7280;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .forum-thread {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .thread-header {
      padding: 1.5rem 1.75rem;
      border-bottom: 1px solid #e5e7eb;
      background: #fafafa;
    }

    .thread-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.5rem;
    }

    .thread-meta {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
      font-size: 0.82rem;
      color: #6b7280;
    }

    .thread-meta .tag {
      background: #eff6ff;
      color: #1d4ed8;
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.75rem;
    }

    .post-card {
      display: flex;
      gap: 0;
      border-bottom: 1px solid #f3f4f6;
    }

    .post-card:last-child {
      border-bottom: none;
    }

    .post-sidebar {
      width: 140px;
      min-width: 140px;
      padding: 1.5rem 1rem;
      background: #fafafa;
      border-right: 1px solid #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .username {
      font-weight: 700;
      font-size: 0.85rem;
      color: #111827;
      text-align: center;
    }

    .user-role {
      font-size: 0.72rem;
      color: #9ca3af;
      text-align: center;
    }

    .post-count {
      font-size: 0.72rem;
      color: #9ca3af;
      text-align: center;
    }

    .post-main {
      flex: 1;
      padding: 1.5rem 1.75rem;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .post-timestamp {
      font-size: 0.78rem;
      color: #9ca3af;
    }

    .post-number {
      font-size: 0.78rem;
      color: #9ca3af;
      background: #f3f4f6;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }

    .post-body {
      font-size: 0.97rem;
      line-height: 1.75;
      color: #374151;
    }

    .post-body p {
      margin-bottom: 0.85rem;
    }

    .post-body p:last-child {
      margin-bottom: 0;
    }

    .post-body b {
      color: #111827;
    }

    .post-body i {
      color: #4b5563;
    }

    .post-footer {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid #f3f4f6;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .reaction-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.82rem;
      color: #6b7280;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 0.3rem 0.75rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .reaction-btn:hover {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
    }

    .security-badge {
      margin-top: 2rem;
      padding: 0.75rem 1rem;
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #166534;
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .security-badge .icon {
      font-size: 1rem;
      flex-shrink: 0;
    }

    .warning-box {
      margin-top: 2rem;
      padding: 0.75rem 1rem;
      background: #fff7ed;
      border: 1px solid #fdba74;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #9a3412;
    }

    .warning-box h3 {
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
    }

    .warning-box pre {
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: 0.35rem;
      background: rgba(0,0,0,0.04);
      padding: 0.4rem;
      border-radius: 4px;
    }

    @media (max-width: 560px) {
      .post-sidebar {
        width: 90px;
        min-width: 90px;
        padding: 1rem 0.5rem;
      }
      .
