<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }

    .search-container {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      width: 100%;
      max-width: 500px;
    }

    .search-container input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 30px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-container input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .search-container input:focus {
      border-color: #e94560;
    }

    .search-container button {
      padding: 12px 24px;
      border-radius: 30px;
      border: none;
      background: #e94560;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
    }

    .search-container button:hover {
      background: #c73652;
    }

    .search-container button:active {
      transform: scale(0.97);
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 500px;
      width: 100%;
      color: #fff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-bottom: 28px;
    }

    .avatar-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #e94560;
    }

    .avatar-placeholder {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e94560, #0f3460);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      border: 3px solid #e94560;
    }

    .profile-names h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .profile-names .username {
      color: #e94560;
      font-size: 14px;
      font-weight: 500;
    }

    .bio {
      font-size: 15px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 28px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid #e94560;
      border-radius: 6px;
    }

    .bio.empty {
      font-style: italic;
      color: rgba(255, 255, 255, 0.4);
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 28px;
      padding: 16px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #e94560;
    }

    .stat-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .meta-info {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.65);
    }

    .meta-item .icon {
      font-size: 16px;
      flex-shrink: 0;
    }

    .profile-link {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 24px;
      background: transparent;
      border: 2px solid #e94560;
      border-radius: 30px;
      color: #e94560;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s;
      text-align: center;
      width: 100%;
    }

    .profile-link:hover {
      background: #e94560;
      color: #fff;
    }

    /* States */
    .state-box {
      max-width: 500px;
      width: 100%;
      text-align: center;
      padding: 40px;
      color: rgba(255, 255, 255, 0.6);
    }

    .state-box .state-icon {
      font-size: 50px;
      margin-bottom: 14px;
    }

    .state-box p {
      font-size: 16px;
    }

    .error-box {
      color: #e94560;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden { display: none; }
  </style>
</head>

  <div
