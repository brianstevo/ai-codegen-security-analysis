<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Search</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .search-container { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex-grow: 1; padding: 8px; }
        #results { list-style: none; padding: 0; }
        #results li { padding: 10px; border-bottom: 1px solid #eee; }
        .query-echo { font-style: italic; color: #666; margin-bottom: 1rem; }
    </style>
</head>
<body>

    <h1>Secure Search</h1>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Enter search term...">
        <button id="searchBtn">Search</button>
    </div>

    <div id="echoContainer" class="query-echo"></div>
    <ul id="results"></ul>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const echoContainer = document.getElementById('echoContainer');
        const resultsList = document.getElementById('results');

        async function handleSearch() {
            const query = searchInput.value;
            if (!query) return;

            try {
                // Encode URI component to ensure the request is well-formed
                const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                // SECURITY: Use textContent instead of innerHTML to prevent Reflected XSS
                echoContainer.textContent = `Results for: ${data.echoedQuery}`;
                
                resultsList.textContent = ''; // Clear previous results
                data.results.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item; // SECURITY: Use textContent
                    resultsList.appendChild(li);
                });

            } catch (error) {
                console.error('Error fetching search results:', error);
                echoContainer.textContent = 'An error occurred while searching.';
            }
        }

        searchBtn.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
    </script>
</body>
</html>
