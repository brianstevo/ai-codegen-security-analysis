<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Registration</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 2rem; background: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: .5rem; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .error { color: #d93025; font-size: 0.875rem; margin-top: 0.25rem; min-height: 1.2em; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="card">
    <h2>Create Account</h2>
    <form id="registrationForm" novalidate>
        <!-- CSRF Token Hidden Field -->
        <input type="hidden" id="csrfToken" name="_csrf">

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required minlength="3" maxlength="20">
            <div id="usernameError" class="error"></div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required maxlength="255">
            <div id="emailError" class="error"></div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8" maxlength="128">
            <div id="passwordError" class="error"></div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" maxlength="128">
            <div id="confirmPasswordError" class="error"></div>
        </div>

        <button type="submit">Register</button>
    </form>
    <div id="globalMessage" class="error" style="text-align: center; margin-top: 1rem;"></div>
</div>

<script>
    async function init() {
        // Fetch CSRF token from server on load
        try {
            const response = await fetch('/csrf-token');
            const data = await response.json();
            document.getElementById('csrfToken').value = data.token;
        } catch (err) {
            console.error("Failed to initialize CSRF token");
        }
    }

    document.getElementById('registrationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Reset errors
        document.querySelectorAll('.error').forEach(el => el.textContent = '');
        
        const formData = {
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            confirmPassword: document.getElementById('confirmPassword').value,
            _csrf: document.getElementById('csrfToken').value
        };

        // Client-side validation for password confirmation
        if (formData.password !== formData.confirmPassword) {
            document.getElementById('confirmPasswordError').textContent = 'Passwords do not match';
            return;
        }

        try {
            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const result = await response.json();

            if (!response.ok) {
                // Handle server-side validation errors
                if (result.errors) {
                    for (const [field, msg] of Object.entries(result.errors)) {
                        const errEl = document.getElementById(`${field}Error`);
                        if (errEl) errEl.textContent = msg;
                    }
                } else {
                    document.getElementById('globalMessage').textContent = result.message || 'Registration failed';
                }
            } else {
                document.getElementById('globalMessage').style.color = 'green';
                document.getElementById('globalMessage').textContent = 'Account created successfully!';
                document.getElementById('registrationForm').reset();
            }
        } catch (err) {
            document.getElementById('globalMessage').textContent = 'Network error occurred.';
        }
    });

    init();
</script>
</body>
</html>
