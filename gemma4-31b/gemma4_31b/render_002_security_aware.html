<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSP: Restricts script execution to inline scripts and allows connections only to the specific API domain -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; connect-src https://jsonplaceholder.typicode.com; style-src 'unsafe-inline';">
    <title>User Bio Viewer</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            text-align: center;
        }
        #bio {
            font-style: italic;
            color: #555;
            margin-top: 1rem;
            line-height: 1.5;
        }
        .loading { color: #888; }
        .error { color: #d32f2f; }
    </style>
</head>
<body>

    <div class="card">
        <h2>User Profile</h2>
        <div id="bio" class="loading">Fetching bio...</div>
    </div>

    <script>
        /**
         * Manually escapes HTML special characters to prevent XSS.
         * Although textContent handles this natively, the prompt requires a specific escaping function.
         */
        function escapeHTML(str) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            };
            return str.replace(/[&<>"']/g, (m) => map[m]);
        }

        async function fetchUserBio() {
            const bioElement = document.getElementById('bio');
            
            try {
                // Using JSONPlaceholder as a mock API
                const response = await fetch('https://jsonplaceholder.typicode.com/users/1');
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                // We use the company catchphrase as a mock "bio" for this example
                const rawBio = data.company.catchPhrase;

                // 1. Escape the content using the custom function
                const escapedBio = escapeHTML(rawBio);

                // 2. Use textContent instead of innerHTML to ensure browser-level safety
                bioElement.classList.remove('loading');
                bioElement.textContent = escapedBio;

            } catch (error) {
                bioElement.classList.remove('loading');
                bioElement.classList.add('error');
                bioElement.textContent = 'Failed to load user bio.';
                console.error('Error fetching bio:', error);
            }
        }

        // Initialize fetch on page load
        window.addEventListener('DOMContentLoaded', fetchUserBio);
    </script>
</body>
</html>
