<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Bio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 350px;
            padding: 2rem;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        #avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #4a90e2;
            margin-bottom: 1rem;
            object-fit: cover;
        }

        h2 {
            margin: 10px 0 5px 0;
            color: #333;
        }

        .email {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .bio-container {
            background: #f9f9f9;
            border-left: 4px solid #4a90e2;
            padding: 15px;
            margin: 20px 0;
            font-style: italic;
            color: #444;
            line-height: 1.6;
            text-align: left;
        }

        button {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #357abd;
        }

        .loading {
            opacity: 0.5;
            pointer-events: none;
        }

        #error-msg {
            color: #d9534f;
            font-size: 0.8rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card" id="profile-card">
        <img id="avatar" src="" alt="User Avatar">
        <h2 id="name">Loading...</h2>
        <div id="email" class="email"></div>
        
        <div class="bio-container">
            <strong>Bio:</strong><br>
            <span id="bio">Fetching user details...</span>
        </div>

        <button id="refresh-btn">Load New Profile</button>
        <div id="error-msg">Failed to fetch user data. Please try again.</div>
    </div>

    <script>
        const avatarEl = document.getElementById('avatar');
        const nameEl = document.getElementById('name');
        const emailEl = document.getElementById('email');
        const bioEl = document.getElementById('bio');
        const refreshBtn = document.getElementById('refresh-btn');
        const errorMsg = document.getElementById('error-msg');
        const card = document.getElementById('profile-card');

        /**
         * Fetches a random user from the RandomUser.me API.
         * Since this API doesn't provide a "bio" field by default, 
         * we simulate one using their location and login data.
         */
        async function fetchUserProfile() {
            try {
                // UI State: Loading
                card.classList.add('loading');
                errorMsg.style.display = 'none';
                bioEl.textContent = "Fetching user details...";

                const response = await fetch('https://randomuser.me/api/');
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                const user = data.results[0];

                // Update DOM
                avatarEl.src = user.picture.large;
                nameEl.textContent = `${user.name.first} ${user.name.last}`;
                emailEl.textContent = user.email;
                
                // Construct a "Bio" from available API data
                const bioText = `Hello! I'm a ${user.location.city} native living in ${user.location.country}. 
                                 I enjoy exploring the web and my current username is ${user.login.username}.`;
                bioEl.textContent = bioText;

            } catch (error) {
                console.error('Error fetching user:', error);
                errorMsg.style.display = 'block';
                bioEl.textContent = "Unable to load profile.";
            } finally {
                card.classList.remove('loading');
            }
        }

        // Event Listeners
        refreshBtn.addEventListener('click', fetchUserProfile);

        // Initial Load
        window.addEventListener('DOMContentLoaded', fetchUserProfile);
    </script>
</body>
</html>
